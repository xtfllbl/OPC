<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloading Apps</title>
    <link rel="stylesheet" href="app.css">
</head>

<body>
    <div class="device-container">
        <div class="main-content">
            <div class="glass-panel">
                <div class="spinner-container" style="margin-bottom: 60px;">
                    <div class="spinner" id="download-spinner"></div>
                    <div class="icon-center">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            style="width: 80px; height: 80px;">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                    </div>
                </div>
                <h1 class="title" id="progress-title">Configuring System</h1>
                <p class="subtitle" id="progress-subtitle">Connecting to server...</p>

                <div class="progress-bar-container"
                    style="width: 100%; height: 32px; background: rgba(0,0,0,0.4); border-radius: 16px; overflow: hidden; margin-top: 20px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);">
                    <div id="progress-fill"
                        style="width: 0%; height: 100%; background: linear-gradient(90deg, #2872ff, #60a5fa); border-radius: 16px; transition: width 0.4s ease; box-shadow: 0 0 30px rgba(40, 114, 255, 0.6);">
                    </div>
                </div>
                <div
                    style="width: 100%; display: flex; justify-content: space-between; margin-top: 24px; color: var(--text-sub); font-weight: 700; font-size: 24px;">
                    <span id="progress-percent">0%</span>
                    <span id="progress-step" style="color: var(--accent-main)">1/3</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const steps = [
            { progress: 15, title: "Downloading Payment App", sub: "Fetching latest version...", time: 500 },
            { progress: 45, title: "Installing Applications", sub: "Applying OPC modules...", time: 2000 },
            { progress: 85, title: "Applying Parameters", sub: "Configuring terminal parameters...", time: 4000 },
            { progress: 100, title: "Setup Complete!", sub: "Launching desktop...", time: 6000 }
        ];
        const fill = document.getElementById('progress-fill');
        const percent = document.getElementById('progress-percent');
        const title = document.getElementById('progress-title');
        const subtitle = document.getElementById('progress-subtitle');
        const stepLabel = document.getElementById('progress-step');

        steps.forEach((step, index) => {
            setTimeout(() => {
                fill.style.width = step.progress + '%';
                percent.innerText = step.progress + '%';
                title.innerText = step.title;
                subtitle.innerText = step.sub;
                if (index < 3) stepLabel.innerText = `${index + 1}/3`;
                else stepLabel.innerText = '';

                if (step.progress === 100) {
                    document.getElementById('download-spinner').style.animation = 'none';
                    document.getElementById('download-spinner').style.borderColor = 'var(--success-main)';
                    fill.style.background = 'linear-gradient(90deg, #10b981, #34d399)';
                    fill.style.boxShadow = '0 0 30px rgba(16, 185, 129, 0.6)';
                    stepLabel.style.color = 'var(--success-main)';
                    setTimeout(() => window.location.href = '06_desktop_mock.html', 1500);
                }
            }, step.time);
        });
    </script>
</body>

</html>
