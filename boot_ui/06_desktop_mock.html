<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Desktop Mock</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap");

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "DM Sans", sans-serif;
            user-select: none;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .device-container {
            width: 800px;
            height: 1280px;
            background: url('https://images.unsplash.com/photo-1620121478247-ec786f9be40f?q=80&w=2564&auto=format&fit=crop') center/cover;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 72px rgba(0, 0, 0, 0.8);
        }

        .status-bar {
            height: 56px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 32px;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
            font-weight: 500;
            font-size: 22px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.5), transparent);
        }

        .status-left,
        .status-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .widget-area {
            padding: 80px 48px;
            display: flex;
            flex-direction: column;
            color: #fff;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
        }

        .time {
            font-size: 140px;
            font-weight: 400;
            line-height: 1;
            letter-spacing: -2px;
        }

        .date {
            font-size: 36px;
            font-weight: 500;
            margin-top: 12px;
            opacity: 0.9;
        }

        .greeting {
            font-size: 48px;
            font-weight: 700;
            margin-top: 80px;
            line-height: 1.2;
        }

        .app-grid {
            flex: 1;
            padding: 48px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 60px 30px;
            align-content: start;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .app-icon:active {
            transform: scale(0.95);
        }

        .icon-box {
            width: 140px;
            height: 140px;
            border-radius: 40px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .icon-box svg {
            width: 80px;
            height: 80px;
        }

        .app-name {
            color: #fff;
            font-size: 24px;
            font-weight: 500;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        /* App Specific Colors */
        .app-payment {
            background: linear-gradient(135deg, #0A5BFF, #3b82f6);
            color: white;
        }

        .app-opc {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .app-settings {
            background: #334155;
            color: white;
        }

        .dock {
            height: 180px;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 0 30px;
        }
    </style>
</head>

<body>
    <div class="device-container">
        <div class="status-bar">
            <div class="status-left"><span id="clock-status">10:00</span></div>
            <div class="status-right">
                <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
                    <path d="M12 3C7.6 3 3.6 5 0.5 8.1L12 22l11.5-13.9C20.4 5 16.4 3 12 3z" />
                </svg>
                <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28">
                    <path
                        d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z" />
                </svg>
            </div>
        </div>

        <div class="widget-area">
            <div class="time" id="clock-main">10:00</div>
            <div class="date" id="date-main">Tuesday, Mar 4</div>
            <div class="greeting">Ready to process!</div>
        </div>

        <div class="app-grid">
            <div class="app-icon" onclick="alert('Opening Paywizard Payment...')">
                <div class="icon-box app-payment">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                    </svg>
                </div>
                <div class="app-name">Payment</div>
            </div>
            <div class="app-icon" onclick="alert('Opening Unified POS...')">
                <div class="icon-box app-opc">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                    </svg>
                </div>
                <div class="app-name">OPC Node</div>
            </div>
            <div class="app-icon" onclick="window.location.href='01_network_check.html'">
                <div class="icon-box app-settings">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </div>
                <div class="app-name">Settings</div>
            </div>
        </div>

        <div class="dock">
            <div class="app-icon">
                <div class="icon-box" style="border-radius: 50%;"><svg fill="none" viewBox="0 0 24 24" stroke="#10b981"
                        stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg></div>
            </div>
            <div class="app-icon">
                <div class="icon-box" style="border-radius: 50%;"><svg fill="none" viewBox="0 0 24 24" stroke="#0ea5e9"
                        stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                    </svg></div>
            </div>
            <div class="app-icon">
                <div class="icon-box" style="border-radius: 50%; background: #fff;"><svg fill="none" viewBox="0 0 24 24"
                        stroke="#f59e0b" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg></div>
            </div>
            <div class="app-icon">
                <div class="icon-box" style="border-radius: 50%;"><svg fill="none" viewBox="0 0 24 24" stroke="#ef4444"
                        stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg></div>
            </div>
        </div>
    </div>
    <script>
        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            let mins = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('clock-status').innerText = `${hours}:${mins}`;
            document.getElementById('clock-main').innerText = `${hours}:${mins}`;

            const options = { weekday: 'long', month: 'short', day: 'numeric' };
            document.getElementById('date-main').innerText = now.toLocaleDateString('en-US', options);
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>

</html>
