<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlocking Door</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --primary-gradient: linear-gradient(135deg, #007AFF 0%, #0056b3 100%);
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --text-main: #FFFFFF;
            --text-sub: #A0A0A0;
            --accent-warning: #FFD700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .device-container {
            width: 480px;
            height: 100vh;
            max-height: 800px;
            background: radial-gradient(140% 120% at 50% 0%, #1a1a1a 0%, #121212 45%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.55);
        }

        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
            height: 60px;
        }

        .unlock-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            gap: 36px;
        }

        .status-title {
            font-size: 34px;
            font-weight: 800;
            margin-top: 2px;
        }
        .status-sub {
            font-size: 18px;
            color: var(--text-sub);
            max-width: 320px;
            line-height: 1.4;
            margin-top: 8px;
        }


        .door-visual {
            position: relative;
            width: 240px;
            height: 320px;
            perspective: 1000px;
            perspective-origin: 78% 50%;
        }
        .signal-ring {
            position: absolute;
            inset: -16px;
            border-radius: 34px;
            border: 2px solid rgba(0, 122, 255, 0.2);
            box-shadow: 0 0 35px rgba(0, 122, 255, 0.25);
            animation: ringPulse 2.6s ease-in-out infinite;
            z-index: 0;
        }
        .cabinet {
            position: absolute;
            inset: 0;
            border-radius: 28px;
            background: linear-gradient(160deg, #0b2f53 0%, #0a1a2c 100%);
            border: 2px solid rgba(0, 122, 255, 0.55);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(0, 122, 255, 0.18);
            overflow: visible;
            z-index: 1;
            transform-style: preserve-3d;
        }
        .cabinet::before {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(10, 18, 28, 0.96), rgba(8, 14, 22, 0.88));
            border: 1px solid rgba(255, 255, 255, 0.06);
            filter: brightness(0.9);
            animation: interiorGlow 4.2s ease-in-out infinite;
            z-index: 1;
            pointer-events: none;
        }
        .cabinet::after {
            content: "";
            position: absolute;
            inset: 14px;
            border-radius: 18px;
            background: linear-gradient(90deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0));
            opacity: 0.2;
            transform: translateZ(2px);
            animation: doorShadow 4.2s ease-in-out infinite;
            z-index: 1;
            pointer-events: none;
        }
        .shelf {
            position: absolute;
            left: 24px;
            right: 24px;
            height: 8px;
            background: linear-gradient(90deg, rgba(0, 122, 255, 0.6), rgba(0, 122, 255, 0.2));
            border-radius: 8px;
            box-shadow: 0 0 12px rgba(0, 122, 255, 0.2);
            z-index: 2;
        }
        .shelf--1 { top: 90px; }
        .shelf--2 { top: 150px; }
        .shelf--3 { top: 210px; }

        .hinge {
            position: absolute;
            right: -6px;
            width: 12px;
            height: 26px;
            border-radius: 10px;
            background: linear-gradient(180deg, #25496b 0%, #0b1d32 100%);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.45), inset 0 0 6px rgba(255, 255, 255, 0.12);
            z-index: 6;
            transform: translateZ(6px);
        }
        .hinge--top { top: 54px; }
        .hinge--bottom { bottom: 54px; }

        .door-panel {
            position: absolute;
            top: 12px;
            left: 12px;
            width: calc(100% - 24px);
            height: calc(100% - 24px);
            border-radius: 20px;
            background: linear-gradient(145deg, #0f78e8 0%, #0b4c8d 50%, #08345f 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 18px 30px rgba(0, 0, 0, 0.45), inset 0 0 18px rgba(255, 255, 255, 0.08);
            transform-origin: 100% 50%;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            animation: doorSwing 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            z-index: 3;
        }
        .door-panel::before {
            content: "";
            position: absolute;
            right: -12px;
            top: 0;
            width: 12px;
            height: 100%;
            border-radius: 0 18px 18px 0;
            background: linear-gradient(180deg, #0b2f53 0%, #071a2c 100%);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.45);
            transform: translateZ(2px);
        }
        .door-panel::after {
            content: none;
        }
        .door-handle {
            position: absolute;
            left: 16px;
            top: 42%;
            width: 12px;
            height: 56px;
            border-radius: 8px;
            background: rgba(6, 16, 28, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.45);
        }

        .lock {
            position: absolute;
            right: -10px;
            bottom: 18px;
            width: 92px;
            height: 92px;
            z-index: 4;
        }
        .lock::after {
            content: "";
            position: absolute;
            inset: -12px;
            border-radius: 24px;
            background: radial-gradient(circle, rgba(0, 122, 255, 0.4), rgba(0, 122, 255, 0));
            opacity: 0.7;
            animation: lockGlow 4.2s ease-in-out infinite;
        }
        .lock-body {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 70%;
            background: linear-gradient(180deg, #f9f9f9 0%, #dcdcdc 100%);
            border-radius: 20px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.35);
        }
        .lock-shackle {
            position: absolute;
            top: -20px;
            left: 16px;
            width: 50px;
            height: 40px;
            border: 8px solid #f6f6f6;
            border-bottom: none;
            border-radius: 28px 28px 0 0;
            transform: rotate(-6deg) translateY(0);
            transform-origin: left bottom;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
            animation: shackleUnlock 4.2s ease-in-out infinite;
        }
        .lock-keyhole {
            position: absolute;
            left: 50%;
            bottom: 20px;
            width: 18px;
            height: 18px;
            margin-left: -9px;
            background: #0b0b0b;
            border-radius: 50%;
        }
        .lock-keyhole::after {
            content: "";
            position: absolute;
            left: 7px;
            top: 14px;
            width: 4px;
            height: 14px;
            background: #0b0b0b;
            border-radius: 2px;
        }

        @keyframes doorSwing {
            0%, 12% {
                transform: translateZ(8px) rotateY(0deg);
                box-shadow: 0 18px 30px rgba(0, 0, 0, 0.45), inset 0 0 18px rgba(255, 255, 255, 0.08);
            }
            40% {
                transform: translateZ(32px) rotateY(78deg);
                box-shadow: -14px 24px 40px rgba(0, 0, 0, 0.45), 0 8px 16px rgba(0, 0, 0, 0.35);
            }
            55% {
                transform: translateZ(28px) rotateY(70deg);
                box-shadow: -12px 22px 38px rgba(0, 0, 0, 0.45), 0 6px 14px rgba(0, 0, 0, 0.35);
            }
            100% {
                transform: translateZ(8px) rotateY(0deg);
                box-shadow: 0 18px 30px rgba(0, 0, 0, 0.45), inset 0 0 18px rgba(255, 255, 255, 0.08);
            }
        }
        @keyframes interiorGlow {
            0%, 12%, 100% { filter: brightness(0.9); }
            40%, 55% { filter: brightness(1.15); }
        }
        @keyframes doorShadow {
            0%, 12%, 100% { opacity: 0.2; transform: translateX(0); }
            40%, 55% { opacity: 0.5; transform: translateX(-10px); }
        }
        @keyframes ringPulse {
            0%, 100% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 0.7; transform: scale(1.02); }
        }
        @keyframes lockGlow {
            0%, 18%, 100% { opacity: 0.35; transform: scale(0.98); }
            40%, 60% { opacity: 0.75; transform: scale(1.04); }
        }
        @keyframes shackleUnlock {
            0%, 18% { transform: rotate(-6deg) translateY(0); }
            32% { transform: rotate(-14deg) translateY(-2px); }
            45% { transform: rotate(-42deg) translateY(-10px); }
            60% { transform: rotate(-40deg) translateY(-10px); }
            78% { transform: rotate(-14deg) translateY(-2px); }
            100% { transform: rotate(-6deg) translateY(0); }
        }

        @media screen and (max-height: 500px) {
            .header { padding: 8px 15px; height: 50px; }
            .unlock-section { padding: 16px; gap: 24px; }
            .status-title { font-size: 26px; }
            .status-sub { font-size: 14px; }
            .door-visual { width: 190px; height: 250px; }
        }
    </style>
</head>
<body>
    <div class="device-container">
        <div class="header">
            <span>WP5120Q3000001</span>
        </div>

        <div class="unlock-section">
            <div>
                <div class="status-title">Open Door!</div>
            </div>

            <div class="door-visual">
                <div class="signal-ring"></div>
                <div class="cabinet">
                    <div class="hinge hinge--top"></div>
                    <div class="hinge hinge--bottom"></div>
                    <div class="shelf shelf--1"></div>
                    <div class="shelf shelf--2"></div>
                    <div class="shelf shelf--3"></div>
                    <div class="door-panel">
                        <div class="door-handle"></div>
                    </div>
                </div>
                <div class="lock">
                    <div class="lock-shackle"></div>
                    <div class="lock-body"></div>
                    <div class="lock-keyhole"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
