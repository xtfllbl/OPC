<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Transaction Receipt - MayFood</title>
    <style>
        /* Modern, minimal, mobile-first styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f6f6f6;
            color: #333;
            display: flex;
            justify-content: center;
        }

        /* Mobile Container to simulate phone view */
        .app-container {
            width: 100%;
            max-width: 414px; /* Simulating standard phone width */
            background-color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #e0e0e0;
            border-right: 1px solid #e0e0e0;
        }

        /* Standard Mobile Header */
        .header {
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #e0e0e0;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        /* Key Transaction Info Area */
        .summary-section {
            padding: 30px 20px 20px;
            text-align: center;
        }

        .amount {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .trans-type {
            font-size: 16px;
            font-weight: 500;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Receipt Image Section */
        .receipt-card {
            padding: 0 20px 20px;
            flex-grow: 1;
        }

        .receipt-image-container {
            background: #fff;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            min-height: 300px; /* Placeholder while image loads */
            cursor: pointer;
        }

        .receipt-image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
        }

        /* Modern Action Buttons */
        .action-area {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-top: 1px solid #e0e0e0;
            margin-top: auto; /* Push to the bottom */
        }

        .btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        /* Email Input Section */
        .email-section {
            border-top: 1px solid #e0e0e0;
            padding: 20px;
            background-color: #f9f9f9;
        }

        .email-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
            display: block;
        }

        .email-form {
            display: flex;
            gap: 10px;
        }

        .email-input {
            flex-grow: 1;
            padding: 12px 15px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
        }

        .email-input:focus {
            border-color: #007bff;
        }

        .btn-send {
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            color: #007bff;
            background-color: transparent;
            border: 1px solid #007bff;
            transition: all 0.2s;
        }

        .btn-send:hover {
            background-color: #f0f7ff;
        }

        .email-note {
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }
        
        /* Message/Toast styling */
        .toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
        }

        .toast.show {
            visibility: visible;
            -webkit-animation: fadein 0.5s, fadeout 0.5s 2.5s;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        /* Modal styling for viewing receipt */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            overflow: auto;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 4px;
        }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <h1>Transaction E-Receipt</h1>
        </header>

        <section class="summary-section">
            <div class="amount">€10.00 EUR</div>
            <div class="trans-type">SALE</div>
        </section>

        <section class="receipt-card">
            <div class="receipt-image-container" onclick="openReceipt()">
                <img id="receiptImage" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIwAAACMCAYAAAC1M/+..." alt="Digital Receipt Copy">
            </div>
        </section>

        <div class="action-area">
            <a href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIwAAACMCAYAAAC1M/+..." download="MayFood_Receipt_260327.png" class="btn btn-primary" onclick="showDownloadMessage()">
                Download E-Receipt / Save to Phone
            </a>
        </div>

        <section class="email-section">
            <label for="emailInput" class="email-label">Send copy to email</label>
            <div class="email-form">
                <input type="email" id="emailInput" class="email-input" placeholder="Enter your email address">
                <button type="button" class="btn-send" onclick="sendEmail()">Send</button>
            </div>
            <p class="email-note">A copy of this electronic receipt will be sent to the provided email address.</p>
        </section>
    </div>

    <div id="toast" class="toast">A copy has been sent to your email.</div>

    <div id="receiptModal" class="modal" onclick="closeReceipt()">
        <img class="modal-content" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIwAAACMCAYAAAC1M/+..." alt="Full-screen Receipt">
    </div>

    <script>
        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.className = "toast show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        function showDownloadMessage() {
            // Note: Mobile 'download' support varies. This is the cleanest HTML-only approach.
            // On some iOS versions, it might open the image in a new tab for saving manually.
            showToast("Receipt downloading or opened for saving.");
        }

        function sendEmail() {
            const email = document.getElementById('emailInput').value;
            if(email && /^\S+@\S+\.\S+$/.test(email)) {
                showToast("E-receipt is being sent to " + email);
                document.getElementById('emailInput').value = ''; // Clear input
            } else {
                showToast("Please enter a valid email address.");
            }
        }

        function openReceipt() {
            document.getElementById('receiptModal').style.display = "flex";
        }

        function closeReceipt() {
            document.getElementById('receiptModal').style.display = "none";
        }
    </script>
</body>
</html>
