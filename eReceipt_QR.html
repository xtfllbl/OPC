<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f6f8">
    <title>E-Receipt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --bg-main: #f3f6f8;
            --bg-accent: #fbfcff;
            --card: rgba(255, 255, 255, 0.84);
            --ink: #101828;
            --muted: #667085;
            --line: rgba(16, 24, 40, 0.08);
            --brand: #1b7b58;
            --brand-deep: #0f5b3f;
            --brand-soft: #e9f7f0;
            --action: #173a8f;
            --danger: #cf4336;
            --danger-soft: #fef1ef;
            --shadow: 0 20px 48px rgba(21, 39, 72, 0.12);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            background: var(--bg-main);
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Sora", "Segoe UI", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 12% 12%, rgba(39, 111, 255, 0.12), transparent 38%),
                radial-gradient(circle at 92% 10%, rgba(27, 123, 88, 0.12), transparent 36%),
                linear-gradient(180deg, var(--bg-main) 0%, var(--bg-accent) 100%);
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
        }

        .page {
            width: min(100%, 460px);
            margin: 0 auto;
            padding:
                calc(18px + env(safe-area-inset-top))
                16px
                calc(28px + env(safe-area-inset-bottom));
        }

        .stack {
            display: grid;
            gap: 16px;
        }

        .locale-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.82);
            background: rgba(255, 255, 255, 0.76);
            box-shadow: 0 12px 28px rgba(21, 39, 72, 0.08);
            backdrop-filter: blur(10px);
        }

        .locale-label {
            font-size: 13px;
            font-weight: 700;
            color: #344054;
        }

        .locale-actions {
            display: inline-flex;
            gap: 8px;
            padding: 4px;
            border-radius: 999px;
            background: rgba(16, 24, 40, 0.06);
        }

        .locale-btn {
            min-height: 36px;
            padding: 0 14px;
            border-radius: 999px;
            background: transparent;
            color: #475467;
            font-size: 13px;
            font-weight: 700;
            transition: background-color 0.16s ease, color 0.16s ease, transform 0.16s ease;
        }

        .locale-btn.is-active {
            background: #ffffff;
            color: var(--action);
            box-shadow: 0 8px 18px rgba(23, 58, 143, 0.12);
        }

        .locale-btn:active {
            transform: scale(0.985);
        }

        .hero-card,
        .panel {
            position: relative;
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255, 255, 255, 0.82);
            background: var(--card);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        .hero-card::before,
        .hero-card::after {
            content: "";
            position: absolute;
            border-radius: 999px;
            pointer-events: none;
            opacity: 0.88;
        }

        .hero-card::before {
            width: 180px;
            height: 180px;
            right: -48px;
            top: -70px;
            background: radial-gradient(circle, rgba(27, 123, 88, 0.22), transparent 70%);
        }

        .hero-card::after {
            width: 170px;
            height: 170px;
            left: -60px;
            bottom: -70px;
            background: radial-gradient(circle, rgba(23, 58, 143, 0.18), transparent 70%);
        }

        .hero-inner {
            position: relative;
            z-index: 1;
            padding: 22px 20px;
            display: grid;
            gap: 18px;
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
        }

        .merchant-block {
            min-width: 0;
            flex: 1;
        }

        .merchant-name {
            margin: 0;
            font-size: 26px;
            line-height: 1.05;
            letter-spacing: -0.03em;
            word-break: break-word;
        }

        .type-chip {
            padding: 10px 12px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(16, 24, 40, 0.08);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #1b2b4b;
            white-space: nowrap;
        }

        .amount-block {
            display: grid;
            gap: 0;
        }

        .amount-value {
            font-size: clamp(38px, 11vw, 56px);
            line-height: 0.96;
            letter-spacing: -0.05em;
            font-weight: 800;
            word-break: break-word;
        }

        .hero-tools {
            display: grid;
            gap: 16px;
            margin-top: 4px;
            padding-top: 18px;
            border-top: 1px solid rgba(16, 24, 40, 0.08);
        }

        .hero-subcard {
            display: grid;
            gap: 12px;
            padding: 14px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(16, 24, 40, 0.06);
        }

        .hero-subtitle {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .panel {
            padding: 18px;
        }

        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 14px;
        }

        .panel-title {
            margin: 0;
            font-size: 17px;
            letter-spacing: -0.02em;
        }

        .panel-caption {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
            text-align: right;
        }

        .receipt-stage {
            border-radius: var(--radius-lg);
            padding: 14px;
            background:
                radial-gradient(circle at 100% 0%, rgba(27, 123, 88, 0.08), transparent 38%),
                linear-gradient(180deg, #f7fbf8 0%, #f4f7fb 100%);
            border: 1px solid var(--line);
        }

        .receipt-preview {
            width: 100%;
            display: block;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
        }

        .action-panel {
            display: grid;
            gap: 12px;
        }

        .primary-btn {
            width: 100%;
            min-height: 56px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--action), #315dc6);
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.01em;
            box-shadow: 0 14px 30px rgba(23, 58, 143, 0.22);
            transition: transform 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .primary-btn:active {
            transform: scale(0.985);
            box-shadow: 0 10px 24px rgba(23, 58, 143, 0.2);
        }

        .primary-btn:disabled,
        .secondary-btn:disabled {
            opacity: 0.68;
            cursor: default;
        }

        .primary-btn svg {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
        }

        .panel-note {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
        }

        .email-form {
            display: grid;
            gap: 12px;
        }

        .field-label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
            color: #344054;
        }

        .field-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 10px;
        }

        .text-input {
            width: 100%;
            min-height: 54px;
            padding: 0 16px;
            border-radius: 16px;
            border: 1.5px solid rgba(16, 24, 40, 0.1);
            background: #ffffff;
            color: var(--ink);
            font-size: 16px;
            transition: border-color 0.16s ease, box-shadow 0.16s ease;
            outline: none;
        }

        .text-input:focus {
            border-color: rgba(23, 58, 143, 0.42);
            box-shadow: 0 0 0 4px rgba(23, 58, 143, 0.12);
        }

        .secondary-btn {
            min-width: 116px;
            min-height: 54px;
            padding: 0 18px;
            border-radius: 16px;
            background: var(--brand-soft);
            color: var(--brand-deep);
            font-weight: 700;
            font-size: 15px;
            transition: transform 0.16s ease, opacity 0.16s ease;
            touch-action: manipulation;
        }

        .secondary-btn:active {
            transform: scale(0.985);
        }

        .status-note {
            margin: 0;
            padding: 12px 14px;
            border-radius: 15px;
            font-size: 13px;
            line-height: 1.5;
            font-weight: 600;
        }

        .status-note[hidden] {
            display: none;
        }

        .status-note.success {
            color: var(--brand-deep);
            background: var(--brand-soft);
            border: 1px solid rgba(27, 123, 88, 0.18);
        }

        .status-note.error {
            color: var(--danger);
            background: var(--danger-soft);
            border: 1px solid rgba(207, 67, 54, 0.18);
        }

        .fade-up {
            animation: fadeUp 0.56s ease both;
            animation-delay: var(--delay, 0ms);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 390px) {
            .locale-bar {
                align-items: stretch;
                flex-direction: column;
            }

            .locale-actions {
                width: 100%;
            }

            .locale-btn {
                flex: 1 1 0;
            }

            .hero-inner {
                padding: 20px 18px;
            }

            .merchant-name {
                font-size: 23px;
            }

            .panel {
                padding: 16px;
            }

            .hero-subcard {
                padding: 12px;
            }

            .field-row {
                grid-template-columns: 1fr;
            }

            .secondary-btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-up {
                animation: none;
            }

            .primary-btn,
            .secondary-btn,
            .text-input {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="stack">
            <div class="locale-bar fade-up" style="--delay: 0ms;" role="group" aria-labelledby="language-label">
                <span class="locale-label" id="language-label">Language</span>
                <div class="locale-actions">
                    <button class="locale-btn is-active" id="lang-en-btn" type="button" data-lang="en" aria-pressed="true">English</button>
                    <button class="locale-btn" id="lang-fr-btn" type="button" data-lang="fr" aria-pressed="false">Français</button>
                </div>
            </div>

            <section class="hero-card fade-up" id="summary-panel" style="--delay: 20ms;" aria-label="Transaction summary">
                <div class="hero-inner">
                    <div class="hero-top">
                        <div class="merchant-block">
                            <h1 class="merchant-name" id="merchant-name">MayFood</h1>
                        </div>
                        <div class="type-chip" id="type-chip">Sale</div>
                    </div>

                    <div class="amount-block">
                        <div class="amount-value" id="amount-value">EUR 10.00</div>
                    </div>
                    <div class="hero-tools">
                        <div class="action-panel">
                            <button class="primary-btn" id="download-btn" type="button">
                                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                    <path d="M12 3v11m0 0l4-4m-4 4L8 10M5 17.5h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                                <span id="download-btn-label">Download Receipt</span>
                            </button>
                            <p class="status-note success" id="download-note" hidden></p>
                        </div>

                        <div class="hero-subcard">
                            <h2 class="hero-subtitle" id="email-title">Email a copy</h2>
                            <form class="email-form" id="email-form" novalidate>
                                <div>
                                    <label class="field-label" id="email-label" for="email-input">Email address</label>
                                    <div class="field-row">
                                        <input class="text-input" id="email-input" name="email" type="email" inputmode="email" autocomplete="email" enterkeyhint="send" placeholder="name@example.com" required>
                                        <button class="secondary-btn" id="email-btn" type="submit">Send</button>
                                    </div>
                                </div>
                                <p class="status-note success" id="email-note" hidden aria-live="polite"></p>
                            </form>
                        </div>
                    </div>
                </div>
            </section>

            <section class="panel fade-up" id="receipt-panel" style="--delay: 120ms;" aria-label="Receipt preview">
                <div class="panel-head">
                    <h2 class="panel-title" id="panel-title">Electronic receipt</h2>
                </div>
                <div class="receipt-stage">
                    <img class="receipt-preview" id="receipt-preview" src="" alt="Electronic receipt preview">
                </div>
            </section>
        </div>
    </main>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var receiptPreview = document.getElementById("receipt-preview");
            var amountValue = document.getElementById("amount-value");
            var typeChip = document.getElementById("type-chip");
            var merchantName = document.getElementById("merchant-name");
            var languageLabel = document.getElementById("language-label");
            var languageButtons = Array.prototype.slice.call(document.querySelectorAll(".locale-btn"));
            var summaryPanel = document.getElementById("summary-panel");
            var emailTitle = document.getElementById("email-title");
            var emailLabel = document.getElementById("email-label");
            var downloadButton = document.getElementById("download-btn");
            var downloadButtonLabel = document.getElementById("download-btn-label");
            var downloadNote = document.getElementById("download-note");
            var emailForm = document.getElementById("email-form");
            var emailInput = document.getElementById("email-input");
            var emailButton = document.getElementById("email-btn");
            var emailNote = document.getElementById("email-note");
            var receiptPanel = document.getElementById("receipt-panel");
            var panelTitle = document.getElementById("panel-title");
            var previewUrl = "";
            var receiptWidth = 720;
            var receiptHeight = 1360;
            var languageStorageKey = "ereceipt_qr_language";
            var isIOS = /iPad|iPhone|iPod/.test(window.navigator.userAgent)
                || (window.navigator.platform === "MacIntel" && window.navigator.maxTouchPoints > 1);
            var translations = {
                en: {
                    locale: "en-US",
                    pageTitle: "E-Receipt",
                    languageLabel: "Language",
                    languageName: {
                        en: "English",
                        fr: "French"
                    },
                    transactionSummary: "Transaction summary",
                    emailCopy: "Email a copy",
                    emailAddress: "Email address",
                    downloadReceipt: "Download Receipt",
                    preparing: "Preparing...",
                    send: "Send",
                    sending: "Sending...",
                    electronicReceipt: "Electronic receipt",
                    receiptPreviewAlt: "Electronic receipt preview",
                    shareTitle: "{merchant} receipt",
                    shareText: "E-receipt",
                    shareOpened: "Share sheet opened. Choose Save to Files or Save Image to keep the receipt on the phone.",
                    downloadStarted: "Receipt download started.",
                    saveCanceled: "Save canceled.",
                    exportFailed: "Could not export the receipt image. Please try again.",
                    emailQueued: "Receipt queued for {email}.",
                    emailFailed: "Email could not be sent right now. Please try again.",
                    receipt: {
                        date: "DATE",
                        time: "TIME",
                        mid: "MID",
                        tid: "TID",
                        batchNo: "BATCH NO",
                        invoiceNo: "INVOICE NO",
                        stan: "STAN",
                        card: "CARD",
                        expDate: "EXP DATE",
                        apprCode: "APPR CODE",
                        rrn: "RRN",
                        tsi: "TSI",
                        atc: "ATC",
                        tvr: "TVR",
                        apsn: "APSN",
                        appName: "App Name",
                        aid: "Aid",
                        total: "TOTAL",
                        signatureNotRequired: "SIGNATURE NOT REQUIRED",
                        agreement: "I AGREE TO PAY AS PER CARD ISSUER AGREEMENT",
                        important: "IMPORTANT-retain this copy for records",
                        merchantCopy: "MERCHANT COPY",
                        customerCopy: "CUSTOMER COPY",
                        sale: "SALE",
                        refund: "REFUND",
                        "void": "VOID",
                        preauth: "PREAUTH",
                        completion: "COMPLETION",
                        offline: "OFFLINE"
                    }
                },
                fr: {
                    locale: "fr-FR",
                    pageTitle: "Reçu électronique",
                    languageLabel: "Langue",
                    languageName: {
                        en: "Anglais",
                        fr: "Français"
                    },
                    transactionSummary: "Résumé de la transaction",
                    emailCopy: "Envoyer une copie par e-mail",
                    emailAddress: "Adresse e-mail",
                    downloadReceipt: "Télécharger le reçu",
                    preparing: "Préparation...",
                    send: "Envoyer",
                    sending: "Envoi...",
                    electronicReceipt: "Reçu électronique",
                    receiptPreviewAlt: "Aperçu du reçu électronique",
                    shareTitle: "Reçu {merchant}",
                    shareText: "Reçu électronique",
                    shareOpened: "La feuille de partage est ouverte. Choisissez Enregistrer dans Fichiers ou Enregistrer l’image pour conserver le reçu sur le téléphone.",
                    downloadStarted: "Le téléchargement du reçu a commencé.",
                    saveCanceled: "Enregistrement annulé.",
                    exportFailed: "Impossible d’exporter l’image du reçu. Veuillez réessayer.",
                    emailQueued: "Le reçu a été mis en file d’attente pour {email}.",
                    emailFailed: "L’e-mail ne peut pas être envoyé pour le moment. Veuillez réessayer.",
                    receipt: {
                        date: "DATE",
                        time: "HEURE",
                        mid: "MID",
                        tid: "TID",
                        batchNo: "LOT N°",
                        invoiceNo: "FACTURE N°",
                        stan: "STAN",
                        card: "CARTE",
                        expDate: "DATE EXP.",
                        apprCode: "CODE AUTO.",
                        rrn: "RRN",
                        tsi: "TSI",
                        atc: "ATC",
                        tvr: "TVR",
                        apsn: "APSN",
                        appName: "Nom appli",
                        aid: "AID",
                        total: "TOTAL",
                        signatureNotRequired: "SIGNATURE NON REQUISE",
                        agreement: "J’ACCEPTE DE PAYER SELON L’ACCORD DE L’ÉMETTEUR",
                        important: "IMPORTANT - conservez cette copie",
                        merchantCopy: "COPIE MARCHAND",
                        customerCopy: "COPIE CLIENT",
                        sale: "VENTE",
                        refund: "REMBOURSEMENT",
                        "void": "ANNULATION",
                        preauth: "PRÉAUTORISATION",
                        completion: "FINALISATION",
                        offline: "HORS LIGNE"
                    }
                }
            };
            var currentLanguage = detectLanguage();

            function readValue(keys, fallback) {
                for (var i = 0; i < keys.length; i += 1) {
                    var key = keys[i];
                    var queryValue = params.get(key);

                    if (queryValue !== null && queryValue !== "") {
                        return queryValue;
                    }

                    if (window[key] !== undefined && window[key] !== null && window[key] !== "") {
                        return String(window[key]);
                    }
                }

                return fallback;
            }

            function parseAmount() {
                var centsValue = Number(readValue(["amountCents", "transactionAmountCents"], ""));
                if (Number.isFinite(centsValue) && centsValue >= 0) {
                    return Math.round(centsValue) / 100;
                }

                var rawAmount = readValue(["amount", "transactionAmount"], "10.00");
                var normalized = String(rawAmount).replace(/,/g, "");
                var parsed = Number(normalized);

                if (Number.isFinite(parsed) && parsed >= 0) {
                    return parsed;
                }

                return 10;
            }

            function padTwo(value) {
                return String(value).padStart(2, "0");
            }

            function formatCompactAmount(amount) {
                return amount.toLocaleString(translations[currentLanguage].locale, {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            }

            function normalizeLanguage(value) {
                var normalized = String(value || "").toLowerCase();

                if (normalized.indexOf("fr") === 0) {
                    return "fr";
                }

                if (normalized.indexOf("en") === 0) {
                    return "en";
                }

                return "";
            }

            function detectLanguage() {
                var queryLanguage = normalizeLanguage(readValue(["lang", "language"], ""));

                if (queryLanguage) {
                    return queryLanguage;
                }

                try {
                    var savedLanguage = normalizeLanguage(window.localStorage.getItem(languageStorageKey));

                    if (savedLanguage) {
                        return savedLanguage;
                    }
                } catch (error) {
                    // Ignore storage access failures.
                }

                return normalizeLanguage(window.navigator.language) || "en";
            }

            function escapeXml(value) {
                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&apos;");
            }

            function sanitizeFilename(value) {
                return String(value || "receipt")
                    .replace(/[<>:"/\\|?*\u0000-\u001F]/g, "-")
                    .replace(/\s+/g, "-")
                    .replace(/-+/g, "-")
                    .replace(/^-|-$/g, "")
                    .toLowerCase();
            }

            function showNote(element, message, isError) {
                element.hidden = false;
                element.textContent = message;
                element.className = "status-note " + (isError ? "error" : "success");
            }

            function hideNote(element) {
                element.hidden = true;
                element.textContent = "";
            }

            function translate(key, replacements) {
                var path = key.split(".");
                var value = translations[currentLanguage];
                var i;

                for (i = 0; i < path.length; i += 1) {
                    if (!value || value[path[i]] === undefined) {
                        value = null;
                        break;
                    }

                    value = value[path[i]];
                }

                if (typeof value !== "string") {
                    return key;
                }

                if (!replacements) {
                    return value;
                }

                return value.replace(/\{(\w+)\}/g, function (match, token) {
                    return replacements[token] !== undefined ? replacements[token] : match;
                });
            }

            function normalizeLookupValue(value) {
                return String(value || "")
                    .trim()
                    .toLowerCase()
                    .replace(/\s+/g, " ")
                    .replace(/[_-]+/g, " ");
            }

            function localizeTransactionType(type) {
                var normalized = normalizeLookupValue(type);
                var dictionary = {
                    sale: "receipt.sale",
                    refund: "receipt.refund",
                    "void": "receipt.void",
                    "voided": "receipt.void",
                    preauth: "receipt.preauth",
                    "pre auth": "receipt.preauth",
                    preauthorization: "receipt.preauth",
                    preauthorisation: "receipt.preauth",
                    completion: "receipt.completion",
                    "offline sale": "receipt.offline",
                    offline: "receipt.offline"
                };

                return dictionary[normalized] ? translate(dictionary[normalized]) : String(type || "");
            }

            function localizeCopyLabel(label) {
                var normalized = normalizeLookupValue(label);
                var dictionary = {
                    "merchant copy": "receipt.merchantCopy",
                    merchant: "receipt.merchantCopy",
                    "customer copy": "receipt.customerCopy",
                    customer: "receipt.customerCopy"
                };

                return dictionary[normalized] ? translate(dictionary[normalized]) : String(label || "");
            }

            function lineText(x, y, text, options) {
                var settings = options || {};
                var anchor = settings.anchor ? ' text-anchor="' + settings.anchor + '"' : "";
                var size = settings.size || 24;
                var weight = settings.weight || 500;
                var fill = settings.fill || "#111827";

                return '<text x="' + x + '" y="' + y + '"' + anchor
                    + ' font-family="Arial, Helvetica, sans-serif" font-size="' + size + '" font-weight="'
                    + weight + '" fill="' + fill + '">' + escapeXml(text) + "</text>";
            }

            function buildReceiptSvg(data) {
                var agreementSize = currentLanguage === "fr" ? 24 : 26;
                var importantSize = currentLanguage === "fr" ? 22 : 24;

                return [
                    '<svg xmlns="http://www.w3.org/2000/svg" width="' + receiptWidth + '" height="' + receiptHeight + '" viewBox="0 0 ' + receiptWidth + " " + receiptHeight + '">',
                    '<rect width="100%" height="100%" fill="#ffffff"/>',
                    lineText(receiptWidth / 2, 92, data.merchant, { anchor: "middle", size: 38, weight: 500 }),
                    lineText(52, 156, translate("receipt.date") + ":" + data.date, { size: 28, weight: 400 }),
                    lineText(458, 156, translate("receipt.time") + ":" + data.time, { size: 28, weight: 400 }),
                    lineText(52, 206, translate("receipt.mid") + ":" + data.mid, { size: 28, weight: 400 }),
                    lineText(508, 206, translate("receipt.tid") + ":" + data.tid, { size: 28, weight: 400 }),
                    lineText(52, 256, translate("receipt.batchNo") + ":" + data.batch, { size: 28, weight: 400 }),
                    lineText(388, 256, translate("receipt.invoiceNo") + ":" + data.invoice, { size: 28, weight: 400 }),
                    lineText(52, 306, translate("receipt.stan") + ":", { size: 28, weight: 400 }),
                    lineText(648, 306, data.stan, { anchor: "end", size: 28, weight: 400 }),
                    lineText(receiptWidth / 2, 402, localizeTransactionType(data.type), { anchor: "middle", size: 46, weight: 400 }),
                    lineText(52, 494, translate("receipt.card") + " " + data.card, { size: 30, weight: 400 }),
                    lineText(468, 544, translate("receipt.expDate") + ":" + data.expDate, { size: 28, weight: 400 }),
                    lineText(52, 612, translate("receipt.apprCode") + ":" + data.approvalCode, { size: 28, weight: 400 }),
                    lineText(448, 612, translate("receipt.rrn") + ":" + data.rrn, { size: 28, weight: 400 }),
                    lineText(52, 662, translate("receipt.tsi") + ":" + data.tsi, { size: 28, weight: 400 }),
                    lineText(620, 662, translate("receipt.atc") + ":", { anchor: "end", size: 28, weight: 400 }),
                    lineText(52, 712, translate("receipt.tvr") + ":" + data.tvr, { size: 28, weight: 400 }),
                    lineText(52, 762, translate("receipt.apsn") + ":" + data.apsn, { size: 28, weight: 400 }),
                    lineText(52, 812, translate("receipt.appName") + ":" + data.appName, { size: 28, weight: 400 }),
                    lineText(52, 862, translate("receipt.aid") + ":" + data.aid, { size: 28, weight: 400 }),
                    lineText(58, 1042, translate("receipt.total"), { size: 48, weight: 400 }),
                    lineText(receiptWidth / 2, 1042, data.currency, { anchor: "middle", size: 40, weight: 400 }),
                    lineText(654, 1042, formatCompactAmount(data.amount), { anchor: "end", size: 40, weight: 400 }),
                    lineText(receiptWidth / 2, 1128, translate("receipt.signatureNotRequired"), { anchor: "middle", size: 38, weight: 400 }),
                    '<line x1="156" y1="1168" x2="564" y2="1168" stroke="#111827" stroke-width="4" stroke-dasharray="12 10"/>',
                    lineText(receiptWidth / 2, 1230, translate("receipt.agreement"), { anchor: "middle", size: agreementSize, weight: 400 }),
                    lineText(receiptWidth / 2, 1280, translate("receipt.important"), { anchor: "middle", size: importantSize, weight: 400 }),
                    lineText(receiptWidth / 2, 1322, localizeCopyLabel(data.copyLabel), { anchor: "middle", size: 44, weight: 400 }),
                    lineText(receiptWidth / 2, 1352, data.brand, { anchor: "middle", size: 36, weight: 400 }),
                    "</svg>"
                ].join("");
            }

            function svgToObjectUrl(svgMarkup) {
                return URL.createObjectURL(new Blob([svgMarkup], { type: "image/svg+xml;charset=utf-8" }));
            }

            function svgToPngBlob(svgMarkup, width, height, scale) {
                return new Promise(function (resolve, reject) {
                    var svgUrl = svgToObjectUrl(svgMarkup);
                    var image = new Image();

                    image.onload = function () {
                        var canvas = document.createElement("canvas");
                        var ratio = scale || 2;
                        var context = canvas.getContext("2d");

                        canvas.width = width * ratio;
                        canvas.height = height * ratio;
                        context.fillStyle = "#ffffff";
                        context.fillRect(0, 0, canvas.width, canvas.height);
                        context.drawImage(image, 0, 0, canvas.width, canvas.height);

                        canvas.toBlob(function (blob) {
                            URL.revokeObjectURL(svgUrl);

                            if (blob) {
                                resolve(blob);
                                return;
                            }

                            reject(new Error("Receipt image export failed."));
                        }, "image/png");
                    };

                    image.onerror = function () {
                        URL.revokeObjectURL(svgUrl);
                        reject(new Error("Receipt image render failed."));
                    };

                    image.src = svgUrl;
                });
            }

            function triggerDownload(blobOrFile, filename) {
                var objectUrl = URL.createObjectURL(blobOrFile);
                var link = document.createElement("a");

                link.href = objectUrl;
                link.download = filename;
                link.rel = "noopener";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                window.setTimeout(function () {
                    URL.revokeObjectURL(objectUrl);
                }, 4000);
            }

            function wait(duration) {
                return new Promise(function (resolve) {
                    window.setTimeout(resolve, duration);
                });
            }

            var now = new Date();
            var receiptData = {
                merchant: readValue(["merchant", "merchantName"], "MayFood"),
                amount: parseAmount(),
                currency: readValue(["currency"], "EUR").toUpperCase(),
                type: readValue(["type", "transactionType"], "Sale"),
                date: readValue(["date"], padTwo(now.getFullYear() % 100) + "/" + padTwo(now.getMonth() + 1) + "/" + padTwo(now.getDate())),
                time: readValue(["time"], padTwo(now.getHours()) + ":" + padTwo(now.getMinutes()) + ":" + padTwo(now.getSeconds())),
                invoice: readValue(["invoice", "invoiceNo"], "260327073251"),
                mid: readValue(["mid"], "21021814"),
                tid: readValue(["tid"], "00000002"),
                batch: readValue(["batch", "batchNo"], ""),
                stan: readValue(["stan"], "020208"),
                card: readValue(["card", "maskedCard"], "537218******4480"),
                expDate: readValue(["exp", "expDate"], "2807"),
                approvalCode: readValue(["approval", "approvalCode"], ""),
                rrn: readValue(["rrn"], "398073251625"),
                tsi: readValue(["tsi"], ""),
                tvr: readValue(["tvr"], ""),
                apsn: readValue(["apsn"], ""),
                appName: readValue(["appName"], ""),
                aid: readValue(["aid"], ""),
                copyLabel: readValue(["copyLabel"], "Merchant Copy"),
                brand: readValue(["brand"], "WizarPOS"),
                email: readValue(["email"], ""),
                emailEndpoint: readValue(["emailEndpoint"], "")
            };

            function updateLanguageButtons() {
                var i;

                for (i = 0; i < languageButtons.length; i += 1) {
                    var button = languageButtons[i];
                    var isActive = button.getAttribute("data-lang") === currentLanguage;

                    button.classList.toggle("is-active", isActive);
                    button.setAttribute("aria-pressed", String(isActive));
                    button.textContent = translations[currentLanguage].languageName[button.getAttribute("data-lang")];
                }
            }

            function applyLanguage() {
                document.documentElement.lang = currentLanguage;
                document.title = translate("pageTitle");
                languageLabel.textContent = translate("languageLabel");
                summaryPanel.setAttribute("aria-label", translate("transactionSummary"));
                receiptPanel.setAttribute("aria-label", translate("electronicReceipt"));
                emailTitle.textContent = translate("emailCopy");
                emailLabel.textContent = translate("emailAddress");
                downloadButtonLabel.textContent = translate("downloadReceipt");
                emailButton.textContent = translate("send");
                panelTitle.textContent = translate("electronicReceipt");
                receiptPreview.alt = translate("receiptPreviewAlt");
                updateLanguageButtons();
            }

            function syncSummary() {
                merchantName.textContent = receiptData.merchant;
                typeChip.textContent = localizeTransactionType(receiptData.type);
                amountValue.textContent = receiptData.currency + " " + formatCompactAmount(receiptData.amount);
                emailInput.value = receiptData.email;
            }

            function syncPreview() {
                var svgMarkup = buildReceiptSvg(receiptData);

                if (previewUrl) {
                    URL.revokeObjectURL(previewUrl);
                }

                previewUrl = svgToObjectUrl(svgMarkup);
                receiptPreview.src = previewUrl;
                receiptPreview.dataset.svgMarkup = svgMarkup;
            }

            async function handleDownload() {
                downloadButton.disabled = true;
                hideNote(downloadNote);
                downloadButtonLabel.textContent = translate("preparing");

                try {
                    var svgMarkup = receiptPreview.dataset.svgMarkup || buildReceiptSvg(receiptData);
                    var pngBlob = await svgToPngBlob(svgMarkup, receiptWidth, receiptHeight, 2);
                    var filename = sanitizeFilename(readValue(["downloadName"], receiptData.merchant + "-" + receiptData.invoice)) || "receipt";
                    var file = new File([pngBlob], filename + ".png", { type: "image/png" });

                    if (isIOS && navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({
                            title: translate("shareTitle", { merchant: receiptData.merchant }),
                            text: translate("shareText"),
                            files: [file]
                        });
                        showNote(downloadNote, translate("shareOpened"), false);
                    } else {
                        triggerDownload(file, file.name);
                        showNote(downloadNote, translate("downloadStarted"), false);
                    }
                } catch (error) {
                    if (error && error.name === "AbortError") {
                        showNote(downloadNote, translate("saveCanceled"), true);
                    } else {
                        showNote(downloadNote, translate("exportFailed"), true);
                    }
                } finally {
                    downloadButton.disabled = false;
                    downloadButtonLabel.textContent = translate("downloadReceipt");
                }
            }

            async function handleEmailSubmit(event) {
                event.preventDefault();
                hideNote(emailNote);

                if (!emailInput.checkValidity()) {
                    emailInput.reportValidity();
                    return;
                }

                emailButton.disabled = true;
                emailButton.textContent = translate("sending");

                try {
                    var endpoint = receiptData.emailEndpoint || window.receiptEmailEndpoint || "";
                    var payload = {
                        email: emailInput.value.trim(),
                        merchant: receiptData.merchant,
                        type: receiptData.type,
                        currency: receiptData.currency,
                        amount: receiptData.amount,
                        invoice: receiptData.invoice,
                        rrn: receiptData.rrn,
                        receiptSvg: receiptPreview.dataset.svgMarkup || buildReceiptSvg(receiptData)
                    };

                    if (endpoint) {
                        var response = await fetch(endpoint, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) {
                            throw new Error("Request failed");
                        }
                    } else {
                        await wait(900);
                    }

                    showNote(emailNote, translate("emailQueued", { email: payload.email }), false);
                } catch (error) {
                    showNote(emailNote, translate("emailFailed"), true);
                } finally {
                    emailButton.disabled = false;
                    emailButton.textContent = translate("send");
                }
            }

            function setLanguage(nextLanguage) {
                if (!translations[nextLanguage] || nextLanguage === currentLanguage) {
                    return;
                }

                currentLanguage = nextLanguage;

                try {
                    window.localStorage.setItem(languageStorageKey, currentLanguage);
                } catch (error) {
                    // Ignore storage access failures.
                }

                applyLanguage();
                syncSummary();
                syncPreview();
            }

            applyLanguage();
            syncSummary();
            syncPreview();
            downloadButton.addEventListener("click", handleDownload);
            emailForm.addEventListener("submit", handleEmailSubmit);
            languageButtons.forEach(function (button) {
                button.addEventListener("click", function () {
                    setLanguage(button.getAttribute("data-lang"));
                });
            });
            window.addEventListener("beforeunload", function () {
                if (previewUrl) {
                    URL.revokeObjectURL(previewUrl);
                }
            });
        })();
    </script>
</body>
