<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlocking</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --primary-gradient: linear-gradient(135deg, #007AFF 0%, #0056b3 100%);
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --text-main: #FFFFFF;
            --text-sub: #A0A0A0;
            --accent-warning: #FFD700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .device-container {
            width: 480px;
            height: 100vh;
            max-height: 800px;
            background: radial-gradient(140% 120% at 50% 0%, #1a1a1a 0%, #121212 45%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.55);
        }

        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
            height: 60px;
        }

        .unlock-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            gap: 36px;
        }

        .status-title {
            font-size: 34px;
            font-weight: 800;
            margin-top: 2px;
        }

        .loading-visual {
            --frame-size: 180px;
            --frame-radius: 28px;
            --grid-size: 96px;
            --grid-gap: 12px;
            position: relative;
            width: 240px;
            height: 320px;
            display: grid;
            place-items: center;
        }

        .loading-frame {
            position: relative;
            width: var(--frame-size);
            height: var(--frame-size);
            border-radius: var(--frame-radius);
            background: linear-gradient(160deg, #0b2f53 0%, #0a1a2c 100%);
            border: 1px solid rgba(0, 122, 255, 0.5);
            box-shadow: 0 22px 45px rgba(0, 0, 0, 0.55), inset 0 0 26px rgba(0, 122, 255, 0.18);
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .loading-frame::before {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: calc(var(--frame-radius) - 6px);
            background: linear-gradient(180deg, rgba(10, 18, 28, 0.96), rgba(8, 14, 22, 0.88));
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .loading-grid {
            position: relative;
            width: var(--grid-size);
            height: var(--grid-size);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--grid-gap);
            z-index: 1;
        }

        .loading-block {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            background: linear-gradient(180deg, #f5f9ff 0%, #cfe4ff 100%);
            box-shadow: 0 0 12px rgba(0, 122, 255, 0.6);
            animation: blockPulse 1.2s ease-in-out infinite;
        }

        .loading-block:nth-child(2) { animation-delay: 0.2s; }
        .loading-block:nth-child(3) { animation-delay: 0.4s; }
        .loading-block:nth-child(4) { animation-delay: 0.6s; }

        @keyframes blockPulse {
            0%, 100% { transform: scale(0.85); opacity: 0.6; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        @media screen and (max-height: 500px) {
            .header { padding: 8px 15px; height: 50px; }
            .unlock-section { padding: 16px; gap: 24px; }
            .status-title { font-size: 26px; }
            .loading-visual {
                width: 190px;
                height: 250px;
                --frame-size: 140px;
                --frame-radius: 22px;
                --grid-size: 72px;
                --grid-gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="device-container">
        <div class="header">
            <span>WP5120Q3000001</span>
        </div>

        <div class="unlock-section">
            <div>
                <div class="status-title">Unlocking...</div>
            </div>

            <div class="loading-visual" aria-hidden="true">
                <div class="loading-frame">
                    <div class="loading-grid">
                        <span class="loading-block"></span>
                        <span class="loading-block"></span>
                        <span class="loading-block"></span>
                        <span class="loading-block"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
