<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Reports - OPC Attended POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,0,0" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/batch_reports.css">
    <style>
        /* Standalone batch page adaptations */
        .batch-overlay {
            position: relative;
            inset: 0;
            opacity: 1;
            pointer-events: auto;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
    </style>
<link rel="stylesheet" href="css/attended.css">
<style>.batch-reconciliation-grid {grid-template-columns:repeat(2,minmax(0,1fr));}.batch-header-title {font-size:14px;}.batch-header-bar {gap:6px;}.batch-header-actions {margin-left:auto;}</style>
</head>

<body>
    <div class="phone-frame">
        <div class="android-status-bar" role="status" aria-label="Device status">
            <time class="status-time" id="status-time">09:41</time>
            <div class="status-icons">
                <span class="status-network-label" id="status-network-label">4G</span>
                <svg class="status-icon status-wifi" id="status-wifi" viewBox="0 0 24 24" aria-label="Wi-Fi connected">
                    <path d="M12 18.5 15 22h-6l3-3.5Zm0-5.5c2.34 0 4.47.86 6.11 2.28l-2.08 2.43A6.15 6.15 0 0 0 12 16.2a6.15 6.15 0 0 0-4.03 1.51l-2.08-2.43A9.34 9.34 0 0 1 12 13Zm0-6c4.08 0 7.8 1.49 10.66 3.96l-2.08 2.43A13.04 13.04 0 0 0 12 10.2c-3.28 0-6.28 1.2-8.58 3.19l-2.08-2.43A16.26 16.26 0 0 1 12 7Zm0-6c5.82 0 11.13 2.12 15.22 5.64l-2.09 2.43A19.97 19.97 0 0 0 12 4.2c-5.01 0-9.59 1.83-13.13 4.87l-2.09-2.43A23.18 23.18 0 0 1 12 1Z" transform="scale(.72) translate(4.65 2.2)"></path>
                </svg>
                <span class="status-battery" id="status-battery" aria-label="Battery 87 percent">
                    <span class="status-battery-value" id="status-battery-value">87</span>
                    <span class="status-battery-icon" aria-hidden="true">
                        <span class="status-battery-level" id="status-battery-level"></span>
                    </span>
                </span>
            </div>
        </div>

        <div class="batch-overlay" id="batch-overlay" onclick="closeBatchInfoPage(event)">
            <div class="batch-panel" onclick="event.stopPropagation()">
                <div class="batch-header-bar">
                    <button class="batch-icon-btn" type="button" onclick="handleBatchBack(event)" aria-label="Back">
                        <svg viewBox="0 0 24 24">
                            <path d="M15 18l-6-6 6-6"></path>
                        </svg>
                    </button>
                    <div class="batch-header-title" id="batch-header-title">Batch Reports</div>
                    <button type="button" id="attd-close-batch" class="attd-button attd-close-batch" hidden>Close Batch</button>
                    <div class="batch-header-actions" id="batch-header-actions">
                        <button class="batch-print-btn hidden" id="batch-print-btn" type="button"
                            aria-label="Print batch reports" aria-haspopup="menu" aria-expanded="false"
                            onclick="toggleBatchPrintMenu(event)">
                            <span class="material-symbols-rounded" aria-hidden="true">print</span>
                        </button>
                        <div class="batch-print-menu" id="batch-print-menu" role="menu"
                            aria-label="Select batch report to print">
                            <button class="batch-print-option" type="button" role="menuitem"
                                onclick="handleBatchReportPrint('summary', event)">
                                <span class="batch-print-option-index" aria-hidden="true">1</span>
                                <span>Batch Summary</span>
                            </button>
                            <button class="batch-print-option" type="button" role="menuitem"
                                onclick="handleBatchReportPrint('details', event)">
                                <span class="batch-print-option-index" aria-hidden="true">2</span>
                                <span>Transaction Details</span>
                            </button>
                            <button class="batch-print-option" type="button" role="menuitem"
                                onclick="handleBatchReportPrint('all', event)">
                                <span class="batch-print-option-index" aria-hidden="true">3</span>
                                <span>Summary + Details</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="batch-home" id="batch-home">
                    <div class="batch-option-list">
                        <button class="batch-option-card" type="button" onclick="openBatchDetail('current')">
                            <span class="batch-option-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v13A2.5 2.5 0 0 1 17.5 21h-11A2.5 2.5 0 0 1 4 18.5z"></path>
                                    <path d="M8 8h8M8 12h8M8 16h5"></path>
                                </svg>
                            </span>
                            <span>
                                <span class="batch-option-title">Current Batch Reports</span>
                                <span class="batch-option-meta">OPEN BATCH</span>
                            </span>
                            <span class="batch-option-arrow" aria-hidden="true">></span>
                        </button>

                        <button class="batch-option-card" type="button" onclick="openBatchDetail('last')">
                            <span class="batch-option-icon last" aria-hidden="true">
                                <svg viewBox="0 0 24 24">
                                    <path d="M5 4h11.5A2.5 2.5 0 0 1 19 6.5v11A2.5 2.5 0 0 1 16.5 20h-11A2.5 2.5 0 0 1 3 17.5v-11A2.5 2.5 0 0 1 5.5 4"></path>
                                    <path d="M8 9h7M8 13h7"></path>
                                    <path d="m9 17 2 2 4-5"></path>
                                </svg>
                            </span>
                            <span>
                                <span class="batch-option-title">Last Batch Reports</span>
                                <span class="batch-option-meta">CLOSED BATCH</span>
                            </span>
                            <span class="batch-option-arrow" aria-hidden="true">></span>
                        </button>

                        <button class="batch-option-card" type="button" onclick="openBatchHistory()">
                            <span class="batch-option-icon history" aria-hidden="true">
                                <span class="material-symbols-rounded">history</span>
                            </span>
                            <span>
                                <span class="batch-option-title">Batch History</span>
                                <span class="batch-option-meta">RECENT 15 CLOSED BATCHES</span>
                            </span>
                            <span class="batch-option-arrow" aria-hidden="true">></span>
                        </button>
                    </div>
                </div>

                <div class="batch-history hidden" id="batch-history">
                    <div class="batch-history-heading">
                        <span class="batch-history-heading-title">Closed batch reports</span>
                        <span class="batch-history-heading-limit">Most recent 15</span>
                    </div>
                    <div class="batch-history-list" id="batch-history-list"></div>
                </div>

                <div class="batch-detail hidden" id="batch-detail">
                    <div class="batch-state" id="batch-loading-state">
                        <div class="batch-spinner" aria-hidden="true"></div>
                        <div>Loading batch reports...</div>
                    </div>

                    <div class="batch-state batch-error hidden" id="batch-error-state">
                        <div id="batch-error-text">Unable to load batch reports.</div>
                        <button class="batch-retry-btn" type="button" onclick="retryBatchInfo(event)">Retry</button>
                    </div>

                    <div class="batch-detail-content hidden" id="batch-detail-content">
                        <div class="batch-summary-card">
                            <div class="batch-summary-top">
                                <div class="batch-summary-title">BATCH <span id="batch-id">-</span></div>
                                <span class="batch-status-pill" id="batch-settle-status">-</span>
                            </div>
                            <div class="batch-identity-meta">
                                <span class="batch-identity-meta-item">MID <strong id="batch-mid">-</strong></span>
                                <span class="batch-identity-separator" aria-hidden="true">•</span>
                                <span class="batch-identity-meta-item">TID <strong id="batch-tid">-</strong></span>
                            </div>
                            <div class="batch-reconciliation-grid">
                                <div class="batch-reconciliation-item">
                                    <span class="batch-reconciliation-label">Card Net</span>
                                    <span class="batch-reconciliation-value" id="batch-card-net">$0.00</span>
                                </div>
                                <div class="batch-reconciliation-item">
                                    <span class="batch-reconciliation-label">Cash Net</span>
                                    <span class="batch-reconciliation-value" id="batch-cash-net">$0.00</span>
                                </div>
                                <div class="batch-reconciliation-item total">
                                    <span class="batch-reconciliation-label">Total Receipts</span>
                                    <span class="batch-reconciliation-value" id="batch-total-receipts">$0.00</span>
                                </div>
                            </div>
                        </div>

                        <div class="batch-overview-card">
                            <div class="batch-report-heading batch-report-heading-split">
                                <span>Card Transaction Summary</span>
                            </div>
                            <div class="batch-transaction-summary" id="batch-card-transaction-summary"></div>
                        </div>

                        <div class="batch-payment-section">
                            <div class="batch-report-heading">Card Brand Summary</div>
                            <div class="batch-payment-list" id="batch-payment-summary-list"></div>
                        </div>

                        <section class="attd-report-card" id="attd-fees"></section>
                        <div class="batch-cash-section">
                            <div class="batch-report-heading">Cash Summary</div>
                            <div class="batch-cash-list">
                                <div class="batch-cash-row">
                                    <span class="batch-cash-label">SALE</span>
                                    <span class="batch-cash-count" id="batch-cash-sale-count">0</span>
                                    <span class="batch-cash-amount" id="batch-cash-sale-amount">$0.00</span>
                                </div>
                                <div class="batch-cash-row">
                                    <span class="batch-cash-label">REFUND</span>
                                    <span class="batch-cash-count" id="batch-cash-refund-count">0</span>
                                    <span class="batch-cash-amount" id="batch-cash-refund-amount">$0.00</span>
                                </div>
                                <div class="batch-cash-row net">
                                    <span class="batch-cash-label">NET CASH</span>
                                    <span class="batch-cash-count" id="batch-cash-net-count">0</span>
                                    <span class="batch-cash-amount" id="batch-cash-summary-net">$0.00</span>
                                </div>
                            </div>
                        </div>

                        <section class="attd-report-card" id="attd-audit"></section>
                        <div class="batch-transaction-section">
                            <button class="batch-transactions-toggle" id="batch-transactions-toggle" type="button"
                                aria-expanded="false" onclick="toggleBatchTransactions(event)">
                                <span class="batch-transactions-label">Transaction Details</span>
                                <span class="batch-transactions-meta">
                                    <span id="batch-transaction-count">0 items</span>
                                    <span class="material-symbols-rounded batch-transactions-chevron"
                                        aria-hidden="true">expand_more</span>
                                </span>
                            </button>
                            <div class="batch-tx-list" id="batch-transaction-list" hidden></div>
                        </div>
                    </div>
                </div>
                <div class="batch-print-toast" id="batch-print-toast" role="status" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <script src="assets/merchant-context.js"></script>
    <script src="js/status_bar.js"></script>
    <script src="js/attended_demo.js"></script>
    <script src="js/attended_ui.js"></script>
    <script src="js/batch_reports.js"></script>
    <script src="js/attended_batch.js"></script>
</body>

</html>
