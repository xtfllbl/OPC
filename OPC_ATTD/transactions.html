<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>POS - Transactions</title>
    <style>
        :root {
            --bg: #F2F4F7;
            --card: #FFFFFF;
            --blue: #0A5BFF;
            --text: #0F172A;
            --muted: #64748B;
            --border: #E6EAF0;
            --line: #EDF2F7;
            --danger: #C62828;
        }

        * {
            box-sizing: border-box;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: linear-gradient(180deg, #F8FAFD 0%, #F2F4F7 100%);
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 0 12px #1a1a1a, 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            padding: 0 24px;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            background: var(--card);
            z-index: 10;
        }

        .app-header {
            height: 56px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 8px;
        }

        .app-header .left {
            width: 84px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .app-header .title {
            flex: 1;
            text-align: center;
            font-weight: 800;
            color: var(--text);
            font-size: 18px;
            letter-spacing: 0.2px;
        }

        .app-header .right {
            width: 84px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .filter-wrap {
            position: relative;
        }

        .back-btn,
        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: #FFFFFF;
            color: #475569;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
        }

        .back-btn svg,
        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .filter-menu {
            position: absolute;
            top: 40px;
            right: 0;
            min-width: 170px;
            padding: 6px;
            background: #FFFFFF;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
            display: none;
            z-index: 40;
        }

        .filter-menu.open {
            display: block;
        }

        .filter-item {
            width: 100%;
            height: 34px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #0F172A;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            padding: 0 10px;
            cursor: pointer;
        }

        .filter-item:hover {
            background: #F1F5FF;
        }

        .filter-item.active {
            background: #EAF1FF;
            color: #1D4ED8;
            font-weight: 700;
        }

        .content {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #F8FAFE;
            border-bottom: 1px solid var(--border);
        }

        .filter-chip {
            height: 30px;
            border-radius: 999px;
            background: #EAF1FF;
            border: 1px solid #CFDFFF;
            color: #1D4ED8;
            font-size: 12px;
            font-weight: 700;
            padding: 0 12px;
            display: inline-flex;
            align-items: center;
        }

        .count-text {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        .search-wrap {
            display: none;
            padding: 8px 16px 10px;
            background: #F8FAFE;
            border-bottom: 1px solid var(--border);
        }

        .search-wrap.open {
            display: block;
        }

        .search-input {
            width: 100%;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 12px;
            font-size: 14px;
            color: var(--text);
            background: #FFFFFF;
            outline: none;
        }

        .table-head {
            display: grid;
            grid-template-columns: 76px 90px minmax(0, 1fr);
            gap: 10px;
            padding: 10px 16px;
            background: #FFFFFF;
            border-bottom: 1px solid var(--line);
            color: #8190A7;
            font-size: 12px;
            font-weight: 700;
        }

        .tx-list {
            flex: 1;
            overflow: auto;
            background: #FFFFFF;
        }

        .tx-row {
            display: grid;
            grid-template-columns: 76px 90px minmax(0, 1fr);
            gap: 10px;
            align-items: center;
            min-height: 68px;
            padding: 8px 16px;
            text-decoration: none;
            color: var(--text);
            border-bottom: 1px solid var(--line);
            transition: background 0.15s ease;
        }

        .tx-row:active {
            background: #F4F8FF;
        }

        .tx-date {
            color: #667085;
            font-size: 9px;
            font-weight: 700;
            line-height: 1.2;
            white-space: nowrap;
        }

        .tx-time {
            margin-top: 2px;
            font-size: 12px;
            font-weight: 800;
            line-height: 1.2;
            white-space: nowrap;
        }

        .tx-id {
            margin-top: 3px;
            font-size: 9px;
            color: #94A3B8;
            font-weight: 600;
        }

        .tx-amount {
            text-align: left;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.1px;
        }

        .tx-amount.negative {
            color: var(--danger);
        }

        .tx-tender {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-chip {
            width: 34px;
            height: 22px;
            border-radius: 6px;
            border: 1px solid #D9E2EF;
            flex-shrink: 0;
            background: #FFFFFF;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .brand-chip-logo {
            display: block;
            width: 27px;
            height: 16px;
            object-fit: contain;
        }

        .brand-chip-logo.brand-mastercard,
        .brand-chip-logo.brand-maestro {
            width: 24px;
            height: 16px;
        }

        .brand-chip-logo.brand-amex,
        .brand-chip-logo.brand-unionpay,
        .brand-chip-logo.brand-interac {
            width: 20px;
            height: 17px;
        }

        .brand-chip-logo.brand-jcb {
            width: 23px;
            height: 18px;
        }

        .brand-chip-logo.brand-discover,
        .brand-chip-logo.brand-rupay,
        .brand-chip-logo.brand-eftpos,
        .brand-chip-logo.brand-mir {
            width: 28px;
            height: 12px;
        }

        .brand-chip-logo.brand-diners,
        .brand-chip-logo.brand-elo {
            width: 24px;
            height: 16px;
        }

        .brand-fallback {
            color: #475569;
            font-size: 8px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .cash-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #7FC242;
            border-color: #6FAF39;
            color: #FFFFFF;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        .tx-method {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tx-sub {
            margin-top: 2px;
            color: #94A3B8;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
            padding: 24px;
        }

        .notice {
            text-align: center;
            color: #8A96A8;
            font-size: 13px;
            font-weight: 600;
            padding: 14px 20px 18px;
            line-height: 1.35;
            border-top: 1px solid var(--line);
            background: #FFFFFF;
        }

    </style>

        const state = {

        const cardBrandAssets = {
            VISA: { src: 'assets/visa.svg', className: 'brand-visa', shortName: 'VISA' },
            MASTERCARD: { src: 'assets/mastercard.svg', className: 'brand-mastercard', shortName: 'MC' },

        };

        const filterLabelMap = {
            all: 'All Types',
            card: 'Sales / Completed', preauth: 'Pre-Auths (Open)', void: 'Voids',
            cash: 'Cash Payments',
            refund: 'Refunds'
        };

        const listEl = document.getElementById('tx-list');
        const emptyEl = document.getElementById('empty-state');
        const filterLabelEl = document.getElementById('filter-label');
        const countTextEl = document.getElementById('count-text');
        const filterBtn = document.getElementById('filter-btn');
        const filterMenu = document.getElementById('filter-menu');
        const filterItems = Array.from(document.querySelectorAll('.filter-item'));
        const searchBtn = document.getElementById('search-btn');
        const searchWrap = document.getElementById('search-wrap');
        const searchInput = document.getElementById('search-input');

        function formatAmount(amount) {
            const value = Math.abs(Number(amount || 0)).toFixed(2);
            return amount < 0 ? '-$' + value : '$' + value;
        }

        function parseTransactionTime(tranTime) {
            if (!tranTime) return null;
            const parsed = new Date(String(tranTime).replace(' ', 'T'));
            return Number.isNaN(parsed.getTime()) ? null : parsed;
        }

        function formatTransactionDate(tranTime) {
            const parsed = parseTransactionTime(tranTime);
            return parsed
                ? parsed.toLocaleDateString('en-US', { month: '2-digit', day: '2-digit', year: '2-digit' })
                : '-';
        }

        function formatTransactionTime(tranTime) {
            const parsed = parseTransactionTime(tranTime);
            return parsed
                ? parsed.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })
                : (tranTime || '-');
        }

        function cardMeta(tx) {
            if (tx.tenderType !== 'card') return '';
            const asset = cardBrandAssets[tx.cardType];
            const brandName = asset ? asset.shortName : (tx.cardType || 'CARD');
            return `${brandName} ****${String(tx.lastFour || '').padStart(4, '0')}`;
        }

        function transactionTypeLabel(tx) {
            const kind = String(tx && tx.kind ? tx.kind : '').trim().toLowerCase();
            if (kind === 'preauth') return 'PreAuth';
            if (kind === 'refund') return 'Refund';
            if (kind === 'capture') return 'Capture';
            if (kind === 'payment' || kind === 'sale') return 'Sale';
            return kind ? kind.charAt(0).toUpperCase() + kind.slice(1) : 'Sale';
        }

        function transactionMeta(tx) {
            return tx.tenderType === 'cash' ? 'Cash' : cardMeta(tx);
        }

        function tenderIconMarkup(tx) {
            if (tx.tenderType === 'cash') {
                return '<span class="brand-chip cash-chip" aria-hidden="true">CASH</span>';
            }
            const asset = cardBrandAssets[tx.cardType];
            if (!asset) {
                return `<span class="brand-chip brand-fallback" aria-hidden="true">${tx.cardType || 'CARD'}</span>`;
            }
            return `
                <span class="brand-chip">
                    <img class="brand-chip-logo ${asset.className}" src="${asset.src}" alt="${tx.cardType}">
                </span>
            `;
        }

        function matchesFilter(tx) {
            if (lookupParams.get('batch') && tx.batchId !== lookupParams.get('batch')) return false;
            if (lookupAction && !AttendedDemo.eligible(lookupAction).some(t=>t.id===tx.id)) return false;
            if (state.filter === 'preauth') return tx.kind === 'preauth' && tx.status === 'OPEN AUTH';
            if (state.filter === 'void') return tx.status === 'VOIDED';
            if (state.filter === 'all') return true;
            if (state.filter === 'card') return ['payment','sale','capture'].includes(tx.kind) && tx.status !== 'VOIDED';
            if (state.filter === 'cash') return tx.tenderType === 'cash';
            if (state.filter === 'refund') return tx.kind === 'refund' && tx.status !== 'VOIDED';
            return true;
        }

        function matchesQuery(tx) {
            if (!state.query) return true;
            const haystack = [
                tx.tranTime,
                formatTransactionDate(tx.tranTime),
                formatTransactionTime(tx.tranTime),
                tx.invoice,
                transactionTypeLabel(tx),
                tx.cardType,
                tx.lastFour,
                transactionMeta(tx),
                formatAmount(tx.amount)
            ].join(' ').toLowerCase();
            return haystack.includes(state.query);
        }

        function renderRows() {
            const rows = transactions.filter((tx) => matchesFilter(tx) && matchesQuery(tx));

            filterLabelEl.textContent = filterLabelMap[state.filter];
            countTextEl.textContent = rows.length + (rows.length === 1 ? ' transaction' : ' transactions');
            filterItems.forEach((item) => {
                item.classList.toggle('active', item.dataset.filter === state.filter);
            });

            if (!rows.length) {
                listEl.innerHTML = '';
                emptyEl.style.display = 'flex';
                return;
            }

            emptyEl.style.display = 'none';
            listEl.innerHTML = rows.map((tx) => {
                const amountClass = tx.amount < 0 ? 'tx-amount negative' : 'tx-amount';
                const meta = transactionMeta(tx);
                const tenderMeta = meta ? `<div class="tx-sub">${meta}</div>` : '';
                return `
                    <a class="tx-row" data-tx-id="${tx.id}" href="${lookupAction && lookupAction!=='review' ? 'index.html?'+new URLSearchParams({action:lookupAction,selected:tx.id}) : 'transaction_detail.html?id='+encodeURIComponent(tx.id)}">
                        <div>
                            <div class="tx-date">${formatTransactionDate(tx.tranTime)}</div>
                            <div class="tx-time">${formatTransactionTime(tx.tranTime)}</div>
                            <div class="tx-id">#${tx.invoice}</div>
                        </div>
                        <div class="tx-tender">
                            ${tenderIconMarkup(tx)}
                            <div style="min-width:0;">
                                <div class="tx-method">${transactionTypeLabel(tx)}</div>
                                ${tenderMeta}
                            </div>
                        </div>
                        <div class="tx-amount-wrap"><div class="${amountClass}">${formatAmount(tx.amount)}</div><span class="attd-status ${tx.status==='OPEN AUTH'?'open':tx.status==='VOIDED'?'voided':''}">${tx.status||'APPROVED'}</span></div>
                    </a>
                `;
            }).join('');
        }

        function closeFilterMenu() {
            filterMenu.classList.remove('open');
            filterBtn.setAttribute('aria-expanded', 'false');
        }

        function openFilterMenu() {
            filterMenu.classList.add('open');
            filterBtn.setAttribute('aria-expanded', 'true');
        }

        filterBtn.addEventListener('click', (event) => {
            event.stopPropagation();
            const isOpen = filterMenu.classList.contains('open');
            if (isOpen) {
                closeFilterMenu();
            } else {
                openFilterMenu();
            }
        });

        filterItems.forEach((item) => {
            item.addEventListener('click', (event) => {
                event.stopPropagation();
                state.filter = item.dataset.filter || 'all';
                closeFilterMenu();
                renderRows();
            });
        });

        document.addEventListener('click', (event) => {
            if (!event.target.closest('.filter-wrap')) {
                closeFilterMenu();
            }
        });

        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                closeFilterMenu();
            }
        });

        searchBtn.addEventListener('click', () => {
            const open = !searchWrap.classList.contains('open');
            searchWrap.classList.toggle('open', open);
            if (open) {
                searchInput.focus();
            } else {
                state.query = '';
                searchInput.value = '';
                renderRows();
            }
        });

        searchInput.addEventListener('input', (event) => {
            state.query = event.target.value.trim().toLowerCase();
            renderRows();
        });


        const backLink=document.querySelector('.back-btn');
        if(lookupAction) backLink.href=lookupAction==='review'?'batch_reports.html?mode=close':'index.html?'+new URLSearchParams({action:lookupAction});
        if(['Auth-Incremental','Capture','review'].includes(lookupAction)) document.querySelector('.filter-wrap').hidden=true;
        listEl.addEventListener('click',event=>{
            const link=event.target.closest('[data-tx-id]');
            if(!link || (lookupAction&&lookupAction!=='review'))return;
            const tx=AttendedDemo.find(link.dataset.txId);if(!tx)return;
            event.preventDefault();
            const actions=[{label:'Close'}];
            if(tx.kind==='preauth'&&tx.status==='OPEN AUTH'){
                actions.push({label:'Capture',primary:true,run:()=>location.href='index.html?'+new URLSearchParams({action:'Capture',selected:tx.id})});
            }
            actions.push({label:'Reprint',run:()=>location.href='index.html?'+new URLSearchParams({action:'Reprint',selected:tx.id})});
            AttendedUI.modal({title:transactionTypeLabel(tx),body:AttendedUI.details(tx),actions});
        });
        const keyboard=document.createElement('div');keyboard.className='attd-search-keyboard';keyboard.hidden=true;keyboard.setAttribute('aria-label','Search keypad');
        keyboard.innerHTML=['1','2','3','4','5','6','7','8','9','.','0','⌫','Done'].map(k=>`<button type="button">${k}</button>`).join('');
        document.querySelector('.phone-frame').append(keyboard);
        keyboard.addEventListener('pointerdown',e=>e.preventDefault());
        keyboard.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;const k=e.target.textContent;if(k==='Done'){keyboard.hidden=true;searchInput.blur();return;}searchInput.value=k==='⌫'?searchInput.value.slice(0,-1):searchInput.value+k;state.query=searchInput.value.trim().toLowerCase();renderRows();});
        searchInput.addEventListener('focus',()=>keyboard.hidden=false);
        searchBtn.addEventListener('click',()=>{if(!searchWrap.classList.contains('open'))keyboard.hidden=true;});
        renderRows();
    </script>
</body>
</html>
