<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Failed</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --primary-gradient: linear-gradient(135deg, #007AFF 0%, #0056b3 100%);
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --text-main: #FFFFFF;
            --text-sub: #A0A0A0;
            --accent-warning: #FFD700;
            --accent-fail: #ff4d4d;
            --accent-fail-deep: #b91919;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .device-container {
            width: 480px;
            height: 100vh;
            max-height: 800px;
            background: radial-gradient(140% 120% at 50% 0%, #1a1a1a 0%, #121212 45%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.55);
        }

        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
            height: 60px;
        }

        .unlock-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            gap: 36px;
        }

        .status-title {
            font-size: 34px;
            font-weight: 800;
            margin-top: 2px;
        }

        .status-sub {
            font-size: 18px;
            color: var(--text-sub);
            max-width: 320px;
            line-height: 1.4;
            margin-top: 8px;
        }

        .cross-visual {
            position: relative;
            width: 240px;
            height: 260px;
            display: grid;
            place-items: center;
        }

        .cross-visual::before {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 77, 77, 0.45), rgba(255, 77, 77, 0));
            filter: blur(6px);
            animation: failPulse 2.6s ease-in-out infinite;
        }

        .cross-circle {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffb3b3 0%, var(--accent-fail) 50%, var(--accent-fail-deep) 100%);
            box-shadow: 0 18px 40px rgba(180, 32, 32, 0.35), inset 0 0 14px rgba(255, 255, 255, 0.18);
            display: grid;
            place-items: center;
            position: relative;
            z-index: 1;
        }

        .cross-icon {
            width: 100px;
            height: 100px;
        }

        .cross-icon line {
            fill: none;
            stroke: #3a0b0b;
            stroke-width: 14;
            stroke-linecap: round;
            stroke-dasharray: 140;
            stroke-dashoffset: 140;
            animation: crossDraw 0.9s ease-out forwards;
        }

        .cross-icon line:nth-child(2) {
            animation-delay: 0.15s;
        }

        .footer {
            padding: 20px 24px 26px;
            display: flex;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .return-btn {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #ff5a5a 0%, #c72222 100%);
            border: none;
            border-radius: 14px;
            color: #2c0505;
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 0.6px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 24px rgba(199, 34, 34, 0.35);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s ease;
        }

        .return-btn:active {
            transform: scale(0.98);
        }

        .return-countdown {
            font-size: 16px;
            font-weight: 600;
            color: rgba(44, 5, 5, 0.65);
        }

        .return-btn--ready .return-countdown {
            opacity: 0.7;
        }

        @keyframes failPulse {
            0%, 100% { opacity: 0.25; transform: scale(0.98); }
            50% { opacity: 0.7; transform: scale(1.03); }
        }

        @keyframes crossDraw {
            from { stroke-dashoffset: 140; }
            to { stroke-dashoffset: 0; }
        }

        @media screen and (max-height: 500px) {
            .header { padding: 8px 15px; height: 50px; }
            .unlock-section { padding: 16px; gap: 24px; }
            .status-title { font-size: 26px; }
            .status-sub { font-size: 14px; }
            .cross-visual { width: 190px; height: 220px; }
            .cross-circle { width: 130px; height: 130px; }
            .cross-icon { width: 72px; height: 72px; }
            .footer { padding: 12px 20px 16px; }
            .return-btn { height: 48px; font-size: 18px; }
            .return-countdown { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="device-container">
        <div class="header">
            <span>WP5120Q3000001</span>
        </div>

        <div class="unlock-section">
            <div>
                <!-- <div class="status-title">Payment Failed</div>
                <div class="status-sub">Please try again or use another card.</div> -->
                <div class="status-title">Failed to Open Door</div>
                <div class="status-sub">Please try again. You have not been charged.</div>
            </div>

            <div class="cross-visual" aria-hidden="true">
                <div class="cross-circle">
                    <svg class="cross-icon" viewBox="0 0 120 120" aria-hidden="true">
                        <line x1="24" y1="24" x2="96" y2="96" />
                        <line x1="96" y1="24" x2="24" y2="96" />
                    </svg>
                </div>
            </div>
        </div>

        <div class="footer">
            <button class="return-btn" type="button">
                RETURN <span class="return-countdown">(10s)</span>
            </button>
        </div>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const returnBtn = document.querySelector('.return-btn');
            const countdownEl = document.querySelector('.return-countdown');
            if (!returnBtn || !countdownEl) return;

            let remaining = 10;
            let timer = null;

            const updateCountdown = () => {
                countdownEl.textContent = `(${remaining}s)`;
                if (remaining === 0) {
                    returnBtn.classList.add('return-btn--ready');
                    clearInterval(timer);
                    return;
                }
                remaining -= 1;
            };

            returnBtn.addEventListener('click', () => {
                window.history.back();
            });

            updateCountdown();
            timer = setInterval(updateCountdown, 1000);
        });
    </script>
</body>
</html>
