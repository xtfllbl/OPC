<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPC Mini - Square POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0A5BFF;
            --success: #00A86B;
            --warning: #F59E0B;
            --danger: #EF4444;
            --bg-body: #F3F4F6;
            --surface: #FFFFFF;
            --text-dark: #111827;
            --text-muted: #6B7280;
            --shadow-lg: 0 18px 40px rgba(15, 23, 42, 0.16);
            --shadow-sm: 0 8px 18px rgba(15, 23, 42, 0.08);
            --radius-lg: 20px;
            --radius-md: 14px;
            --card-accent: #0A5BFF;
            --card-soft: #E6EEFF;
            --qr-accent: #00A86B;
            --qr-soft: #E7FAF1;
            --accent: var(--card-accent);
            --accent-soft: var(--card-soft);
            --text-grey: var(--text-muted);
            --card-bg: var(--surface);
            --color-sale-text: var(--card-accent);
            --color-success-text: var(--qr-accent);
            --color-purple-text: #7C3AED;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background: #1B1B1B;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            font-family: inherit;
        }

        .mini-frame {
            width: 480px;
            height: 480px;
            background: var(--bg-body);
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 0 10px #101010, var(--shadow-lg);
        }

        .mini-frame::before,
        .mini-frame::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            opacity: 0.9;
            filter: blur(0.5px);
        }

        .mini-frame::before {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 30% 30%, rgba(10, 91, 255, 0.2), transparent 65%);
            top: -110px;
            right: -100px;
        }

        .mini-frame::after {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle at 70% 70%, rgba(17, 24, 39, 0.08), transparent 60%);
            bottom: -130px;
            left: -110px;
        }

        .mini-frame.mode-qr {
            --accent: var(--qr-accent);
            --accent-soft: var(--qr-soft);
        }

        .mini-frame.mode-qr::before {
            background: radial-gradient(circle at 30% 30%, rgba(0, 168, 107, 0.2), transparent 65%);
        }

        .mini-content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 14px 16px 16px;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 10px;
        }

        .status-bar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--text-muted);
        }

        .status-bar > #time-display {
            justify-self: start;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            letter-spacing: 0.1em;
            justify-self: end;
        }

        .battery {
            width: 22px;
            height: 10px;
            border-radius: 3px;
            border: 1.5px solid #9CA3AF;
            position: relative;
        }

        .battery::after {
            content: "";
            position: absolute;
            right: -3px;
            top: 2px;
            width: 2px;
            height: 6px;
            border-radius: 1px;
            background: #9CA3AF;
        }

        .battery-level {
            height: 100%;
            border-radius: 2px;
            background: #111827;
        }

        .pull-tab {
            width: 34px;
            height: 16px;
            margin: 0;
            border: none;
            background: transparent;
            display: grid;
            place-items: center;
            cursor: pointer;
            touch-action: manipulation;
            justify-self: center;
        }

        .pull-tab svg {
            width: 22px;
            height: 12px;
            stroke: var(--text-dark);
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.7;
        }

        .amount-section {
            padding: 0 6px;
            text-align: center;
        }

        .amount-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 8px;
        }

        .currency {
            font-size: 18px;
            font-weight: 600;
            color: rgba(15, 23, 42, 0.6);
        }

        .amount-value {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -1.6px;
            color: var(--text-dark);
            line-height: 1.05;
            text-shadow: 0 6px 16px rgba(15, 23, 42, 0.15);
        }

        .amount-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 6px;
            gap: 6px;
        }

        .type-pill {
            border: 1px solid rgba(15, 23, 42, 0.12);
            background: rgba(15, 23, 42, 0.03);
            color: var(--text-dark);
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .type-pill svg {
            width: 12px;
            height: 12px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .action-panel {
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 10px;
            height: 100%;
            padding: 0 2px 4px;
        }

        .keypad {
            position: relative;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(4, minmax(0, 1fr));
            gap: 10px;
            height: 100%;
            width: 100%;
            padding: 0;
            justify-items: stretch;
            align-items: stretch;
        }

        .key {
            background: linear-gradient(180deg, #FFFFFF 0%, #F7F8FA 100%);
            border-radius: var(--radius-md);
            border: none;
            box-shadow: 0 1px 0 rgba(15, 23, 42, 0.06), 0 8px 16px rgba(15, 23, 42, 0.06);
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
            transition: background 0.12s ease, transform 0.12s ease;
            width: 100%;
            height: 100%;
            min-height: 58px;
        }

        .key:active {
            background: #F3F4F6;
            transform: scale(0.98);
        }

        .key-func {
            background: #EFF2F6;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #374151;
        }

        .key-back {
            background: #EEF2F6;
            color: #111827;
        }

        .key-back svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .cta-group {
            --cta-type-space: clamp(120px, 30vw, 170px);
            position: relative;
            width: 100%;
            height: 56px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.18);
            background: var(--accent);
        }

        .cta {
            width: 100%;
            height: 100%;
            border-radius: 18px;
            border: none;
            background: var(--accent);
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            cursor: pointer;
            touch-action: manipulation;
            transition: filter 0.12s ease;
            display: grid;
            place-items: center;
            padding-right: var(--cta-type-space);
        }

        .cta-select {
            border: none;
            background: rgba(255, 255, 255, 0.18);
            color: #FFFFFF;
            height: 100%;
            padding: 0 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 700;
            font-size: 11px;
            transition: filter 0.12s ease;
            border-radius: 0 18px 18px 0;
            position: absolute;
            right: 0;
            top: 0;
            transform: none;
            box-shadow: none;
            opacity: 1;
            width: var(--cta-type-space);
            border-left: 1px solid rgba(255, 255, 255, 0.35);
        }

        .cta-type-label {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cta-select svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.9;
        }

        .cta:active,
        .cta-select:active {
            filter: brightness(0.94);
        }

        .type-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 10;
        }

        .type-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .type-panel {
            position: absolute;
            inset: 0;
            background: #F9FAFB;
            border-radius: 0;
            padding: 8px 16px 16px;
            transform: translateY(-100%);
            transition: transform 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .type-overlay.open .type-panel {
            transform: translateY(0);
        }

        .type-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .type-settings-btn {
            position: absolute;
            top: 8px;
            right: 16px;
            width: 28px;
            height: 28px;
            border-radius: 999px;
            border: none;
            background: #FFFFFF;
            color: var(--text-dark);
            display: grid;
            place-items: center;
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.08);
            cursor: pointer;
            touch-action: manipulation;
        }

        .type-settings-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .type-column-headings {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            align-items: stretch;
            position: sticky;
            top: 0;
            z-index: 2;
            background: #F9FAFB;
            padding: 6px 0 12px;
        }

        .type-column-headings.single-column {
            grid-template-columns: minmax(0, 1fr);
        }

        .type-column-pill {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            padding: 4px 0 12px;
            border-radius: 0;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            border: none;
            background: transparent;
            box-shadow: none;
            width: 100%;
            position: relative;
            text-align: center;
            line-height: 1;
        }

        .type-column-pill.card {
            color: var(--card-accent);
        }

        .type-column-pill.qr {
            color: var(--qr-accent);
        }

        .type-column-pill::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.12);
        }

        .type-column-pill.card::after {
            background: rgba(10, 91, 255, 0.35);
        }

        .type-column-pill.qr::after {
            background: rgba(0, 168, 107, 0.35);
        }

        .panel-handle {
            width: 100%;
            border: none;
            background: transparent;
            display: flex;
            justify-content: center;
            padding: 4px 0 6px;
            cursor: pointer;
        }

        .panel-handle svg {
            width: 22px;
            height: 12px;
            stroke: var(--text-dark);
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.7;
            transform: rotate(180deg);
        }

        .type-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 0 2px 16px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .type-list::-webkit-scrollbar {
            display: none;
        }

        .type-columns {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            align-items: start;
        }

        .type-columns.single-column {
            grid-template-columns: minmax(0, 1fr);
        }

        .type-column {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .type-option {
            border: 1px solid #E5E7EB;
            border-radius: 14px;
            background: #FFFFFF;
            padding: 16px 14px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: border 0.15s ease, background 0.15s ease, color 0.15s ease;
            touch-action: manipulation;
            min-height: 104px;
            color: var(--text-dark);
        }

        .type-option[data-mode="card"] {
            border-color: rgba(10, 91, 255, 0.35);
            color: var(--card-accent);
        }

        .type-option[data-mode="qr"] {
            border-color: rgba(0, 168, 107, 0.35);
            color: var(--qr-accent);
        }

        .type-option[data-mode="card"] .type-icon {
            background: rgba(10, 91, 255, 0.12);
        }

        .type-option[data-mode="qr"] .type-icon {
            background: rgba(0, 168, 107, 0.12);
        }

        .type-option:active {
            background: #F3F4F6;
        }

        .type-option.selected {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent);
        }

        .type-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #EEF2F7;
            display: grid;
            place-items: center;
            color: currentColor;
        }

        .type-option.selected .type-icon {
            background: #FFFFFF;
        }

        .type-icon svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            stroke: none;
        }

        .type-text {
            font-size: 17px;
            font-weight: 700;
            color: currentColor;
        }

        .settings-overlay {
            position: absolute;
            inset: 0;
            background: var(--bg-body);
            z-index: 30;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            display: flex;
            flex-direction: column;
        }

        .settings-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .settings-panel {
            flex: 1;
            width: 100%;
            height: 100%;
            background: transparent;
            display: flex;
            flex-direction: column;
        }

        .settings-header-bar {
            padding: 14px 18px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border-bottom: 1px solid #E5E7EB;
            color: var(--text-dark);
        }

        .settings-header-title {
            font-size: 16px;
            font-weight: 700;
        }

        .settings-back-btn {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: var(--text-dark);
            cursor: pointer;
        }

        .settings-back-btn svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .settings-list {
            flex: 1;
            padding: 10px 16px 16px;
            overflow-y: auto;
        }

        .settings-section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-grey);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 10px 2px 4px;
        }

        .settings-group {
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
            margin-bottom: 14px;
            border: 1px solid #E5E7EB;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
        }

        .settings-row + .settings-row {
            border-top: 1px solid #F3F4F6;
        }

        .settings-row-left {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #111827;
            font-size: 13px;
            font-weight: 500;
        }

        .settings-icon {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 1.5px solid #2563EB;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2563EB;
        }

        .settings-icon.card {
            color: var(--color-sale-text);
            border-color: var(--color-sale-text);
        }

        .settings-icon.qr {
            color: var(--color-success-text);
            border-color: var(--color-success-text);
        }

        .settings-icon.gift {
            color: var(--color-purple-text);
            border-color: var(--color-purple-text);
        }

        .settings-icon svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.6;
        }

        .settings-icon svg.filled {
            fill: currentColor;
            stroke: none;
        }

        .settings-toggle {
            width: 42px;
            height: 24px;
            border-radius: 999px;
            background: #E5E7EB;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .settings-toggle-knob {
            width: 20px;
            height: 20px;
            border-radius: 999px;
            background: #FFFFFF;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25);
        }

        .settings-toggle.on {
            background: #22C55E;
            justify-content: flex-end;
        }

        .settings-chevron {
            font-size: 16px;
            color: #9CA3AF;
        }

        @media (max-width: 520px) {
            body {
                background: var(--bg-body);
            }

            .mini-frame {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="mini-frame" id="mini-frame">
        <div class="mini-content">
            <div class="status-bar">
                <span id="time-display">09:41</span>
                <button class="pull-tab" type="button" onclick="openTypePanel()" aria-label="Open transaction types">
                    <svg viewBox="0 0 24 12">
                        <path d="M2 2l10 8 10-8"></path>
                    </svg>
                </button>
                <div class="status-right">
                    <span>85%</span>
                    <div class="battery">
                        <div class="battery-level" style="width: 85%;"></div>
                    </div>
                </div>
            </div>

            <div class="action-panel">
                <div class="amount-section">
                <div class="amount-row">
                    <span class="currency">$</span>
                    <span class="amount-value" id="amount-display">0.00</span>
                </div>
            </div>
                <div class="keypad">
                    <button class="key key-1" type="button" onclick="press('1')">1</button>
                    <button class="key key-2" type="button" onclick="press('2')">2</button>
                    <button class="key key-3" type="button" onclick="press('3')">3</button>
                    <button class="key key-4" type="button" onclick="press('4')">4</button>
                    <button class="key key-5" type="button" onclick="press('5')">5</button>
                    <button class="key key-6" type="button" onclick="press('6')">6</button>
                    <button class="key key-7" type="button" onclick="press('7')">7</button>
                    <button class="key key-8" type="button" onclick="press('8')">8</button>
                    <button class="key key-9" type="button" onclick="press('9')">9</button>
                    <button class="key key-00" type="button" onclick="press('00')">00</button>
                    <button class="key key-0" type="button" onclick="press('0')">0</button>
                    <button class="key key-func key-back" type="button" onclick="press('BS')" aria-label="Delete">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" />
                            <line x1="18" y1="9" x2="12" y2="15" />
                            <line x1="12" y1="9" x2="18" y2="15" />
                        </svg>
                    </button>
                </div>
                <div class="cta-group">
                    <button class="cta" id="action-btn" type="button" onclick="doAction()">Next</button>
                    <button class="cta-select" type="button" onclick="openTypePanel()" aria-label="Select transaction type">
                        <span class="cta-type-label" id="type-label">Sale</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 9l6 6 6-6"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div class="type-overlay" id="type-overlay" onclick="closeTypePanel(event)">
            <div class="type-panel" onclick="event.stopPropagation()">
                <div class="type-header">
                    <button class="panel-handle" type="button" onclick="closeTypePanel(event)" aria-label="Close transaction types">
                        <svg viewBox="0 0 24 12">
                            <path d="M2 2l10 8 10-8"></path>
                        </svg>
                    </button>
                </div>

        const amountDisplay = document.getElementById('amount-display');
        const typeLabel = document.getElementById('type-label');
        const typeSelect = document.querySelector('.cta-select');
        const typeOverlay = document.getElementById('type-overlay');
        const settingsOverlay = document.getElementById('settings-overlay');
        const typeOptions = Array.from(document.querySelectorAll('.type-option'));
        const settingsToggles = Array.from(document.querySelectorAll('.settings-toggle[data-group]'));
        const typeColumnHeadings = document.querySelector('.type-column-headings');
        const typeColumnsWrap = document.querySelector('.type-columns');
        const typeColumns = Array.from(document.querySelectorAll('.type-column[data-group]'));
        const typePills = Array.from(document.querySelectorAll('.type-column-pill[data-group]'));
        const frame = document.getElementById('mini-frame');
        const actionButton = document.getElementById('action-btn');
        let selectedTypeLabel = typeLabel.textContent;
        const actionsRequireAmount = ['Sale', 'Auth', 'Capture', 'Void', 'Refund', 'Scan QR', 'Show Code'];
        const actionLabels = {
            Sale: 'Charge',
            Auth: 'Authorize',
            Capture: 'Capture',
            Void: 'Void',
            Refund: 'Refund',
            'Scan QR': 'Scan',
            'Show Code': 'Show Code',
            'Scan Refund': 'Refund',
            Query: 'Query'
        };
        const alternateActionLabels = {
            Capture: 'Process',
            Void: 'Confirm',
            Refund: 'Confirm',
            'Show Code': 'Display',
            'Scan Refund': 'Scan',
            Query: 'Search'
        };

        function formatMoney(cents) {
            return (parseInt(cents, 10) / 100).toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function press(key) {
            if (key === 'BS') {
                rawAmount = rawAmount.length > 1 ? rawAmount.slice(0, -1) : "0";
            } else if (key === '00') {
                if (rawAmount !== "0" && rawAmount.length < 8) rawAmount += "00";
            } else {
                if (rawAmount === "0") rawAmount = key;
                else if (rawAmount.length < 10) rawAmount += key;
            }
            amountDisplay.textContent = formatMoney(rawAmount);
        }

        function clearAmount() {
            rawAmount = "0";
            amountDisplay.textContent = formatMoney(rawAmount);
        }

        function openTypePanel() {
            typeOverlay.classList.add('open');
        }

        function closeTypePanel(event) {
            if (event) event.stopPropagation();
            typeOverlay.classList.remove('open');
        }

        function openSettings(event) {
            if (event) event.stopPropagation();
            closeTypePanel();
            if (settingsOverlay) settingsOverlay.classList.add('open');
        }

        function closeSettings(event) {
            if (event) event.stopPropagation();
            if (settingsOverlay) settingsOverlay.classList.remove('open');
        }

        function getEnabledGroups() {
            return settingsToggles
                .filter(toggle => toggle.classList.contains('on'))
                .map(toggle => toggle.dataset.group);
        }

        function applyGroupVisibility() {
            const enabledGroups = getEnabledGroups();
            const singleColumn = enabledGroups.length === 1;

            if (typeColumnHeadings) typeColumnHeadings.classList.toggle('single-column', singleColumn);
            if (typeColumnsWrap) typeColumnsWrap.classList.toggle('single-column', singleColumn);

            typePills.forEach(pill => {
                const group = pill.dataset.group;
                pill.style.display = enabledGroups.includes(group) ? '' : 'none';
            });

            typeColumns.forEach(column => {
                const group = column.dataset.group;
                column.style.display = enabledGroups.includes(group) ? '' : 'none';
            });

            typeOptions.forEach(option => {
                const mode = option.dataset.mode;
                option.style.display = enabledGroups.includes(mode) ? '' : 'none';
            });

            if (!enabledGroups.includes(selectedMode)) {
                const fallback = typeOptions.find(option => enabledGroups.includes(option.dataset.mode));
                if (fallback) {
                    selectType(fallback);
                }
            }
        }

        function toggleSetting(toggle) {
            if (!toggle) return;
            const enabledGroups = getEnabledGroups();
            const isOn = toggle.classList.contains('on');

            if (isOn && enabledGroups.length === 1) {
                return;
            }

            toggle.classList.toggle('on');
            applyGroupVisibility();
        }

        function updateMode() {
            frame.classList.toggle('mode-qr', selectedMode === 'qr');
        }

        function updateActionLabel() {
            const actionText = actionLabels[selectedType] || 'Next';
            const typeText = (selectedTypeLabel || selectedType).trim();
            const isDuplicate = actionText.trim().toLowerCase() === typeText.toLowerCase();
            actionButton.textContent = isDuplicate ? (alternateActionLabels[selectedType] || 'Proceed') : actionText;
            updateTypeDisplay();
        }

        function updateTypeDisplay() {
            const typeText = selectedTypeLabel || selectedType;
            typeLabel.textContent = typeText;
            if (typeSelect) {
                typeSelect.setAttribute('aria-label', typeText ? `Select transaction type, current ${typeText}` : 'Select transaction type');
            }
        }

        function selectType(option) {
            selectedType = option.dataset.type;
            selectedMode = option.dataset.mode;
            selectedTypeLabel = option.dataset.label || option.dataset.type;
            typeOptions.forEach(item => item.classList.toggle('selected', item === option));
            updateMode();
            updateActionLabel();
            closeTypePanel();
        }

        function startAction(actionName) {
            alert(`Start ${actionName} flow: $${formatMoney(rawAmount)}`);
        }

        function doAction() {
            if (rawAmount === "0" && actionsRequireAmount.includes(selectedType)) {
                alert('Please enter amount.');
                return;
            }
            startAction(selectedType);
        }

        function updateTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time-display').textContent = `${hours}:${minutes}`;
        }

        typeOptions.forEach(option => {
            option.addEventListener('click', () => selectType(option));
        });

        applyGroupVisibility();
        updateMode();
        updateActionLabel();
        updateTime();
        setInterval(updateTime, 60000);
    </script>
</body>
</html>
