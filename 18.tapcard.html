<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 MINI Tap Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #dce8fb;
            --text: #101010;
            --shadow: 0 0 0 10px #101010, 0 22px 48px rgba(0, 0, 0, 0.22);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #171717;
            padding: 24px;
        }

        .mini-frame {
            width: 480px;
            height: 480px;
            overflow: hidden;
            position: relative;
            border-radius: 24px;
            background: linear-gradient(180deg, #ecf3ff 0%, #d8e6fb 100%);
            box-shadow: var(--shadow);
        }

        .screen {
            width: 100%;
            height: 100%;
            padding: 22px 22px 18px;
            display: flex;
            flex-direction: column;
        }

        .serial {
            font-size: 12px;
            line-height: 1;
            color: var(--text);
        }

        .tap-label {
            font-size: 24px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: 0.16em;
            color: var(--text);
            margin-bottom: 28px;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .icon-wrap {
            width: 126px;
            height: 126px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 26px;
        }

        .icon-wrap img {
            width: 112px;
            height: 112px;
            display: block;
            filter: brightness(0);
        }

        .amount {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 8px;
            color: var(--text);
        }

        .currency {
            font-size: 62px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-top: 7px;
        }

        .amount-value {
            font-size: 82px;
            line-height: 0.92;
            font-weight: 800;
            letter-spacing: -0.08em;
        }

        .logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 38px;
        }

        .logos img {
            height: 24px;
            width: auto;
            display: block;
        }

        .interac {
            min-width: 56px;
            height: 28px;
            padding: 0 8px;
            border-radius: 6px;
            background: #ffcc32;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.03em;
            color: #111111;
        }
    </style>
</head>
<body>
    <div class="mini-frame">
        <div class="screen">
            <div class="serial" id="serial-display">WP5280VQ33200002</div>

            <main class="main" aria-label="Tap card screen">
                <div class="tap-label">TAP CARD</div>
                <div class="icon-wrap" aria-hidden="true">
                    <img src="tap.svg" alt="">
                </div>
                <div class="amount" aria-label="Amount">
                    <span class="currency" id="currency-display">$</span>
                    <span class="amount-value" id="amount-display">0.00</span>
                </div>
                <div class="logos" aria-label="Accepted brands">
                    <img src="visa.svg" alt="Visa">
                    <img src="mastercard.svg" alt="Mastercard">
                    <img src="amex.svg" alt="American Express">
                    <img src="Interac.png" alt="Interac">
                </div>
            </main>
        </div>
    </div>

    <script src="merchant-context.js"></script>
    <script>
        (function () {
            const DEFAULT_AMOUNT = 5;
            const DEFAULT_CURRENCY = "USD";
            const DEFAULT_SERIAL = "WP5280VQ33200002";

            function resolveAmount() {
                const rawAmount = Number(new URLSearchParams(window.location.search).get("amount"));
                return Number.isFinite(rawAmount) && rawAmount >= 0 ? rawAmount : DEFAULT_AMOUNT;
            }

            function resolveCurrency() {
                return new URLSearchParams(window.location.search).get("currency") || DEFAULT_CURRENCY;
            }

            function resolveSerial() {
                return new URLSearchParams(window.location.search).get("serial") || DEFAULT_SERIAL;
            }

            function formatAmountParts(amount, currency) {
                const parts = new Intl.NumberFormat("en-US", {
                    style: "currency",
                    currency: currency,
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).formatToParts(amount);

                const currencySymbol = parts
                    .filter(function (part) { return part.type === "currency"; })
                    .map(function (part) { return part.value; })
                    .join("") || "$";

                const amountValue = parts
                    .filter(function (part) {
                        return part.type !== "currency" && part.type !== "literal";
                    })
                    .map(function (part) { return part.value; })
                    .join("");

                return {
                    currencySymbol: currencySymbol,
                    amountValue: amountValue
                };
            }

            const paymentAmount = resolveAmount();
            const paymentCurrency = resolveCurrency();
            const formattedAmount = formatAmountParts(paymentAmount, paymentCurrency);
            document.getElementById("currency-display").textContent = formattedAmount.currencySymbol;
            document.getElementById("amount-display").textContent = formattedAmount.amountValue;
            document.getElementById("serial-display").textContent = resolveSerial();

            window.completeCardPayment = function () {
                const receiptParams = new URLSearchParams({
                    amount: paymentAmount.toFixed(2),
                    amountCents: String(Math.round(paymentAmount * 100)),
                    paymentMethod: "card",
                    currency: paymentCurrency
                });
                if (window.MerchantContext) window.MerchantContext.appendTo(receiptParams);
                window.location.href = "6_receipt.html?" + receiptParams.toString();
            };

            window.addEventListener("card-payment-approved", window.completeCardPayment);
        })();
    </script>
</body>
</html>
