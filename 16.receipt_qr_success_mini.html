<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt QR Mini</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #F3F4F6;
            --surface: #FFFFFF;
            --text-dark: #172033;
            --text-muted: #6B7280;
            --line-soft: rgba(23, 32, 51, 0.08);
            --accent: #00A86B;
            --shadow-lg: 0 18px 40px rgba(15, 23, 42, 0.16);
            --shadow-md: 0 10px 20px rgba(15, 23, 42, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1B1B1B;
        }

        .mini-frame {
            width: 480px;
            height: 480px;
            position: relative;
            overflow: hidden;
            border-radius: 24px;
            background: linear-gradient(180deg, #F7F8FB 0%, #F1F5FA 100%);
            box-shadow: 0 0 0 10px #101010, var(--shadow-lg);
        }

        .mini-frame::before {
            content: "";
            position: absolute;
            width: 220px;
            height: 220px;
            top: -120px;
            right: -110px;
            border-radius: 999px;
            pointer-events: none;
            background: radial-gradient(circle at 30% 30%, rgba(0, 168, 107, 0.1), transparent 70%);
        }

        .mini-content {
            position: relative;
            z-index: 1;
            height: 100%;
            padding: 14px 16px 16px;
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 12px;
        }

        .status-bar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: var(--text-muted);
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
            justify-self: end;
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        .pull-tab {
            width: 34px;
            height: 16px;
            border: none;
            background: transparent;
            display: grid;
            place-items: center;
            justify-self: center;
        }

        .pull-tab svg {
            width: 22px;
            height: 12px;
            stroke: var(--text-dark);
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.65;
        }

        .battery {
            width: 22px;
            height: 10px;
            border-radius: 3px;
            border: 1.5px solid #9CA3AF;
            position: relative;
        }

        .battery::after {
            content: "";
            position: absolute;
            right: -3px;
            top: 2px;
            width: 2px;
            height: 6px;
            border-radius: 1px;
            background: #9CA3AF;
        }

        .battery-level {
            height: 100%;
            width: 74%;
            border-radius: 2px;
            background: #111827;
        }

        .main-panel {
            min-height: 0;
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: 10px;
            padding: 6px 6px 2px;
        }

        .top-row {
            display: flex;
            justify-content: center;
            min-width: 0;
        }

        .receipt-title {
            min-width: 0;
            font-size: 26px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--text-dark);
            text-transform: uppercase;
            white-space: nowrap;
            text-align: center;
        }

        .amount-row {
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 0;
        }

        .amount-card {
            width: min(100%, 216px);
            min-width: 0;
            text-align: center;
            overflow: hidden;
        }

        .amount-value {
            width: 100%;
            font-size: 24px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.05em;
            color: var(--text-dark);
            white-space: nowrap;
            text-align: center;
        }

        .qr-stage {
            min-height: 0;
            display: grid;
            place-items: center;
            padding: 0;
        }

        .qr-shell {
            width: min(100%, 332px);
            aspect-ratio: 1 / 1;
            border-radius: 28px;
            background: #FFFFFF;
            border: 1px solid var(--line-soft);
            box-shadow: var(--shadow-md);
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .qr-shell img,
        .qr-shell svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <div class="mini-frame">
        <div class="mini-content">
            <div class="status-bar">
                <span id="time-display">10:50</span>
                <button class="pull-tab" type="button" aria-label="Status">
                    <svg viewBox="0 0 24 12" aria-hidden="true">
                        <path d="M5 4.5L12 9l7-4.5"></path>
                    </svg>
                </button>
                <div class="status-right">
                    <span>4G</span>
                    <div class="battery" aria-hidden="true">
                        <div class="battery-level"></div>
                    </div>
                </div>
            </div>

            <main class="main-panel">
                <div class="top-row">
                    <h1 class="receipt-title">Scan for e-receipt</h1>
                </div>

                <div class="amount-row">
                    <div class="amount-card" aria-label="Transaction amount">
                        <span class="amount-value" id="amount-display">$0.00</span>
                    </div>
                </div>

                <section class="qr-stage" aria-label="Receipt QR code">
                    <div class="qr-shell">
                        <svg id="qr-placeholder" viewBox="0 0 168 168" aria-label="QR code" role="img">
                            <rect width="168" height="168" rx="16" fill="#ffffff"></rect>
                            <rect x="12" y="12" width="42" height="42" rx="4" fill="#111827"></rect>
                            <rect x="20" y="20" width="26" height="26" rx="2" fill="#ffffff"></rect>
                            <rect x="26" y="26" width="14" height="14" rx="1.5" fill="#111827"></rect>
                            <rect x="114" y="12" width="42" height="42" rx="4" fill="#111827"></rect>
                            <rect x="122" y="20" width="26" height="26" rx="2" fill="#ffffff"></rect>
                            <rect x="128" y="26" width="14" height="14" rx="1.5" fill="#111827"></rect>
                            <rect x="12" y="114" width="42" height="42" rx="4" fill="#111827"></rect>
                            <rect x="20" y="122" width="26" height="26" rx="2" fill="#ffffff"></rect>
                            <rect x="26" y="128" width="14" height="14" rx="1.5" fill="#111827"></rect>
                            <rect x="72" y="14" width="10" height="10" fill="#111827"></rect>
                            <rect x="86" y="14" width="10" height="10" fill="#111827"></rect>
                            <rect x="72" y="28" width="24" height="10" fill="#111827"></rect>
                            <rect x="62" y="42" width="10" height="10" fill="#111827"></rect>
                            <rect x="76" y="42" width="10" height="10" fill="#111827"></rect>
                            <rect x="90" y="42" width="10" height="10" fill="#111827"></rect>
                            <rect x="104" y="42" width="10" height="10" fill="#111827"></rect>
                            <rect x="62" y="56" width="10" height="10" fill="#111827"></rect>
                            <rect x="90" y="56" width="24" height="10" fill="#111827"></rect>
                            <rect x="118" y="56" width="10" height="10" fill="#111827"></rect>
                            <rect x="56" y="70" width="10" height="10" fill="#111827"></rect>
                            <rect x="70" y="70" width="10" height="10" fill="#111827"></rect>
                            <rect x="84" y="70" width="10" height="10" fill="#111827"></rect>
                            <rect x="112" y="70" width="10" height="10" fill="#111827"></rect>
                            <rect x="126" y="70" width="10" height="10" fill="#111827"></rect>
                            <rect x="140" y="70" width="10" height="10" fill="#111827"></rect>
                            <rect x="56" y="84" width="24" height="10" fill="#111827"></rect>
                            <rect x="84" y="84" width="10" height="10" fill="#111827"></rect>
                            <rect x="98" y="84" width="24" height="10" fill="#111827"></rect>
                            <rect x="56" y="98" width="10" height="10" fill="#111827"></rect>
                            <rect x="84" y="98" width="24" height="10" fill="#111827"></rect>
                            <rect x="112" y="98" width="10" height="10" fill="#111827"></rect>
                            <rect x="126" y="98" width="10" height="10" fill="#111827"></rect>
                            <rect x="56" y="112" width="10" height="10" fill="#111827"></rect>
                            <rect x="70" y="112" width="24" height="10" fill="#111827"></rect>
                            <rect x="98" y="112" width="10" height="10" fill="#111827"></rect>
                            <rect x="112" y="112" width="24" height="10" fill="#111827"></rect>
                            <rect x="56" y="126" width="24" height="10" fill="#111827"></rect>
                            <rect x="84" y="126" width="10" height="10" fill="#111827"></rect>
                            <rect x="98" y="126" width="10" height="10" fill="#111827"></rect>
                            <rect x="126" y="126" width="24" height="10" fill="#111827"></rect>
                            <rect x="70" y="140" width="10" height="10" fill="#111827"></rect>
                            <rect x="84" y="140" width="24" height="10" fill="#111827"></rect>
                            <rect x="112" y="140" width="10" height="10" fill="#111827"></rect>
                            <rect x="140" y="140" width="10" height="10" fill="#111827"></rect>
                        </svg>
                        <img id="qr-image" alt="" hidden>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script>
        (function () {
            var timeDisplay = document.getElementById("time-display");
            var amountDisplay = document.getElementById("amount-display");
            var qrImage = document.getElementById("qr-image");
            var qrPlaceholder = document.getElementById("qr-placeholder");
            var params = new URLSearchParams(window.location.search);
            var maxAmountFontSize = 24;
            var minAmountFontSize = 16;

            function two(n) {
                return String(n).padStart(2, "0");
            }

            function updateClock() {
                var now = new Date();
                timeDisplay.textContent = two(now.getHours()) + ":" + two(now.getMinutes());
            }

            function parseMoneyToCents(value) {
                if (value === null || value === undefined || value === "") {
                    return null;
                }

                var n = Number(value);
                if (!Number.isFinite(n) || n < 0) {
                    return null;
                }

                return Math.round(n * 100);
            }

            function resolveAmountCents() {
                var amountCents = Number(params.get("amountCents"));
                if (Number.isFinite(amountCents) && amountCents >= 0) {
                    return Math.round(amountCents);
                }

                var amount = parseMoneyToCents(params.get("amount"));
                if (amount !== null) {
                    return amount;
                }

                if (Number.isFinite(window.transactionAmountCents) && window.transactionAmountCents >= 0) {
                    return Math.round(window.transactionAmountCents);
                }

                var globalAmount = parseMoneyToCents(window.transactionAmount);
                if (globalAmount !== null) {
                    return globalAmount;
                }

                return 0;
            }

            function resolveCurrencySymbol(currency) {
                var value = String(currency || "").trim();
                var code = value.toUpperCase();
                var symbols = {
                    USD: "$",
                    EUR: "€",
                    GBP: "£",
                    CNY: "¥",
                    JPY: "¥",
                    KRW: "₩",
                    INR: "₹",
                    RUB: "₽",
                    THB: "฿",
                    VND: "₫",
                    PHP: "₱",
                    MYR: "RM",
                    SGD: "S$",
                    HKD: "HK$",
                    TWD: "NT$",
                    AUD: "A$",
                    CAD: "C$",
                    NZD: "NZ$",
                    CHF: "CHF ",
                    AED: "AED ",
                    SAR: "SAR ",
                    IDR: "Rp"
                };

                if (symbols[code]) {
                    return symbols[code];
                }

                if (value && value.length <= 4 && /[^A-Za-z]/.test(value)) {
                    return value;
                }

                return value ? value + " " : "";
            }

            function formatAmount(cents, currency) {
                return resolveCurrencySymbol(currency) + (Math.max(0, cents) / 100).toLocaleString("en-US", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            }

            function fitAmountText() {
                var fontSize = maxAmountFontSize;
                amountDisplay.style.fontSize = fontSize + "px";

                while (fontSize > minAmountFontSize && amountDisplay.scrollWidth > amountDisplay.clientWidth) {
                    fontSize -= 1;
                    amountDisplay.style.fontSize = fontSize + "px";
                }
            }

            var currency = params.get("currency") || "USD";
            var amountCents = resolveAmountCents();
            var qrSrc = params.get("qrSrc");

            amountDisplay.textContent = formatAmount(amountCents, currency);
            fitAmountText();

            qrImage.addEventListener("error", function () {
                qrImage.hidden = true;
                qrImage.removeAttribute("src");
                qrPlaceholder.hidden = false;
            });

            if (qrSrc) {
                qrImage.src = qrSrc;
                qrImage.hidden = false;
                qrPlaceholder.hidden = true;
            }

            updateClock();
            window.addEventListener("resize", fitAmountText);
            setInterval(updateClock, 60000);
        })();
    </script>
</body>
</html>
