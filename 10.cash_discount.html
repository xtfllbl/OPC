<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Discount - Payment Choice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,600,0,0" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text-main: #0a2459;
            --text-sub: #4c6079;
            --primary: #0A5BFF;
            --primary-light: #EFF6FF;
            --cash-border: #9bdab4;
            --cash-bg: #eaf8ef;
            --cash-strong: #166637;
            --card-border: var(--primary);
            --card-bg: var(--primary-light);
            --card-strong: var(--primary);
            --neutral-border: #d3dce8;
            --neutral-bg: #ffffff;
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .material-symbols-rounded {
            font-family: "Material Symbols Rounded";
            font-weight: 600;
            font-style: normal;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: "liga";
            -webkit-font-smoothing: antialiased;
            font-feature-settings: "liga";
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
            color: var(--text-main);
            overflow: hidden;
        }

        .viewport {
            width: 375px;
            height: 812px;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 0 0 12px #1a1a1a, 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .canvas {
            width: 100%;
            height: 100%;
            overflow: hidden;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .canvas::-webkit-scrollbar {
            display: none;
        }

        .panel {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--bg);
            padding: 22px 18px 18px;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 48px;
        }

        .icon-btn {
            position: absolute;
            left: 0;
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #FFFFFF;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            color: #111827;
            cursor: pointer;
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2.2;
        }

        .merchant-name {
            color: #111827;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .title {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 12px;
            color: #667085;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1;
            margin: 0 0 16px;
            text-align: center;
            white-space: nowrap;
        }

        .title::before,
        .title::after {
            flex: 1;
            height: 1px;
            background: #D8E0EB;
            content: "";
        }

        .option-card {
            width: 100%;
            border-radius: var(--radius);
            border: 1.5px solid var(--neutral-border);
            background: var(--neutral-bg);
            padding: 24px 22px 22px;
            height: 196px;
            min-height: 196px;
            display: flex;
            flex-direction: column;
            text-align: left;
            position: relative;
            cursor: pointer;
            transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
            margin-bottom: 0;
        }

        .cards-block {
            display: flex;
            flex: 1;
            flex-direction: column;
            justify-content: center;
            gap: 0;
            min-height: 0;
            margin-top: 0;
            padding-bottom: 64px;
        }

        .cash-card {
            margin-bottom: 28px;
        }

        .option-card:active {
            transform: translateY(2px) scale(0.975);
            filter: brightness(0.97);
        }

        .option-card.is-activating {
            transform: translateY(2px) scale(0.975);
            filter: brightness(0.96);
            pointer-events: none;
        }

        .cash-card {
            border-color: var(--cash-border);
            background: var(--cash-bg);
            box-shadow: 0 10px 26px rgba(22, 102, 55, 0.13);
        }

        .card-card {
            border-color: var(--card-border);
            background: var(--card-bg);
            box-shadow: 0 10px 26px rgba(10, 91, 255, 0.13);
        }

        .option-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            padding-right: 0;
        }

        .option-identity {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .payment-icon {
            display: grid;
            place-items: center;
            width: 56px;
            height: 56px;
            border: 1px solid;
            border-radius: 18px;
        }

        .payment-icon .material-symbols-rounded {
            font-size: 31px;
        }

        .cash-icon {
            color: #177245;
            background: #E8F7EE;
            border-color: #C7EAD5;
        }

        .card-icon {
            color: var(--primary);
            background: var(--primary-light);
            border-color: #DCE6FF;
        }

        .option-name {
            font-size: 30px;
            font-weight: 800;
        }

        .amount {
            font-size: 54px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 4px;
            color: #1d3557;
        }

        .cash-card .amount {
            color: var(--cash-strong);
        }

        .card-card .amount {
            color: var(--card-strong);
        }

    </style>
</head>

<body>
    <div class="viewport">
        <div class="canvas">
            <main class="panel">
                <div class="top-bar">
                    <button class="icon-btn" type="button" onclick="handleBack()" aria-label="Back">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
                    </button>
                    <div class="merchant-name">UNIQLO</div>
                </div>
                <div class="cards-block">
                    <h1 class="title">SELECT PAYMENT METHOD</h1>
                    <button class="option-card cash-card" id="cash-card" type="button" onclick="choosePayment('cash', this)" aria-label="Pay cash">
                        <div class="option-head">
                            <div class="option-identity">
                                <span class="payment-icon cash-icon" aria-hidden="true">
                                    <span class="material-symbols-rounded">payments</span>
                                </span>
                                <div class="option-name">Cash</div>
                            </div>
                        </div>
                        <div class="amount" id="cash-amount">$100.00</div>
                    </button>

                    <button class="option-card card-card" id="card-card" type="button" onclick="choosePayment('card', this)" aria-label="Pay by card">
                        <div class="option-head">
                            <div class="option-identity">
                                <span class="payment-icon card-icon" aria-hidden="true">
                                    <span class="material-symbols-rounded">credit_card</span>
                                </span>
                                <div class="option-name">Card</div>
                            </div>
                        </div>
                        <div class="amount" id="card-amount">$104.00</div>
                    </button>
                </div>

            </main>
        </div>
    </div>

    <script>
        const DISCOUNT_RATE = 0.04;
        const cashCard = document.getElementById("cash-card");
        const cardCard = document.getElementById("card-card");
        const cashAmountEl = document.getElementById("cash-amount");
        const cardAmountEl = document.getElementById("card-amount");
        let cashAmountCents = resolveIncomingCashAmount();
        let paymentNavigationPending = false;

        function formatMoney(cents) {
            return (Math.max(0, cents) / 100).toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function parseMoneyToCents(value) {
            if (value === null || value === undefined || value === "") {
                return null;
            }
            const n = Number(value);
            if (!Number.isFinite(n) || n < 0) {
                return null;
            }
            return Math.round(n * 100);
        }

        function resolveIncomingCashAmount() {
            const params = new URLSearchParams(window.location.search);
            const queryCashCents = Number(params.get("cashAmountCents"));
            if (Number.isFinite(queryCashCents) && queryCashCents > 0) {
                return Math.round(queryCashCents);
            }

            const queryCents = Number(params.get("amountCents"));
            if (Number.isFinite(queryCents) && queryCents > 0) {
                return Math.round(queryCents);
            }

            const queryAmount = parseMoneyToCents(params.get("amount"));
            if (queryAmount !== null && queryAmount > 0) {
                return queryAmount;
            }

            if (Number.isFinite(window.cashTransactionAmountCents) && window.cashTransactionAmountCents > 0) {
                return Math.round(window.cashTransactionAmountCents);
            }

            if (Number.isFinite(window.transactionAmountCents) && window.transactionAmountCents > 0) {
                return Math.round(window.transactionAmountCents);
            }

            const globalCashAmount = parseMoneyToCents(window.cashTransactionAmount);
            if (globalCashAmount !== null && globalCashAmount > 0) {
                return globalCashAmount;
            }

            const globalAmount = parseMoneyToCents(window.transactionAmount);
            if (globalAmount !== null && globalAmount > 0) {
                return globalAmount;
            }

            return 10000;
        }

        function getCardAmountCents() {
            return Math.round(cashAmountCents * (1 + DISCOUNT_RATE));
        }

        function equalizeCardHeights() {
            cashCard.style.height = "auto";
            cardCard.style.height = "auto";
            const maxHeight = Math.max(cashCard.offsetHeight, cardCard.offsetHeight);
            cashCard.style.height = maxHeight + "px";
            cardCard.style.height = maxHeight + "px";
        }

        function syncView() {
            const cardAmountCents = getCardAmountCents();

            cardAmountEl.textContent = "$" + formatMoney(cardAmountCents);
            cashAmountEl.textContent = "$" + formatMoney(cashAmountCents);
            equalizeCardHeights();
        }

        function handleBack() {
            if (typeof window.onCashDiscountBack === "function") {
                window.onCashDiscountBack();
                return;
            }
            if (window.history.length > 1) {
                window.history.back();
            }
        }

        function proceedToPayment(method) {
            const selectedMethod = method === "cash" ? "cash" : "card";
            const cardAmountCents = getCardAmountCents();
            const payload = {
                method: selectedMethod,
                pricingBasis: "cash_price",
                cardAmountCents: cardAmountCents,
                cashAmountCents: cashAmountCents,
                priceDifferenceCents: cardAmountCents - cashAmountCents,
                cardRate: DISCOUNT_RATE,
                finalAmountCents: selectedMethod === "cash" ? cashAmountCents : cardAmountCents
            };

            localStorage.setItem("paymentMethod", selectedMethod);
            localStorage.setItem("finalAmountCents", String(payload.finalAmountCents));

            window.dispatchEvent(new CustomEvent("cash-discount-continue", { detail: payload }));

            if (selectedMethod === "cash") {
                window.location.href = "11.cash_change.html?dueCents=" + cashAmountCents;
                return;
            }

            if (typeof window.onCashDiscountContinue === "function") {
                window.onCashDiscountContinue(payload);
                return;
            }

            const cardParams = new URLSearchParams({
                amount: (cardAmountCents / 100).toFixed(2),
                amountCents: String(cardAmountCents),
                currency: "USD"
            });
            window.location.href = "18.tapcard.html?" + cardParams.toString();
        }

        function choosePayment(method, cardElement) {
            if (paymentNavigationPending) return;
            paymentNavigationPending = true;
            cardElement.classList.add("is-activating");
            window.setTimeout(() => proceedToPayment(method), 160);
        }

        window.setTransactionAmountCents = function (cents) {
            if (!Number.isFinite(cents) || cents <= 0) {
                return;
            }
            cashAmountCents = Math.round(cents);
            syncView();
        };

        window.setTransactionAmount = function (amount) {
            const cents = parseMoneyToCents(amount);
            if (cents === null || cents <= 0) {
                return;
            }
            cashAmountCents = cents;
            syncView();
        };

        window.setCashAmountCents = window.setTransactionAmountCents;
        window.setCashAmount = window.setTransactionAmount;

        syncView();
        window.addEventListener("resize", equalizeCardHeights);
    </script>
</body>

</html>
