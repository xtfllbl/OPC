<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Discount - Payment Choice</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text-main: #0a2459;
            --text-sub: #4c6079;
            --cash-border: #9bdab4;
            --cash-bg: #eaf8ef;
            --cash-strong: #166637;
            --card-border: #2e5fe7;
            --card-bg: #edf3ff;
            --card-strong: #2645a0;
            --neutral-border: #d3dce8;
            --neutral-bg: #ffffff;
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
            color: var(--text-main);
            overflow: hidden;
        }

        .viewport {
            width: 375px;
            height: 812px;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 0 0 12px #1a1a1a, 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .canvas {
            width: 100%;
            height: 100%;
            overflow: hidden;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .canvas::-webkit-scrollbar {
            display: none;
        }

        .panel {
            width: 100%;
            height: 100%;
            background: var(--bg);
            padding: 28px 18px 18px;
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.05;
            margin-bottom: 28px;
            color: #001845;
        }

        .option-card {
            width: 100%;
            border-radius: var(--radius);
            border: 1.5px solid var(--neutral-border);
            background: var(--neutral-bg);
            padding: 20px 18px 18px;
            display: flex;
            flex-direction: column;
            text-align: left;
            position: relative;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            margin-bottom: 0;
        }

        .cards-block {
            margin-top: 6px;
        }

        .cash-card {
            margin-bottom: 16px;
        }

        .option-card:active {
            transform: scale(0.99);
        }

        .cash-card.selected {
            border-color: var(--cash-border);
            background: var(--cash-bg);
            box-shadow: 0 8px 22px rgba(22, 102, 55, 0.12);
        }

        .card-card.selected {
            border-color: var(--card-border);
            background: var(--card-bg);
            box-shadow: 0 8px 22px rgba(38, 69, 160, 0.12);
        }

        .option-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-right: 0;
        }

        .option-name {
            font-size: 23px;
            font-weight: 700;
        }

        .amount {
            font-size: 47px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.03em;
            margin-bottom: 4px;
            color: #1d3557;
        }

        .cash-card.selected .amount {
            color: var(--cash-strong);
        }

        .card-card.selected .amount {
            color: var(--card-strong);
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: auto;
            padding-top: 16px;
        }

        .btn {
            height: 48px;
            border-radius: 16px;
            border: 1.5px solid #bcc5d3;
            background: #f3f4f6;
            color: #233e63;
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
        }

        .btn-back {
            width: 112px;
        }

        .btn-primary {
            flex: 1;
            border: none;
            color: #fff;
        }

        .btn-primary.is-card {
            background: linear-gradient(135deg, #2b67f3 0%, #1b4fd5 100%);
        }

        .btn-primary.is-cash {
            background: linear-gradient(135deg, #21a85c 0%, #16763f 100%);
        }

    </style>
</head>

<body>
    <div class="viewport">
        <div class="canvas">
            <main class="panel">
                <h1 class="title">How will customer pay?</h1>

                <div class="cards-block">
                    <button class="option-card cash-card" id="cash-card" type="button" onclick="selectMethod('cash')">
                        <div class="option-head">
                            <div class="option-name">Cash</div>
                        </div>
                        <div class="amount" id="cash-amount">$96.00</div>
                    </button>

                    <button class="option-card card-card selected" id="card-card" type="button" onclick="selectMethod('card')">
                        <div class="option-head">
                            <div class="option-name">Card</div>
                        </div>
                        <div class="amount" id="card-amount">$100.00</div>
                    </button>
                </div>

                <div class="action-row">
                    <button class="btn btn-back" type="button" onclick="handleBack()">Back</button>
                    <button class="btn btn-primary is-card" id="continue-btn" type="button" onclick="handleContinue()">Card Payment</button>
                </div>
            </main>
        </div>
    </div>

    <script>
        const DISCOUNT_RATE = 0.04;
        const cashCard = document.getElementById("cash-card");
        const cardCard = document.getElementById("card-card");
        const cashAmountEl = document.getElementById("cash-amount");
        const cardAmountEl = document.getElementById("card-amount");
        const continueBtn = document.getElementById("continue-btn");

        let selectedMethod = "card";
        let cardAmountCents = resolveIncomingAmount();

        function formatMoney(cents) {
            return (Math.max(0, cents) / 100).toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function parseMoneyToCents(value) {
            if (value === null || value === undefined || value === "") {
                return null;
            }
            const n = Number(value);
            if (!Number.isFinite(n) || n < 0) {
                return null;
            }
            return Math.round(n * 100);
        }

        function resolveIncomingAmount() {
            const params = new URLSearchParams(window.location.search);
            const queryCents = Number(params.get("amountCents"));
            if (Number.isFinite(queryCents) && queryCents > 0) {
                return Math.round(queryCents);
            }

            const queryAmount = parseMoneyToCents(params.get("amount"));
            if (queryAmount !== null && queryAmount > 0) {
                return queryAmount;
            }

            if (Number.isFinite(window.transactionAmountCents) && window.transactionAmountCents > 0) {
                return Math.round(window.transactionAmountCents);
            }

            const globalAmount = parseMoneyToCents(window.transactionAmount);
            if (globalAmount !== null && globalAmount > 0) {
                return globalAmount;
            }

            return 10000;
        }

        function getCashAmountCents() {
            return Math.round(cardAmountCents * (1 - DISCOUNT_RATE));
        }

        function equalizeCardHeights() {
            cashCard.style.height = "auto";
            cardCard.style.height = "auto";
            const maxHeight = Math.max(cashCard.offsetHeight, cardCard.offsetHeight);
            cashCard.style.height = maxHeight + "px";
            cardCard.style.height = maxHeight + "px";
        }

        function syncView() {
            const cashAmountCents = getCashAmountCents();
            const isCash = selectedMethod === "cash";

            cardAmountEl.textContent = "$" + formatMoney(cardAmountCents);
            cashAmountEl.textContent = "$" + formatMoney(cashAmountCents);

            cashCard.classList.toggle("selected", isCash);
            cardCard.classList.toggle("selected", !isCash);

            continueBtn.textContent = isCash ? "Cash Payment" : "Card Payment";
            continueBtn.classList.toggle("is-cash", isCash);
            continueBtn.classList.toggle("is-card", !isCash);
            equalizeCardHeights();
        }

        function selectMethod(method) {
            selectedMethod = method === "cash" ? "cash" : "card";
            syncView();
        }

        function handleBack() {
            if (typeof window.onCashDiscountBack === "function") {
                window.onCashDiscountBack();
                return;
            }
            if (window.history.length > 1) {
                window.history.back();
            }
        }

        function handleContinue() {
            const cashAmountCents = getCashAmountCents();
            const payload = {
                method: selectedMethod,
                cardAmountCents: cardAmountCents,
                cashAmountCents: cashAmountCents,
                savingsCents: cardAmountCents - cashAmountCents,
                finalAmountCents: selectedMethod === "cash" ? cashAmountCents : cardAmountCents
            };

            if (typeof window.onCashDiscountContinue === "function") {
                window.onCashDiscountContinue(payload);
                return;
            }

            if (selectedMethod === "cash") {
                window.location.href = "11.cash_change.html?dueCents=" + cashAmountCents;
                return;
            }

            window.dispatchEvent(new CustomEvent("cash-discount-continue", { detail: payload }));
        }

        window.setTransactionAmountCents = function (cents) {
            if (!Number.isFinite(cents) || cents <= 0) {
                return;
            }
            cardAmountCents = Math.round(cents);
            syncView();
        };

        window.setTransactionAmount = function (amount) {
            const cents = parseMoneyToCents(amount);
            if (cents === null || cents <= 0) {
                return;
            }
            cardAmountCents = cents;
            syncView();
        };

        syncView();
        window.addEventListener("resize", equalizeCardHeights);
    </script>
</body>

</html>
