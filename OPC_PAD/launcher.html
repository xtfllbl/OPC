<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OPC PAD · Cash register</title><link rel="icon" href="assets/merchant-default.svg"><link rel="stylesheet" href="css/app.css"><script defer src="js/model.js"></script><script defer src="js/store.js"></script><script defer src="js/launcher.js"></script></head>
<body class="launcher-page"><main class="launcher"><h1>OPC PAD</h1><div class="launcher-columns"><section class="setup-panel"><h2 class="section-title">CASH REGISTER</h2><p class="status" id="current-status"></p><label>Sample order<select id="sample-order"><option value="regular">6 products</option><option value="long">18 products</option><option value="single">1 product</option></select></label><button class="btn primary full" id="send-order">Send transaction</button><a class="btn full" id="open-display" href="index.html" target="opc-pad-customer">Open customer display</a><p class="launcher-note" id="display-status" role="status"></p><div class="launcher-actions"><button class="btn" id="confirm-cash">Confirm cash received</button><button class="btn danger" id="cancel-order">Cancel transaction</button></div><p class="launcher-note">Browser prototype. No real payment is made.</p></section><section class="setup-panel"><h2 class="section-title">SETTINGS</h2><label>Device resolution<select id="device-size"><option value="1600x720">1600 × 720</option><option value="1920x1200">1920 × 1200</option></select></label><label>Payment position<select id="layout"><option value="left">Left</option><option value="right">Right</option></select></label><label class="toggle-row">Dual Pricing · 4%<input type="checkbox" id="dual" checked></label><label class="toggle-row">Tip selection<input type="checkbox" id="tips" checked></label><label class="toggle-row">Credit signature<input type="checkbox" id="signature" checked></label><label>Simulated response<select id="response"><option value="success">Approved</option><option value="failed">Declined</option></select></label><button class="btn primary full" id="save-settings">Save settings</button><p class="launcher-note" id="settings-status" role="status"></p></section></div></main></body></html>
