<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 MINI Fixed Price Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #efc49f;
            --text: #101010;
            --shadow: 0 0 0 10px #101010, 0 22px 48px rgba(0, 0, 0, 0.22);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #171717;
            padding: 24px;
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: none;
        }

        .mini-frame {
            width: 480px;
            height: 480px;
            overflow: hidden;
            position: relative;
            border-radius: 24px;
            background: linear-gradient(180deg, #f4d2b3 0%, #e8ba90 100%);
            box-shadow: var(--shadow);
        }

        .screen {
            width: 100%;
            height: 100%;
            padding: 22px;
            display: flex;
            flex-direction: column;
        }

        .serial {
            font-size: 12px;
            line-height: 1;
            color: var(--text);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 22px;
            cursor: pointer;
        }

        .amount {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 8px;
            color: var(--text);
        }

        .currency {
            font-size: 62px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-top: 7px;
        }

        .amount-value {
            font-size: 82px;
            line-height: 0.92;
            font-weight: 800;
            letter-spacing: -0.08em;
        }

        .prompt {
            font-size: 34px;
            line-height: 1.12;
            font-weight: 800;
            letter-spacing: -0.05em;
            color: var(--text);
        }

    </style>
</head>
<body>
    <div class="mini-frame">
        <div class="screen">
            <div class="serial" id="serial-display">WP5280VQ33200002</div>

            <button class="main" id="start-trigger" type="button" aria-label="Start transaction">
                <div class="amount" aria-label="Amount">
                    <span class="currency" id="currency-display">$</span>
                    <span class="amount-value" id="amount-display">0.00</span>
                </div>
                <div class="prompt">Touch to Start</div>
            </button>
        </div>
    </div>

    <script>
        (function () {
            const DEFAULT_AMOUNT = 5;
            const DEFAULT_CURRENCY = "USD";
            const DEFAULT_SERIAL = "WP5280VQ33200002";

            function resolveAmount() {
                const rawAmount = Number(new URLSearchParams(window.location.search).get("amount"));
                return Number.isFinite(rawAmount) && rawAmount >= 0 ? rawAmount : DEFAULT_AMOUNT;
            }

            function resolveCurrency() {
                return new URLSearchParams(window.location.search).get("currency") || DEFAULT_CURRENCY;
            }

            function resolveSerial() {
                return new URLSearchParams(window.location.search).get("serial") || DEFAULT_SERIAL;
            }

            function formatAmountParts(amount, currency) {
                const parts = new Intl.NumberFormat("en-US", {
                    style: "currency",
                    currency: currency,
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).formatToParts(amount);

                const currencySymbol = parts
                    .filter(function (part) { return part.type === "currency"; })
                    .map(function (part) { return part.value; })
                    .join("") || "$";

                const amountValue = parts
                    .filter(function (part) {
                        return part.type !== "currency" && part.type !== "literal";
                    })
                    .map(function (part) { return part.value; })
                    .join("");

                return {
                    currencySymbol: currencySymbol,
                    amountValue: amountValue
                };
            }

            const amount = resolveAmount();
            const currency = resolveCurrency();
            const serial = resolveSerial();
            const formattedAmount = formatAmountParts(amount, currency);
            document.getElementById("currency-display").textContent = formattedAmount.currencySymbol;
            document.getElementById("amount-display").textContent = formattedAmount.amountValue;
            document.getElementById("serial-display").textContent = serial;

            document.getElementById("start-trigger").addEventListener("click", function () {
                const nextParams = new URLSearchParams(window.location.search);
                nextParams.set("amount", amount.toFixed(2));
                nextParams.set("currency", currency);
                nextParams.set("serial", serial);
                window.location.href = "18.tapcard.html?" + nextParams.toString();
            });
        })();
    </script>
</body>
</html>
