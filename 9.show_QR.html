<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show QR</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap");

        :root {
            --bg-main: #ffffff;
            --bg-soft: #f6f7f9;
            --text-main: #0b0f16;
            --text-sub: #5f6670;
            --border-soft: rgba(15, 23, 42, 0.12);
            --shadow-soft: 0 14px 32px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "DM Sans", "Space Grotesk", sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(120% 90% at 50% 0%, #ffffff 0%, #eef1f5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .device-container {
            width: 480px;
            height: 100vh;
            max-height: 800px;
            background: linear-gradient(180deg, #ffffff 0%, #f8f9fb 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 24px 48px rgba(15, 23, 42, 0.18);
        }

        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
            border-bottom: 1px solid rgba(15, 23, 42, 0.08);
            height: 60px;
        }

        .device-id {
            font-weight: 600;
            letter-spacing: 0.6px;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 26px 24px 32px;
            gap: 32px;
        }

        .amount-block {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .amount-label {
            font-size: 16px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-sub);
            font-weight: 600;
        }

        .amount-value {
            font-family: "Space Grotesk", "DM Sans", sans-serif;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .amount-note {
            font-size: 14px;
            color: var(--text-sub);
        }

        .qr-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .qr-frame {
            width: min(280px, 70vw);
            aspect-ratio: 1 / 1;
            background: var(--bg-main);
            border-radius: 22px;
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .qr-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .qr-hint {
            font-size: 15px;
            color: var(--text-sub);
        }

        @media screen and (max-height: 580px) {
            .header { padding: 10px 16px; height: 52px; }
            .content { padding: 18px 16px 22px; gap: 22px; }
            .amount-value { font-size: 34px; }
            .qr-frame { width: min(220px, 64vw); padding: 14px; }
        }
    </style>
</head>
<body>
    <div class="device-container">
        <div class="header">
            <span class="device-id">WP5120Q3000001</span>
            <span id="clock">10:24</span>
        </div>

        <div class="content">
            <div class="amount-block">
                <div class="amount-label">Amount</div>
                <div class="amount-value">RM 128.00</div>
                <div class="amount-note">Scan to pay</div>
            </div>

            <div class="qr-block">
                <div class="qr-frame">
                    <img src="qr.svg" alt="QR code">
                </div>
                <div class="qr-hint">Use your banking app or e-wallet</div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var clock = document.getElementById("clock");
            if (clock) {
                var now = new Date();
                var hours = String(now.getHours()).padStart(2, "0");
                var minutes = String(now.getMinutes()).padStart(2, "0");
                clock.textContent = hours + ":" + minutes;
            }
        })();
    </script>
</body>
</html>
