<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Customer Info</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --primary-gradient: linear-gradient(135deg, #007AFF 0%, #0056b3 100%);
            --bg-color: #121212;
            --text-main: #FFFFFF;
            --text-sub: #A0A0A0;
            --input-bg: rgba(8, 8, 8, 0.7);
            --input-border: rgba(255, 255, 255, 0.18);
            --input-border-focus: rgba(0, 122, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .device-container {
            width: 480px;
            height: 100vh;
            max-height: 800px;
            background: radial-gradient(140% 120% at 50% 0%, #1a1a1a 0%, #121212 45%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.55);
        }

        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            height: 60px;
            z-index: 2;
        }

        .device-id {
            font-weight: 600;
            letter-spacing: 0.6px;
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 20px;
            position: relative;
            z-index: 1;
        }

        .single-layout {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex-direction: column;
            max-width: 380px;
            margin: 0 auto;
            text-align: center;
        }

        .single-layout.is-hidden {
            display: none;
        }

        .vertical-label {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--text-main);
        }

        .single-input {
            width: 100%;
            max-width: 380px;
            height: 60px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .single-input:focus-within {
            border-color: var(--input-border-focus);
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.15);
        }

        .single-input.phone-format input {
            letter-spacing: 0.12em;
        }

        .multi-layout {
            display: none;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .multi-layout.is-active {
            display: flex;
        }

        .multi-title {
            font-size: 24px;
            font-weight: 700;
        }

        .field-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .field-row {
            display: grid;
            grid-template-columns: 110px 1fr;
            align-items: center;
            gap: 12px;
        }

        .field-row.is-hidden {
            display: none;
        }

        .field-label {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-sub);
        }

        .field-input,
        .field-inputs {
            width: 100%;
        }

        .field-input {
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 14px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .field-input:focus-within {
            border-color: var(--input-border-focus);
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.12);
        }

        .field-inputs {
            display: grid;
            grid-template-columns: 0.9fr 1.3fr;
            gap: 10px;
        }

        .select-wrap {
            position: relative;
        }

        .select-wrap::after {
            content: "";
            position: absolute;
            top: 50%;
            right: 12px;
            width: 10px;
            height: 10px;
            border-right: 2px solid rgba(255, 255, 255, 0.5);
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            transform: translateY(-50%) rotate(45deg);
            pointer-events: none;
        }

        input,
        select {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            outline: none;
            user-select: text;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        select {
            appearance: none;
        }

        .footer {
            padding: 16px 24px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
        }

        .footer.is-hidden {
            display: none;
        }

        .primary-btn {
            width: 100%;
            max-width: 380px;
            height: 56px;
            border: none;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #02192d;
            background: var(--primary-gradient);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 24px rgba(0, 122, 255, 0.3);
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        @media screen and (max-height: 580px) {
            .header { padding: 10px 16px; height: 52px; }
            .content { padding: 12px 14px; }
            .vertical-label { font-size: 20px; }
            .single-layout { max-width: 320px; }
            .single-input { height: 50px; }
            .primary-btn { max-width: 320px; }
            .multi-title { font-size: 20px; }
            .field-row { grid-template-columns: 92px 1fr; }
            .field-input { height: 46px; }
            input, select { font-size: 16px; }
            .footer { padding: 12px 16px 16px; }
            .primary-btn { height: 48px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="device-container">
        <div class="header">
            <span class="device-id">WP5120Q3000001</span>
            <span id="clock">10:24</span>
        </div>

        <div class="content">
            <div class="single-layout" id="single-layout">
                <div class="vertical-label" id="single-label">Enter Phone Number</div>
                <div class="single-input" id="single-input-shell">
                    <input id="single-input-field" type="tel" inputmode="numeric" placeholder="(XXX) XXX-XXXX">
                </div>
            </div>

            <div class="multi-layout" id="multi-layout">
                <div class="multi-title">Enter your information</div>
                <div class="field-list">
                    <div class="field-row" data-keys="phone,mobile">
                        <div class="field-label">Phone</div>
                        <div class="field-input">
                            <input type="tel" inputmode="numeric" placeholder="(XXX) XXX-XXXX">
                        </div>
                    </div>

                    <div class="field-row" data-keys="email,mail">
                        <div class="field-label">Email</div>
                        <div class="field-input">
                            <input type="email" placeholder="name@example.com">
                        </div>
                    </div>

                    <div class="field-row" data-keys="name,full_name">
                        <div class="field-label">Name</div>
                        <div class="field-input">
                            <input type="text" placeholder="Full name">
                        </div>
                    </div>

                    <div class="field-row" data-keys="id,id_type,id_number,identity">
                        <div class="field-label">ID</div>
                        <div class="field-inputs">
                            <div class="field-input select-wrap">
                                <select>
                                    <option>ID Card</option>
                                    <option>Passport</option>
                                    <option>Driver License</option>
                                    <option>Other</option>
                                </select>
                            </div>
                            <div class="field-input">
                                <input type="text" placeholder="ID number">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer" id="footer">
            <button class="primary-btn">Confirm</button>
        </div>
    </div>

    <script>
        (function () {
            var clock = document.getElementById("clock");
            if (clock) {
                var now = new Date();
                var hours = String(now.getHours()).padStart(2, "0");
                var minutes = String(now.getMinutes()).padStart(2, "0");
                clock.textContent = hours + ":" + minutes;
            }

            var params = new URLSearchParams(window.location.search);
            var fieldParam = params.get("fields");
            var requested = fieldParam
                ? fieldParam.split(",").map(function (item) { return item.trim().toLowerCase(); }).filter(Boolean)
                : ["phone"];

            if (!requested.length) {
                requested = ["phone"];
            }

            var aliasMap = {
                mobile: "phone",
                mail: "email",
                full_name: "name"
            };

            function normalize(key) {
                return aliasMap[key] || key;
            }

            var idKeys = ["id", "id_type", "id_number", "identity"];
            var singleKey = normalize(requested[0]);
            var isSingle = requested.length === 1 && idKeys.indexOf(requested[0]) === -1;

            var singleLayout = document.getElementById("single-layout");
            var multiLayout = document.getElementById("multi-layout");
            var footer = document.getElementById("footer");
            var singleLabel = document.getElementById("single-label");
            var singleInput = document.getElementById("single-input-field");
            var singleShell = document.getElementById("single-input-shell");

            var singleConfig = {
                phone: {
                    label: "Enter Phone Number",
                    placeholder: "(XXX) XXX-XXXX",
                    type: "tel",
                    inputmode: "numeric",
                    format: "phone"
                },
                email: {
                    label: "Enter Email",
                    placeholder: "name@example.com",
                    type: "email",
                    inputmode: "email"
                },
                name: {
                    label: "Enter Full Name",
                    placeholder: "Full name",
                    type: "text",
                    inputmode: "text"
                }
            };

            if (isSingle) {
                singleLayout.classList.remove("is-hidden");
                multiLayout.classList.remove("is-active");
                footer.classList.remove("is-hidden");

                var config = singleConfig[singleKey] || singleConfig.phone;
                singleLabel.textContent = config.label;
                singleInput.placeholder = config.placeholder;
                singleInput.type = config.type;
                singleInput.setAttribute("inputmode", config.inputmode);
                singleShell.classList.toggle("phone-format", config.format === "phone");
            } else {
                singleLayout.classList.add("is-hidden");
                multiLayout.classList.add("is-active");
                footer.classList.remove("is-hidden");

                var rows = document.querySelectorAll(".field-row");
                rows.forEach(function (row) {
                    var keys = row.getAttribute("data-keys").split(",").map(function (item) {
                        return item.trim().toLowerCase();
                    });
                    var show = keys.some(function (key) {
                        return requested.indexOf(key) !== -1;
                    });
                    row.classList.toggle("is-hidden", !show);
                });
            }
        })();
    </script>
</body>
</html>
