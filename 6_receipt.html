<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Receipt</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,600,0,0" rel="stylesheet">
    <style>
        :root {
            --primary: #0A5BFF;
            --primary-light: #EFF6FF;
            --success: #00A86B;
            --success-light: #EAF8F2;
            --text-dark: #111827;
            --text-grey: #667085;
            --result-ink: #24456D;
            --bg-body: #F5F7FB;
            --surface: #FFFFFF;
            --line: #DCE3ED;
            --purple: #7C3AED;
            --purple-light: #F4F0FF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Inter", sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #222222;
            color: var(--text-dark);
        }

        button,
        input {
            font: inherit;
        }

        .material-symbols-rounded {
            font-family: "Material Symbols Rounded";
            font-weight: 600;
            font-style: normal;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: "liga";
            -webkit-font-smoothing: antialiased;
            font-feature-settings: "liga";
        }

        .phone-frame {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 375px;
            height: 812px;
            overflow: hidden;
            border-radius: 18px;
            background: var(--bg-body);
            box-shadow: 0 0 0 12px #1A1A1A, 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .phone-frame {
            --flow-accent: var(--primary);
        }

        .phone-frame[data-theme="cash"],
        .phone-frame[data-theme="qr"] {
            --flow-accent: var(--success);
        }

        .phone-frame[data-theme="gift"] {
            --flow-accent: var(--purple);
        }

        .android-status-bar {
            position: relative;
            z-index: 200;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            flex: 0 0 28px;
            height: 28px;
            padding: 0 14px 0 16px;
            background: var(--bg-body);
            color: var(--text-dark);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.01em;
            line-height: 1;
        }

        .status-time {
            justify-self: start;
            min-width: 34px;
            font-variant-numeric: tabular-nums;
        }

        .status-icons {
            display: flex;
            align-items: center;
            justify-self: end;
            gap: 5px;
            height: 100%;
        }

        .status-network-label {
            font-size: 9px;
            font-weight: 800;
        }

        .status-icon {
            display: block;
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        .status-battery {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .status-battery-value {
            min-width: 17px;
            font-size: 9px;
            text-align: right;
        }

        .status-battery-icon {
            position: relative;
            width: 20px;
            height: 10px;
            padding: 1px;
            border: 1.4px solid currentColor;
            border-radius: 2.5px;
        }

        .status-battery-icon::after {
            position: absolute;
            top: 2px;
            right: -3.5px;
            width: 2px;
            height: 4px;
            border-radius: 0 1px 1px 0;
            background: currentColor;
            content: "";
        }

        .status-battery-level {
            display: block;
            width: 87%;
            height: 100%;
            border-radius: 1px;
            background: currentColor;
        }

        .result-area {
            display: flex;
            align-items: center;
            flex: 0 0 226px;
            flex-direction: column;
            padding: 24px 0 18px;
            text-align: center;
        }

        .top-bar {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 46px;
            min-height: 46px;
            padding: 8px 22px 6px;
        }

        .merchant-name {
            color: var(--text-dark);
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .success-summary {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .success-check {
            width: 64px;
            height: 64px;
            margin-bottom: 13px;
            color: var(--success);
            animation: success-pop 0.42s cubic-bezier(0.2, 0.85, 0.35, 1.25) both;
        }

        .success-check svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .success-check-circle,
        .success-check-mark {
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2.6;
        }

        .success-check-circle {
            stroke-dasharray: 126;
            stroke-dashoffset: 126;
            animation: draw-success-circle 0.5s ease-out 0.08s forwards;
        }

        .success-check-mark {
            stroke-dasharray: 38;
            stroke-dashoffset: 38;
            animation: draw-success-mark 0.34s ease-out 0.46s forwards;
        }

        .success-title {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 0 11px;
            color: var(--result-ink);
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.1em;
            line-height: 1.1;
        }

        .success-title::after {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 36px;
            height: 2px;
            border-radius: 999px;
            background: currentColor;
            content: "";
            transform: translateX(-50%);
        }

        .success-title.long-type {
            font-size: 16px;
            letter-spacing: 0.06em;
        }

        .amount {
            max-width: 330px;
            overflow: hidden;
            margin-top: 16px;
            color: var(--result-ink);
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -0.045em;
            line-height: 1.05;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @keyframes success-pop {
            0% {
                opacity: 0;
                transform: scale(0.72);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes draw-success-circle {
            to {
                stroke-dashoffset: 0;
            }
        }

        @keyframes draw-success-mark {
            to {
                stroke-dashoffset: 0;
            }
        }

        .choice-sheet {
            --flow-divider-offset: 76px;
            position: relative;
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            padding: var(--flow-divider-offset) 24px 20px;
            border-radius: 0;
            background: var(--bg-body);
            box-shadow: none;
            overflow: hidden;
        }

        .transaction-details {
            position: absolute;
            top: 18px;
            left: 24px;
            right: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-width: 0;
            min-height: 32px;
            color: #475467;
        }

        .payment-identity {
            display: flex;
            align-items: center;
            min-width: 0;
            gap: 8px;
        }

        .card-brand-icon {
            display: block;
            width: 42px;
            height: 28px;
            object-fit: contain;
        }

        .payment-method-icon {
            display: none;
            place-items: center;
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: var(--success-light);
            color: #08734C;
        }

        .payment-method-icon .material-symbols-rounded {
            font-size: 20px;
        }

        .transaction-details.non-card .card-brand-icon {
            display: none;
        }

        .transaction-details.non-card .payment-method-icon {
            display: grid;
        }

        .transaction-details[data-method="qr"] .payment-method-icon {
            background: #E7F8F1;
            color: #009D68;
        }

        .transaction-details[data-method="gift"] .payment-method-icon {
            background: var(--purple-light);
            color: var(--purple);
        }

        .payment-account {
            overflow: hidden;
            color: var(--result-ink);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.035em;
            line-height: 1;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .transaction-reference {
            display: flex;
            align-items: baseline;
            flex: 0 0 auto;
            gap: 5px;
            margin-left: 14px;
            color: var(--text-grey);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            line-height: 1;
        }

        .transaction-reference strong {
            color: var(--result-ink);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.02em;
        }

        .sheet-label {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--text-grey);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
        }

        .sheet-label::before,
        .sheet-label::after {
            flex: 1;
            height: 1px;
            background: var(--line);
            content: "";
        }

        .receipt-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: 158px 64px;
            align-content: start;
            flex: 1;
            gap: 12px;
            min-height: 0;
        }

        .receipt-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-width: 0;
            border: 1.5px solid var(--line);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
            color: var(--text-dark);
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
        }

        .receipt-option:active {
            transform: translateY(2px) scale(0.975);
            filter: brightness(0.97);
        }

        .option-icon {
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            border: 1px solid;
            border-radius: 16px;
        }

        .option-icon .material-symbols-rounded {
            font-size: 28px;
        }

        .email-option {
            border-color: #D6E2FF;
        }

        .email-option .option-icon {
            border-color: #D6E2FF;
            background: var(--primary-light);
            color: var(--primary);
        }

        .print-option {
            border-color: #E4D8FF;
        }

        .print-option .option-icon {
            border-color: #E4D8FF;
            background: var(--purple-light);
            color: var(--purple);
        }

        .no-receipt-option {
            grid-column: 1 / -1;
            flex-direction: row;
            gap: 10px;
            border-color: #D7DEE8;
            background: #F8FAFC;
            color: #475467;
            font-size: 14px;
        }

        .no-receipt-option .material-symbols-rounded {
            font-size: 22px;
        }

        .email-panel {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            padding-top: 24px;
        }

        .choice-sheet.email-mode .receipt-options {
            display: none;
        }

        .choice-sheet.email-mode .email-panel {
            display: flex;
        }

        .email-heading {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .email-heading .option-icon {
            width: 48px;
            height: 48px;
            border-color: #D6E2FF;
            background: var(--primary-light);
            color: var(--primary);
        }

        .email-title {
            color: var(--text-dark);
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .email-copy {
            margin-top: 4px;
            color: var(--text-grey);
            font-size: 11px;
            font-weight: 500;
        }

        .email-form {
            margin-top: 28px;
        }

        .email-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-grey);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .email-input {
            width: 100%;
            height: 54px;
            padding: 0 14px;
            border: 1.5px solid var(--line);
            border-radius: 15px;
            outline: none;
            background: #F8FAFC;
            color: var(--text-dark);
            font-size: 15px;
            user-select: text;
        }

        .email-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(10, 91, 255, 0.1);
            background: var(--surface);
        }

        .email-error {
            min-height: 17px;
            margin-top: 7px;
            color: #D92D20;
            font-size: 11px;
            font-weight: 600;
        }

        .email-actions {
            display: grid;
            grid-template-columns: 1fr 1.45fr;
            gap: 10px;
            margin-top: auto;
        }

        .email-action {
            height: 52px;
            border: 1.5px solid #DCE6FF;
            border-radius: 16px;
            background: #F8FAFC;
            color: #64748B;
            cursor: pointer;
            font-size: 13px;
            font-weight: 800;
        }

        .email-action.primary {
            border-color: var(--primary);
            background: var(--primary);
            box-shadow: 0 8px 20px rgba(10, 91, 255, 0.2);
            color: #FFFFFF;
        }

        .toast {
            position: absolute;
            z-index: 20;
            left: 50%;
            bottom: 24px;
            max-width: calc(100% - 48px);
            padding: 10px 14px;
            border-radius: 12px;
            background: #101828;
            color: #FFFFFF;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, 10px);
            transition: opacity 0.18s ease, transform 0.18s ease;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .print-receipt {
            display: none;
        }

        @media print {
            body {
                display: block;
                background: #FFFFFF;
            }

            .phone-frame {
                display: none;
            }

            .print-receipt {
                display: block;
                width: 80mm;
                padding: 8mm 5mm;
                color: #000000;
                font-family: monospace;
                font-size: 12px;
                line-height: 1.5;
                text-align: center;
            }

            .print-rule {
                margin: 10px 0;
                border-top: 1px dashed #000000;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .success-check,
            .success-check-circle,
            .success-check-mark {
                animation-duration: 0.01ms;
                animation-delay: 0ms;
            }
        }

        @media (max-width: 400px) {
            body {
                background: var(--bg-body);
            }

            .phone-frame {
                width: 100vw;
                height: 100dvh;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <div class="phone-frame" id="phone-frame" data-theme="card">
        <div class="android-status-bar" role="status" aria-label="Device status">
            <time class="status-time" id="status-time">09:41</time>
            <div class="status-icons">
                <span class="status-network-label">4G</span>
                <svg class="status-icon" viewBox="0 0 24 24" aria-label="Wi-Fi connected">
                    <path d="M12 18.5 15 22H9l3-3.5Zm0-5.5c2.34 0 4.47.86 6.11 2.28l-2.08 2.43A6.15 6.15 0 0 0 12 16.2a6.15 6.15 0 0 0-4.03 1.51l-2.08-2.43A9.34 9.34 0 0 1 12 13Zm0-6c4.08 0 7.8 1.49 10.66 3.96l-2.08 2.43A13.04 13.04 0 0 0 12 10.2c-3.28 0-6.28 1.2-8.58 3.19l-2.08-2.43A16.26 16.26 0 0 1 12 7Z"></path>
                </svg>
                <span class="status-battery" aria-label="Battery 87 percent">
                    <span class="status-battery-value">87</span>
                    <span class="status-battery-icon" aria-hidden="true">
                        <span class="status-battery-level"></span>
                    </span>
                </span>
            </div>
        </div>

        <header class="top-bar">
            <div class="merchant-name" data-merchant-name>Merchant</div>
        </header>

        <section class="result-area" aria-label="Payment result">

            <div class="success-summary">
                <span class="success-check" aria-hidden="true">
                    <svg viewBox="0 0 48 48">
                        <circle class="success-check-circle" cx="24" cy="24" r="20"></circle>
                        <path class="success-check-mark" d="m14.5 24.5 6.3 6.3 13-14"></path>
                    </svg>
                </span>
                <h1 class="success-title" id="transaction-type">SALE</h1>
                <div class="amount" id="amount-display">$104.00</div>
            </div>
        </section>

        <main class="choice-sheet" id="choice-sheet">
            <div class="transaction-details" id="transaction-details" data-method="card" aria-label="Payment reference">
                <div class="payment-identity">
                    <img class="card-brand-icon" id="card-brand-icon" src="icon_visa.svg" alt="Visa">
                    <span class="payment-method-icon" id="payment-method-icon" aria-hidden="true">
                        <span class="material-symbols-rounded" id="payment-method-symbol">payments</span>
                    </span>
                    <span class="payment-account" id="payment-account">•••• 2004</span>
                </div>
                <div class="transaction-reference">
                    <span>TRANS</span>
                    <strong id="transaction-sequence">#0001</strong>
                </div>
            </div>

            <div class="sheet-label">CUSTOMER COPY</div>

            <section class="receipt-options" aria-label="Customer receipt options">
                <button class="receipt-option email-option" type="button" onclick="openEmailPanel()">
                    <span class="option-icon" aria-hidden="true">
                        <span class="material-symbols-rounded">mail</span>
                    </span>
                    <span>Email</span>
                </button>

                <button class="receipt-option print-option" type="button" onclick="printCustomerCopy()">
                    <span class="option-icon" aria-hidden="true">
                        <span class="material-symbols-rounded">print</span>
                    </span>
                    <span>Print</span>
                </button>

                <button class="receipt-option no-receipt-option" type="button" onclick="skipCustomerCopy()">
                    <span class="material-symbols-rounded" aria-hidden="true">block</span>
                    <span>No Receipt</span>
                </button>
            </section>

            <section class="email-panel" aria-label="Email customer receipt">
                <div class="email-heading">
                    <span class="option-icon" aria-hidden="true">
                        <span class="material-symbols-rounded">mail</span>
                    </span>
                    <div>
                        <h2 class="email-title">Email Receipt</h2>
                        <p class="email-copy">Send the customer copy by email.</p>
                    </div>
                </div>

                <div class="email-form">
                    <label class="email-label" for="email-input">Email Address</label>
                    <input class="email-input" id="email-input" type="email" inputmode="email"
                        autocomplete="email" placeholder="customer@example.com">
                    <div class="email-error" id="email-error" aria-live="polite"></div>
                </div>

                <div class="email-actions">
                    <button class="email-action" type="button" onclick="closeEmailPanel()">Back</button>
                    <button class="email-action primary" type="button" onclick="sendEmailReceipt()">Send Receipt</button>
                </div>
            </section>
        </main>

        <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <section class="print-receipt" id="print-receipt" aria-hidden="true">
        <strong data-merchant-name>Merchant</strong><br>
        CUSTOMER COPY
        <div class="print-rule"></div>
        <span id="print-method">CARD PAYMENT</span><br>
        <span id="print-transaction-type">SALE</span><br>
        <span id="print-payment-reference">VISA •••• 2004</span><br>
        <span id="print-transaction-sequence">TRANS #0001</span><br>
        <div class="print-rule"></div>
        TOTAL&nbsp;&nbsp;<strong id="print-amount">$104.00</strong><br>
        APPROVED
        <div class="print-rule"></div>
        Thank you for your purchase
    </section>

    <script src="merchant-context.js"></script>
    <script>
        const choiceSheet = document.getElementById("choice-sheet");
        const phoneFrame = document.getElementById("phone-frame");
        const statusTime = document.getElementById("status-time");
        const emailInput = document.getElementById("email-input");
        const emailError = document.getElementById("email-error");
        const toast = document.getElementById("toast");
        const amountCents = resolveAmountCents();
        const paymentMethod = resolvePaymentMethod();
        const transactionType = resolveTransactionType();
        const cardBrand = resolveCardBrand();
        const maskedCard = resolveMaskedCard();
        const transactionSequence = resolveTransactionSequence();
        let completionPending = false;

        function formatCurrency(cents) {
            return (Math.max(0, cents) / 100).toLocaleString("en-US", {
                style: "currency",
                currency: "USD"
            });
        }

        function parseMoneyToCents(value) {
            if (value === null || value === undefined || value === "") return null;
            const amount = Number(value);
            if (!Number.isFinite(amount) || amount < 0) return null;
            return Math.round(amount * 100);
        }

        function resolveAmountCents() {
            const params = new URLSearchParams(window.location.search);
            const centsText = params.get("amountCents");
            const cents = Number(centsText);
            if (centsText !== null && centsText !== "" && Number.isFinite(cents) && cents >= 0) {
                return Math.round(cents);
            }

            const amount = parseMoneyToCents(params.get("amount"));
            if (amount !== null) return amount;

            const stored = Number(localStorage.getItem("finalAmountCents"));
            if (Number.isFinite(stored) && stored >= 0) return Math.round(stored);

            return 10400;
        }

        function resolvePaymentMethod() {
            const params = new URLSearchParams(window.location.search);
            const method = params.get("paymentMethod") || params.get("method") || localStorage.getItem("paymentMethod") || "card";
            const normalized = method.trim().toLowerCase();
            if (["cash", "qr", "gift", "card"].includes(normalized)) return normalized;
            if (["alipay", "wechat", "weixin", "scan"].includes(normalized)) return "qr";
            return "card";
        }

        function resolveTransactionType() {
            const params = new URLSearchParams(window.location.search);
            const rawType = params.get("transactionType") || params.get("type") || localStorage.getItem("transactionType") || "sale";
            const normalized = rawType
                .trim()
                .replace(/[_\s]+/g, "-")
                .replace(/-+/g, "-")
                .toUpperCase();
            return normalized || "SALE";
        }

        function resolveCardBrand() {
            const params = new URLSearchParams(window.location.search);
            const rawBrand = params.get("cardBrand") || params.get("brand") || localStorage.getItem("cardBrand") || "visa";
            const normalized = rawBrand.trim().toLowerCase().replace(/[\s_-]+/g, "");
            const aliases = {
                visa: "visa",
                mastercard: "mastercard",
                mc: "mastercard",
                amex: "amex",
                americanexpress: "amex",
                discover: "discover"
            };
            return aliases[normalized] || "visa";
        }

        function resolveMaskedCard() {
            const params = new URLSearchParams(window.location.search);
            const rawCard = params.get("last4") || params.get("maskedCard") || params.get("cardNumber") || localStorage.getItem("cardLast4") || "2004";
            const digits = rawCard.replace(/\D/g, "");
            const lastFour = digits.slice(-4) || "2004";
            return "•••• " + lastFour;
        }

        function resolveTransactionSequence() {
            const params = new URLSearchParams(window.location.search);
            const rawSequence = params.get("transactionNo") || params.get("transactionNumber") || params.get("transNo") || params.get("stan") || localStorage.getItem("transactionSequence") || "0001";
            const safeSequence = rawSequence.trim().replace(/^#+/, "").replace(/[^A-Za-z0-9-]/g, "").slice(0, 12);
            return safeSequence || "0001";
        }

        function getCardBrandConfig() {
            const brands = {
                visa: { label: "Visa", src: "icon_visa.svg" },
                mastercard: { label: "Mastercard", src: "icon_mastercard.svg" },
                amex: { label: "American Express", src: "icon_amex.svg" },
                discover: { label: "Discover", src: "icon_discover.svg" }
            };
            return brands[cardBrand] || brands.visa;
        }

        function getPaymentMethodLabel() {
            const labels = {
                cash: "CASH PAYMENT",
                card: "CARD PAYMENT",
                qr: "QR PAYMENT",
                gift: "GIFT PAYMENT"
            };
            return labels[paymentMethod] || "CARD PAYMENT";
        }

        function updateStatusTime() {
            statusTime.textContent = new Date().toLocaleTimeString("en-US", {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            });
        }

        function syncPaymentReference() {
            const detailsEl = document.getElementById("transaction-details");
            const brandIconEl = document.getElementById("card-brand-icon");
            const methodSymbolEl = document.getElementById("payment-method-symbol");
            const accountEl = document.getElementById("payment-account");
            const sequenceEl = document.getElementById("transaction-sequence");
            const printReferenceEl = document.getElementById("print-payment-reference");
            const displaySequence = "#" + transactionSequence;

            detailsEl.dataset.method = paymentMethod;
            detailsEl.classList.toggle("non-card", paymentMethod !== "card");
            sequenceEl.textContent = displaySequence;
            document.getElementById("print-transaction-sequence").textContent = "TRANS " + displaySequence;

            if (paymentMethod === "card") {
                const brand = getCardBrandConfig();
                brandIconEl.src = brand.src;
                brandIconEl.alt = brand.label;
                accountEl.textContent = maskedCard;
                detailsEl.setAttribute("aria-label", brand.label + " card " + maskedCard + ", transaction " + transactionSequence);
                printReferenceEl.textContent = brand.label.toUpperCase() + " " + maskedCard;
                return;
            }

            const methodDetails = {
                cash: { symbol: "payments", account: "CASH", label: "Cash payment" },
                qr: { symbol: "qr_code_2", account: "QR", label: "QR payment" },
                gift: { symbol: "redeem", account: "GIFT", label: "Gift payment" }
            };
            const detail = methodDetails[paymentMethod] || methodDetails.cash;
            methodSymbolEl.textContent = detail.symbol;
            accountEl.textContent = detail.account;
            detailsEl.setAttribute("aria-label", detail.label + ", transaction " + transactionSequence);
            printReferenceEl.textContent = detail.account;
        }

        function getReceiptPayload(deliveryMethod, extra = {}) {
            return {
                deliveryMethod: deliveryMethod,
                amountCents: amountCents,
                paymentMethod: paymentMethod,
                transactionType: transactionType.toLowerCase(),
                cardBrand: paymentMethod === "card" ? cardBrand : null,
                maskedCard: paymentMethod === "card" ? maskedCard : null,
                transactionSequence: transactionSequence,
                ...extra
            };
        }

        function syncTransactionDetails() {
            const amountText = formatCurrency(amountCents);
            const transactionTypeEl = document.getElementById("transaction-type");
            phoneFrame.dataset.theme = paymentMethod;
            transactionTypeEl.textContent = transactionType;
            transactionTypeEl.classList.toggle("long-type", transactionType.length > 12);
            document.getElementById("amount-display").textContent = amountText;
            document.getElementById("print-method").textContent = getPaymentMethodLabel();
            document.getElementById("print-transaction-type").textContent = transactionType;
            document.getElementById("print-amount").textContent = amountText;
            syncPaymentReference();
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add("show");
            window.setTimeout(() => toast.classList.remove("show"), 1200);
        }

        function openEmailPanel() {
            choiceSheet.classList.add("email-mode");
            emailError.textContent = "";
            window.setTimeout(() => emailInput.focus(), 80);
        }

        function closeEmailPanel() {
            choiceSheet.classList.remove("email-mode");
            emailError.textContent = "";
        }

        function finishReceiptChoice(deliveryMethod, extra = {}) {
            if (completionPending) return;
            completionPending = true;
            const payload = getReceiptPayload(deliveryMethod, extra);
            localStorage.setItem("customerReceiptMethod", deliveryMethod);
            window.dispatchEvent(new CustomEvent("customer-receipt-complete", { detail: payload }));

            if (typeof window.onCustomerReceiptComplete === "function") {
                window.onCustomerReceiptComplete(payload);
                return;
            }

            window.location.href = "1.unified_pos.html";
        }

        function sendEmailReceipt() {
            const email = emailInput.value.trim();
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                emailError.textContent = "Enter a valid email address.";
                emailInput.focus();
                return;
            }

            const payload = getReceiptPayload("email", { email: email });
            emailError.textContent = "";
            if (typeof window.onCustomerReceiptEmail === "function") {
                window.onCustomerReceiptEmail(payload);
            }
            window.dispatchEvent(new CustomEvent("customer-receipt-email", { detail: payload }));
            showToast("Receipt emailed");
            window.setTimeout(() => finishReceiptChoice("email", { email: email }), 700);
        }

        function printCustomerCopy() {
            const payload = getReceiptPayload("print");
            if (typeof window.onCustomerReceiptPrint === "function") {
                window.onCustomerReceiptPrint(payload);
            } else {
                window.print();
            }
            window.dispatchEvent(new CustomEvent("customer-receipt-print", { detail: payload }));
            showToast("Customer copy sent to printer");
            window.setTimeout(() => finishReceiptChoice("print"), 500);
        }

        function skipCustomerCopy() {
            finishReceiptChoice("none");
        }

        emailInput.addEventListener("input", () => {
            emailError.textContent = "";
        });

        emailInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") sendEmailReceipt();
            if (event.key === "Escape") closeEmailPanel();
        });

        updateStatusTime();
        window.setInterval(updateStatusTime, 30000);
        syncTransactionDetails();
    </script>
</body>

</html>
