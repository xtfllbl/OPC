<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Discount - Mini</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0A5BFF;
            --cash: #00A86B;
            --bg-body: #F3F4F6;
            --surface: #FFFFFF;
            --text-dark: #111827;
            --text-muted: #6B7280;
            --line: #E5E7EB;
            --cash-soft: #E7FAF1;
            --card-soft: #E6EEFF;
            --shadow-lg: 0 18px 40px rgba(15, 23, 42, 0.16);
            --shadow-sm: 0 8px 18px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Inter", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #1B1B1B;
            color: var(--text-dark);
        }

        button {
            font: inherit;
        }

        .mini-frame {
            position: relative;
            width: 480px;
            height: 480px;
            overflow: hidden;
            border-radius: 24px;
            background: var(--bg-body);
            box-shadow: 0 0 0 10px #101010, var(--shadow-lg);
        }

        .mini-frame::before,
        .mini-frame::after {
            position: absolute;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            content: "";
            pointer-events: none;
        }

        .mini-frame::before {
            top: -112px;
            right: -102px;
            background: radial-gradient(circle at 30% 30%, rgba(10, 91, 255, 0.19), transparent 65%);
        }

        .mini-frame::after {
            bottom: -140px;
            left: -116px;
            background: radial-gradient(circle at 70% 70%, rgba(0, 168, 107, 0.14), transparent 64%);
        }

        .mini-content {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            gap: 10px;
            width: 100%;
            height: 100%;
            padding: 14px 16px 16px;
        }

        .status-bar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 6px;
            min-height: 16px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        #time-display {
            justify-self: start;
        }

        .screen-label {
            color: rgba(17, 24, 39, 0.72);
            font-size: 9px;
            letter-spacing: 0.18em;
        }

        .status-right {
            display: flex;
            align-items: center;
            justify-self: end;
            gap: 6px;
            font-weight: 600;
            letter-spacing: 0.1em;
        }

        .battery {
            position: relative;
            width: 22px;
            height: 10px;
            border: 1.5px solid #9CA3AF;
            border-radius: 3px;
        }

        .battery::after {
            position: absolute;
            top: 2px;
            right: -3px;
            width: 2px;
            height: 6px;
            border-radius: 1px;
            background: #9CA3AF;
            content: "";
        }

        .battery-level {
            width: 85%;
            height: 100%;
            border-radius: 2px;
            background: #111827;
        }

        .payment-panel {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            gap: 12px;
            min-height: 0;
        }

        .payment-heading {
            padding: 3px 4px 1px;
        }

        h1 {
            color: var(--text-dark);
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.045em;
            line-height: 1.05;
        }

        .choices {
            display: grid;
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: 10px;
            min-height: 0;
        }

        .option-card {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 0;
            overflow: hidden;
            border: 1.5px solid var(--line);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04), var(--shadow-sm);
            cursor: pointer;
            text-align: left;
            transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }

        .option-card::before {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 4px;
            border-radius: 18px 0 0 18px;
            background: transparent;
            content: "";
            transition: background 0.15s ease;
        }

        .option-card:active {
            transform: scale(0.99);
        }

        .option-card:focus-visible,
        .btn:focus-visible {
            outline: 3px solid rgba(10, 91, 255, 0.38);
            outline-offset: 2px;
        }

        .cash-card.selected {
            border-color: rgba(0, 168, 107, 0.48);
            background: var(--cash-soft);
            box-shadow: 0 8px 18px rgba(0, 168, 107, 0.12);
        }

        .cash-card.selected::before {
            background: var(--cash);
        }

        .card-card.selected {
            border-color: rgba(10, 91, 255, 0.52);
            background: var(--card-soft);
            box-shadow: 0 8px 18px rgba(10, 91, 255, 0.12);
        }

        .card-card.selected::before {
            background: var(--primary);
        }

        .option-info {
            min-width: 0;
            padding: 16px 0 16px 22px;
        }

        .option-head {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .option-name {
            overflow: hidden;
            color: var(--text-dark);
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -0.025em;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .badge {
            flex: 0 0 auto;
            border-radius: 999px;
            padding: 5px 9px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.09em;
            line-height: 1;
            text-transform: uppercase;
        }

        .badge-save {
            background: #C3EFD3;
            color: #087344;
        }

        .badge-standard {
            background: #D5E2FF;
            color: #2458C7;
        }

        .option-note {
            margin-top: 8px;
            overflow: hidden;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            line-height: 1.25;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .saving {
            display: block;
            margin-top: 6px;
            color: #087344;
            font-size: 12px;
            font-weight: 700;
            line-height: 1.2;
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 9px;
        }

        .brand-row img {
            display: block;
            width: auto;
            height: 17px;
            max-width: 40px;
        }

        .more-brands {
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .option-price {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            min-width: 142px;
            padding: 16px 18px 16px 0;
            text-align: right;
        }

        .option-price .badge {
            margin-bottom: 12px;
        }

        .amount {
            display: block;
            max-width: 150px;
            overflow: hidden;
            color: #1D3557;
            font-size: clamp(27px, 7.2vw, 36px);
            font-weight: 800;
            letter-spacing: -0.055em;
            line-height: 1;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cash-card.selected .amount {
            color: #087344;
        }

        .card-card.selected .amount {
            color: #174DB8;
        }

        .selection-label {
            display: block;
            margin-top: 7px;
            color: transparent;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.12em;
            line-height: 1;
            text-transform: uppercase;
        }

        .selected .selection-label {
            color: var(--text-muted);
        }

        .cash-card.selected .selection-label {
            color: #087344;
        }

        .card-card.selected .selection-label {
            color: #2458C7;
        }

        .action-row {
            display: grid;
            grid-template-columns: 102px minmax(0, 1fr);
            gap: 10px;
        }

        .btn {
            height: 56px;
            border-radius: 18px;
            border: 1px solid #D1D5DB;
            background: rgba(255, 255, 255, 0.82);
            color: #374151;
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.01em;
            transition: filter 0.15s ease, transform 0.15s ease, background 0.15s ease;
        }

        .btn:active {
            filter: brightness(0.96);
            transform: scale(0.985);
        }

        .btn-primary {
            border: none;
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.18);
            color: #FFFFFF;
        }

        .btn-primary.is-card {
            background: var(--primary);
        }

        .btn-primary.is-cash {
            background: var(--cash);
        }

        @media (max-width: 520px) {
            body {
                background: var(--bg-body);
            }

            .mini-frame {
                width: 100vw;
                height: 100dvh;
                border-radius: 0;
                box-shadow: none;
            }
        }

        @media (max-width: 360px) {
            .mini-content {
                padding-right: 12px;
                padding-left: 12px;
            }

            h1 {
                font-size: 23px;
            }

            .option-info {
                padding-left: 16px;
            }

            .option-price {
                min-width: 112px;
                padding-right: 13px;
            }

            .option-note {
                font-size: 10px;
            }

            .action-row {
                grid-template-columns: 84px minmax(0, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="mini-frame">
        <div class="mini-content">
            <div class="status-bar" aria-label="Device status">
                <span id="time-display">09:41</span>
                <span class="screen-label">Payment</span>
                <div class="status-right">
                    <span>85%</span>
                    <span class="battery" aria-hidden="true"><span class="battery-level"></span></span>
                </div>
            </div>

            <main class="payment-panel">
                <header class="payment-heading">
                    <h1>How will customer pay?</h1>
                </header>

                <section class="choices" aria-label="Payment methods">
                    <button class="option-card cash-card" id="cash-card" type="button" aria-pressed="false" onclick="selectMethod('cash')">
                        <span class="option-info">
                            <span class="option-head">
                                <span class="option-name">Cash</span>
                            </span>
                            <span class="option-note">Pay by cash.</span>
                            <span class="saving" id="save-amount">You save $4.00</span>
                        </span>
                        <span class="option-price">
                            <span class="badge badge-save">Save 4%</span>
                            <span class="amount" id="cash-amount">$96.00</span>
                            <span class="selection-label">Selected</span>
                        </span>
                    </button>

                    <button class="option-card card-card selected" id="card-card" type="button" aria-pressed="true" onclick="selectMethod('card')">
                        <span class="option-info">
                            <span class="option-head">
                                <span class="option-name">Card</span>
                            </span>
                            <span class="option-note">Tap, dip, swipe</span>
                            <span class="brand-row" aria-label="Visa, Mastercard, American Express, and Discover accepted">
                                <img src="visa.svg" alt="Visa">
                                <img src="mastercard.svg" alt="Mastercard">
                            </span>
                        </span>
                        <span class="option-price">
                            <span class="badge badge-standard">Standard</span>
                            <span class="amount" id="card-amount">$100.00</span>
                            <span class="selection-label">Selected</span>
                        </span>
                    </button>
                </section>

                <div class="action-row">
                    <button class="btn btn-back" type="button" onclick="handleBack()">Back</button>
                    <button class="btn btn-primary is-card" id="continue-btn" type="button" onclick="handleContinue()">Card Payment</button>
                </div>
            </main>
        </div>
    </div>

    <script>
        const DISCOUNT_RATE = 0.04;
        const cashCard = document.getElementById("cash-card");
        const cardCard = document.getElementById("card-card");
        const cashAmountEl = document.getElementById("cash-amount");
        const cardAmountEl = document.getElementById("card-amount");
        const saveAmountEl = document.getElementById("save-amount");
        const continueBtn = document.getElementById("continue-btn");
        const timeDisplay = document.getElementById("time-display");

        let selectedMethod = "card";
        let cardAmountCents = resolveIncomingAmount();

        function formatMoney(cents) {
            return (Math.max(0, cents) / 100).toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function parseMoneyToCents(value) {
            if (value === null || value === undefined || value === "") {
                return null;
            }
            const amount = Number(value);
            if (!Number.isFinite(amount) || amount < 0) {
                return null;
            }
            return Math.round(amount * 100);
        }

        function resolveIncomingAmount() {
            const params = new URLSearchParams(window.location.search);
            const queryCents = Number(params.get("amountCents"));
            if (Number.isFinite(queryCents) && queryCents > 0) {
                return Math.round(queryCents);
            }

            const queryAmount = parseMoneyToCents(params.get("amount"));
            if (queryAmount !== null && queryAmount > 0) {
                return queryAmount;
            }

            if (Number.isFinite(window.transactionAmountCents) && window.transactionAmountCents > 0) {
                return Math.round(window.transactionAmountCents);
            }

            const globalAmount = parseMoneyToCents(window.transactionAmount);
            if (globalAmount !== null && globalAmount > 0) {
                return globalAmount;
            }

            return 10000;
        }

        function getCashAmountCents() {
            return Math.round(cardAmountCents * (1 - DISCOUNT_RATE));
        }

        function syncView() {
            const cashAmountCents = getCashAmountCents();
            const savingsCents = cardAmountCents - cashAmountCents;
            const isCash = selectedMethod === "cash";

            cardAmountEl.textContent = "$" + formatMoney(cardAmountCents);
            cashAmountEl.textContent = "$" + formatMoney(cashAmountCents);
            saveAmountEl.textContent = "You save $" + formatMoney(savingsCents);

            cashCard.classList.toggle("selected", isCash);
            cardCard.classList.toggle("selected", !isCash);
            cashCard.setAttribute("aria-pressed", String(isCash));
            cardCard.setAttribute("aria-pressed", String(!isCash));

            continueBtn.textContent = isCash ? "Cash Payment" : "Card Payment";
            continueBtn.classList.toggle("is-cash", isCash);
            continueBtn.classList.toggle("is-card", !isCash);
        }

        function selectMethod(method) {
            selectedMethod = method === "cash" ? "cash" : "card";
            syncView();
        }

        function handleBack() {
            if (typeof window.onCashDiscountBack === "function") {
                window.onCashDiscountBack();
                return;
            }
            if (window.history.length > 1) {
                window.history.back();
            }
        }

        function handleContinue() {
            const cashAmountCents = getCashAmountCents();
            const payload = {
                method: selectedMethod,
                cardAmountCents: cardAmountCents,
                cashAmountCents: cashAmountCents,
                savingsCents: cardAmountCents - cashAmountCents,
                finalAmountCents: selectedMethod === "cash" ? cashAmountCents : cardAmountCents
            };

            if (typeof window.onCashDiscountContinue === "function") {
                window.onCashDiscountContinue(payload);
                return;
            }

            if (selectedMethod === "cash") {
                window.location.href = "11.cash_change_mini.html?dueCents=" + cashAmountCents;
                return;
            }

            window.dispatchEvent(new CustomEvent("cash-discount-continue", { detail: payload }));
        }

        window.setTransactionAmountCents = function (cents) {
            if (!Number.isFinite(cents) || cents <= 0) {
                return;
            }
            cardAmountCents = Math.round(cents);
            syncView();
        };

        window.setTransactionAmount = function (amount) {
            const cents = parseMoneyToCents(amount);
            if (cents === null || cents <= 0) {
                return;
            }
            cardAmountCents = cents;
            syncView();
        };

        function updateTime() {
            const now = new Date();
            timeDisplay.textContent = now.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            });
        }

        syncView();
        updateTime();
        window.setInterval(updateTime, 30000);
    </script>
</body>

</html>
