<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Payment Failed (Dark)</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap");

        :root {
            --bg-main: #0f1319;
            --panel-main: #151b24;
            --text-main: #f4f7ff;
            --text-sub: #9aa7ba;
            --border-soft: rgba(255, 255, 255, 0.12);
            --accent-main: #ef4444;
            --accent-deep: #b91c1c;
            --accent-soft: rgba(239, 68, 68, 0.14);
            --retry-main: #2872ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "DM Sans", "Space Grotesk", sans-serif;
            user-select: none;
        }

        body {
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .device-container {
            width: 480px;
            height: 100vh;
            max-height: 800px;
            background: radial-gradient(140% 120% at 50% 0%, #1d2430 0%, #121821 48%, #0b1016 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.5);
        }

        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            height: 60px;
        }

        .device-id {
            font-weight: 600;
            letter-spacing: 0.6px;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 26px 24px 18px;
            gap: 18px;
        }

        .status-shell {
            width: 100%;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 24px;
            background: rgba(29, 18, 22, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 12px;
            padding: 22px 18px 20px;
        }

        .status-orb {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: var(--accent-main);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .status-orb svg {
            width: 70px;
            height: 70px;
        }

        .status-orb line {
            fill: none;
            stroke: #3f0f0f;
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 120;
            stroke-dashoffset: 120;
            animation: draw 0.9s ease-out forwards;
        }

        .status-orb line:nth-child(2) {
            animation-delay: 0.1s;
        }

        .status-title {
            font-family: "Space Grotesk", "DM Sans", sans-serif;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 0.01em;
            color: var(--text-main);
        }

        .amount-chip {
            padding: 10px 18px;
            border-radius: 999px;
            border: 1px solid rgba(239, 68, 68, 0.45);
            background: var(--accent-soft);
            font-family: "Space Grotesk", "DM Sans", sans-serif;
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
            color: #ff8e8e;
            letter-spacing: 0.01em;
            margin-top: 2px;
        }

        .meta-card {
            width: 100%;
            background: var(--panel-main);
            border: 1px solid var(--border-soft);
            border-radius: 18px;
            padding: 6px 16px;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 13px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.09);
        }

        .meta-row:last-child {
            border-bottom: none;
        }

        .meta-label {
            font-size: 14px;
            color: var(--text-sub);
            letter-spacing: 0.02em;
        }

        .meta-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            text-align: right;
            word-break: break-word;
        }

        .meta-value.reason {
            color: #ff8e8e;
            max-width: 230px;
        }

        .footer {
            padding: 14px 24px 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            gap: 12px;
        }

        .btn {
            height: 56px;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-cancel {
            width: 46%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #d5deeb;
            background: #222a35;
        }

        .btn-retry {
            flex: 1;
            border: none;
            color: #ffffff;
            background: var(--retry-main);
        }

        @keyframes draw {
            from { stroke-dashoffset: 120; }
            to { stroke-dashoffset: 0; }
        }

        @media screen and (max-height: 580px) {
            .header { padding: 10px 16px; height: 52px; }
            .content { padding: 14px 16px 10px; gap: 12px; }
            .status-shell { padding: 16px 14px 14px; border-radius: 20px; gap: 8px; }
            .status-orb { width: 98px; height: 98px; }
            .status-orb svg { width: 52px; height: 52px; }
            .status-title { font-size: 28px; }
            .amount-chip { font-size: 24px; padding: 8px 14px; }
            .meta-row { padding: 10px 0; }
            .meta-label { font-size: 13px; }
            .meta-value { font-size: 14px; }
            .meta-value.reason { max-width: 190px; }
            .footer { padding: 10px 16px 14px; }
            .btn { height: 48px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="device-container">
        <div class="header">
            <span class="device-id">WP5120Q3000001</span>
            <span id="clock">10:24</span>
        </div>

        <div class="content">
            <section class="status-shell" aria-label="Payment failed">
                <div class="status-orb" aria-hidden="true">
                    <svg viewBox="0 0 64 64">
                        <line x1="14" y1="14" x2="50" y2="50"></line>
                        <line x1="50" y1="14" x2="14" y2="50"></line>
                    </svg>
                </div>
                <h1 class="status-title">Payment Failed</h1>
                <div class="amount-chip" id="failed-amount">RM 128.00</div>
            </section>

            <section class="meta-card" aria-label="Transaction details">
                <div class="meta-row">
                    <span class="meta-label">Method</span>
                    <span class="meta-value" id="pay-method">DuitNow QR</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">Reason</span>
                    <span class="meta-value reason" id="fail-reason">Transaction timeout</span>
                </div>
                <div class="meta-row">
                    <span class="meta-label">Reference</span>
                    <span class="meta-value" id="reference-id">QRP-20260206-102400</span>
                </div>
            </section>
        </div>

        <div class="footer">
            <button class="btn btn-cancel" id="cancel-btn" type="button">Cancel (15s)</button>
            <button class="btn btn-retry" id="retry-btn" type="button">Try Again</button>
        </div>
    </div>

    <script>
        (function () {
            var clock = document.getElementById("clock");
            var failedAmountEl = document.getElementById("failed-amount");
            var methodEl = document.getElementById("pay-method");
            var reasonEl = document.getElementById("fail-reason");
            var referenceEl = document.getElementById("reference-id");
            var retryBtn = document.getElementById("retry-btn");
            var cancelBtn = document.getElementById("cancel-btn");

            var params = new URLSearchParams(window.location.search);
            var countdown = parseInt(params.get("countdown"), 10);
            countdown = Number.isFinite(countdown) && countdown >= 0 ? countdown : 15;

            function two(n) {
                return String(n).padStart(2, "0");
            }

            function parseMoneyToCents(value) {
                if (value === null || value === undefined || value === "") {
                    return null;
                }
                var n = Number(value);
                if (!Number.isFinite(n) || n < 0) {
                    return null;
                }
                return Math.round(n * 100);
            }

            function resolveAmountCents() {
                var amountCents = Number(params.get("amountCents"));
                if (Number.isFinite(amountCents) && amountCents >= 0) {
                    return Math.round(amountCents);
                }
                var amount = parseMoneyToCents(params.get("amount"));
                if (amount !== null) {
                    return amount;
                }
                if (Number.isFinite(window.transactionAmountCents) && window.transactionAmountCents >= 0) {
                    return Math.round(window.transactionAmountCents);
                }
                var globalAmount = parseMoneyToCents(window.transactionAmount);
                if (globalAmount !== null) {
                    return globalAmount;
                }
                return 12800;
            }

            function formatAmount(cents, currency) {
                return currency + " " + (Math.max(0, cents) / 100).toLocaleString("en-US", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });
            }

            function defaultReference(date) {
                return "QRP-" + date.getFullYear() + two(date.getMonth() + 1) + two(date.getDate()) + "-" +
                    two(date.getHours()) + two(date.getMinutes()) + two(date.getSeconds());
            }

            function navigateBack() {
                if (window.history.length > 1) {
                    window.history.back();
                    return;
                }
            }

            function triggerRetry(payload) {
                if (typeof window.onQrPaymentFailedRetry === "function") {
                    window.onQrPaymentFailedRetry(payload);
                    return;
                }
                window.dispatchEvent(new CustomEvent("qr-payment-failed-retry", { detail: payload }));
                window.location.href = "9.show_QR.html";
            }

            function triggerCancel(payload) {
                if (typeof window.onQrPaymentFailedCancel === "function") {
                    window.onQrPaymentFailedCancel(payload);
                    return;
                }
                window.dispatchEvent(new CustomEvent("qr-payment-failed-cancel", { detail: payload }));
                navigateBack();
            }

            var now = new Date();
            var currency = params.get("currency") || "RM";
            var method = params.get("method") || "DuitNow QR";
            var reason = params.get("reason") || "Transaction timeout";
            var reference = params.get("reference") || defaultReference(now);
            var amountCents = resolveAmountCents();

            if (clock) {
                clock.textContent = two(now.getHours()) + ":" + two(now.getMinutes());
            }
            failedAmountEl.textContent = formatAmount(amountCents, currency);
            methodEl.textContent = method;
            reasonEl.textContent = reason;
            referenceEl.textContent = reference;

            var hasExited = false;
            var payload = {
                amountCents: amountCents,
                currency: currency,
                method: method,
                reason: reason,
                reference: reference
            };

            function handleCancel() {
                if (hasExited) {
                    return;
                }
                hasExited = true;
                triggerCancel(payload);
            }

            function updateCancelText() {
                cancelBtn.textContent = countdown > 0 ? "Cancel (" + countdown + "s)" : "Cancel";
            }

            retryBtn.addEventListener("click", function () {
                if (hasExited) {
                    return;
                }
                hasExited = true;
                triggerRetry(payload);
            });

            cancelBtn.addEventListener("click", handleCancel);
            updateCancelText();

            if (countdown > 0) {
                var timer = setInterval(function () {
                    countdown -= 1;
                    updateCancelText();
                    if (countdown <= 0) {
                        clearInterval(timer);
                        handleCancel();
                    }
                }, 1000);
            }
        })();
    </script>
</body>
</html>
