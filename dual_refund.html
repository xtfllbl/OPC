<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Refund Method</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <style>
        :root {
            --card: #315E9B;
            --card-light: #F0F4FA;
            --card-border: #BCCBE0;
            --cash: #167A4A;
            --cash-light: #EFF8F2;
            --cash-border: #A9D6BA;
            --amount: #A94750;
            --text-dark: #111827;
            --text-grey: #6B7280;
            --bg-body: #F5F7FB;
            --surface: #FFFFFF;
            --line: #D8E0EB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Inter", sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #222222;
            color: var(--text-dark);
        }

        button {
            font: inherit;
        }

        .phone-frame {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 375px;
            height: 812px;
            overflow: hidden;
            border-radius: 18px;
            background: var(--bg-body);
            box-shadow: 0 0 0 12px #1A1A1A, 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .android-status-bar {
            position: relative;
            z-index: 20;
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            flex: 0 0 28px;
            height: 28px;
            padding: 0 14px 0 16px;
            background: var(--bg-body);
            color: var(--text-dark);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.01em;
            line-height: 1;
        }

        .status-time {
            justify-self: start;
            min-width: 34px;
            font-variant-numeric: tabular-nums;
        }

        .status-icons {
            display: flex;
            align-items: center;
            justify-self: end;
            gap: 5px;
            height: 100%;
        }

        .status-network-label {
            font-size: 9px;
            font-weight: 800;
        }

        .status-icon {
            display: block;
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        .status-battery {
            display: inline-flex;
            align-items: center;
            gap: 2px;
        }

        .status-battery-value {
            min-width: 17px;
            font-size: 9px;
            text-align: right;
        }

        .status-battery-icon {
            position: relative;
            width: 20px;
            height: 10px;
            padding: 1px;
            border: 1.4px solid currentColor;
            border-radius: 2.5px;
        }

        .status-battery-icon::after {
            position: absolute;
            top: 2px;
            right: -3.5px;
            width: 2px;
            height: 4px;
            border-radius: 0 1px 1px 0;
            background: currentColor;
            content: "";
        }

        .status-battery-level {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 1px;
            background: currentColor;
        }

        .header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 46px;
            min-height: 46px;
            padding: 8px 22px 6px;
        }

        .merchant-name {
            color: var(--text-dark);
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .icon-btn {
            position: absolute;
            top: 3px;
            left: 18px;
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--surface);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            color: var(--text-dark);
            cursor: pointer;
        }

        .icon-btn:active {
            transform: scale(0.96);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2.2;
        }

        .merchant-stage {
            display: grid;
            place-items: center;
            flex: 0 0 226px;
            height: 226px;
        }

        .merchant-logo-slot {
            display: grid;
            place-items: center;
            width: var(--merchant-logo-width, 120px);
            height: var(--merchant-logo-height, 120px);
            max-width: calc(100% - 40px);
            padding: 0;
            border: 0;
            background: transparent;
        }

        .merchant-logo-slot[data-shape="round"] {
            --merchant-logo-width: 128px;
            --merchant-logo-height: 128px;
        }

        .merchant-logo-slot[data-shape="wide"] {
            --merchant-logo-width: 220px;
            --merchant-logo-height: 110px;
        }

        .merchant-logo-slot[data-shape="wordmark"] {
            --merchant-logo-width: 240px;
            --merchant-logo-height: 105px;
        }

        .merchant-logo-slot[data-shape="tall"] {
            --merchant-logo-width: 90px;
            --merchant-logo-height: 145px;
        }

        .merchant-logo-slot img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .content-sheet {
            --flow-divider-offset: 76px;
            display: flex;
            flex: 1;
            flex-direction: column;
            min-height: 0;
            padding: var(--flow-divider-offset) 24px 20px;
            background: var(--bg-body);
            overflow: hidden;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--text-grey);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.12em;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
        }

        .section-title::before,
        .section-title::after {
            flex: 1;
            height: 1px;
            background: var(--line);
            content: "";
        }

        .refund-options {
            display: grid;
            grid-template-rows: repeat(2, minmax(0, 1fr));
            flex: 1;
            gap: 10px;
            min-height: 0;
        }

        .option-card {
            display: grid;
            align-content: center;
            justify-items: center;
            row-gap: 22px;
            min-width: 0;
            min-height: 0;
            padding: 24px 28px;
            border: 1.5px solid;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 5px 14px rgba(31, 55, 89, 0.05);
            transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
        }

        .option-card:active,
        .option-card.is-activating {
            transform: translateY(2px) scale(0.975);
        }

        .option-card.is-activating {
            pointer-events: none;
        }

        .cash-card {
            --option-accent: var(--cash);
            border-color: var(--cash-border);
            background: var(--cash-light);
        }

        .card-card {
            --option-accent: var(--card);
            border-color: var(--card-border);
            background: var(--card-light);
        }

        .cash-card:active,
        .cash-card.is-activating {
            border-color: var(--cash);
            background: #E4F4EA;
            box-shadow: inset 0 0 0 1px var(--cash), 0 8px 18px rgba(22, 122, 74, 0.13);
        }

        .card-card:active,
        .card-card.is-activating {
            border-color: var(--card);
            background: #E6EDF7;
            box-shadow: inset 0 0 0 1px var(--card), 0 8px 18px rgba(49, 94, 155, 0.13);
        }

        .option-name {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 9px;
            color: var(--option-accent);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.08em;
            line-height: 1.1;
        }

        .option-name::after {
            width: 34px;
            height: 2px;
            border-radius: 999px;
            background: var(--option-accent);
            content: "";
        }

        .option-value {
            display: grid;
            justify-items: center;
            gap: 8px;
            width: 100%;
            min-width: 0;
        }

        .option-caption {
            color: var(--text-grey);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.13em;
            line-height: 1;
        }

        .option-amount {
            width: 100%;
            min-width: 0;
            color: var(--amount);
            font-size: 38px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.035em;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
        }

        .option-amount.amount-compact {
            font-size: 32px;
        }

        .option-amount.amount-tight {
            font-size: 25px;
            letter-spacing: -0.025em;
        }

        @media (max-width: 400px) {
            body {
                background: var(--bg-body);
            }

            .phone-frame {
                width: 100vw;
                height: 100dvh;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <div class="phone-frame">
        <div class="android-status-bar" role="status" aria-label="Device status">
            <time class="status-time" id="status-time">09:41</time>
            <div class="status-icons">
                <span class="status-network-label">4G</span>
                <svg class="status-icon" viewBox="0 0 24 24" aria-label="Wi-Fi connected">
                    <path d="M12 18.5 15 22H9l3-3.5Zm0-5.5c2.34 0 4.47.86 6.11 2.28l-2.08 2.43A6.15 6.15 0 0 0 12 16.2a6.15 6.15 0 0 0-4.03 1.51l-2.08-2.43A9.34 9.34 0 0 1 12 13Zm0-6c4.08 0 7.8 1.49 10.66 3.96l-2.08 2.43A13.04 13.04 0 0 0 12 10.2c-3.28 0-6.28 1.2-8.58 3.19l-2.08-2.43A16.26 16.26 0 0 1 12 7Z"></path>
                </svg>
                <span class="status-battery" aria-label="Battery 100 percent">
                    <span class="status-battery-value">100</span>
                    <span class="status-battery-icon" aria-hidden="true">
                        <span class="status-battery-level"></span>
                    </span>
                </span>
            </div>
        </div>

        <header class="header">
            <button class="icon-btn" type="button" onclick="handleBack()" aria-label="Back">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
            </button>
            <div class="merchant-name" data-merchant-name>Merchant</div>
        </header>

        <section class="merchant-stage" aria-label="Merchant identity">
            <div class="merchant-logo-slot" data-merchant-logo-slot data-shape="round">
                <img data-merchant-logo src="merchant-default.svg" alt="Default merchant logo">
            </div>
        </section>

        <main class="content-sheet">
            <h1 class="section-title">SELECT REFUND METHOD</h1>
            <section class="refund-options" aria-label="Refund methods">
                <button class="option-card cash-card" id="cash-refund-card" type="button"
                    onclick="chooseRefund('cash', this)" aria-label="Cash refund">
                    <span class="option-name">CASH</span>
                    <span class="option-value">
                        <span class="option-caption">REFUND AMOUNT</span>
                        <strong class="option-amount" id="cash-refund-amount">$100.00</strong>
                    </span>
                </button>

                <button class="option-card card-card" id="card-refund-card" type="button"
                    onclick="chooseRefund('card', this)" aria-label="Card refund">
                    <span class="option-name">CARD</span>
                    <span class="option-value">
                        <span class="option-caption">REFUND AMOUNT</span>
                        <strong class="option-amount" id="card-refund-amount">$100.00</strong>
                    </span>
                </button>
            </section>
        </main>
    </div>

    <script src="merchant-context.js"></script>
    <script>
        const statusTime = document.getElementById("status-time");
        const cashAmountEl = document.getElementById("cash-refund-amount");
        const cardAmountEl = document.getElementById("card-refund-amount");
        const refundAmountCents = resolveRefundAmountCents();
        let refundNavigationPending = false;

        function parseMoneyToCents(value) {
            if (value === null || value === undefined || value === "") return null;
            const amount = Number(value);
            if (!Number.isFinite(amount) || amount < 0) return null;
            return Math.round(amount * 100);
        }

        function resolveRefundAmountCents() {
            const params = new URLSearchParams(window.location.search);
            const queryCentsText = params.get("amountCents");
            const queryCents = Number(queryCentsText);
            if (queryCentsText !== null && queryCentsText !== "" && Number.isFinite(queryCents) && queryCents > 0) {
                return Math.round(queryCents);
            }

            const queryAmount = parseMoneyToCents(params.get("amount"));
            if (queryAmount !== null && queryAmount > 0) return queryAmount;

            const storedAmount = Number(localStorage.getItem("amountCents"));
            if (Number.isFinite(storedAmount) && storedAmount > 0) return Math.round(storedAmount);

            return 10000;
        }

        function formatMoney(cents) {
            return (Math.max(0, cents) / 100).toLocaleString("en-US", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function setOptionAmount(element, cents) {
            const amountText = "$" + formatMoney(cents);
            element.textContent = amountText;
            element.setAttribute("aria-label", amountText);
            element.classList.toggle("amount-compact", amountText.length >= 11);
            element.classList.toggle("amount-tight", amountText.length >= 14);
        }

        function syncView() {
            setOptionAmount(cashAmountEl, refundAmountCents);
            setOptionAmount(cardAmountEl, refundAmountCents);
            document.getElementById("cash-refund-card").setAttribute(
                "aria-label",
                "Cash refund " + cashAmountEl.textContent
            );
            document.getElementById("card-refund-card").setAttribute(
                "aria-label",
                "Card refund " + cardAmountEl.textContent
            );
        }

        function handleBack() {
            if (window.history.length > 1) {
                window.history.back();
                return;
            }
            window.location.href = "1.unified_pos.html";
        }

        function proceedToRefund(method) {
            const paymentMethod = method === "cash" ? "cash" : "card";
            localStorage.setItem("amountCents", String(refundAmountCents));
            localStorage.setItem("finalAmountCents", String(refundAmountCents));
            localStorage.setItem("paymentMethod", paymentMethod);
            localStorage.setItem("transactionType", "refund");

            const receiptParams = new URLSearchParams({
                amount: (refundAmountCents / 100).toFixed(2),
                amountCents: String(refundAmountCents),
                paymentMethod: paymentMethod,
                transactionType: "refund",
                currency: "USD"
            });
            if (window.MerchantContext) window.MerchantContext.appendTo(receiptParams);
            window.location.href = "6_receipt.html?" + receiptParams.toString();
        }

        function chooseRefund(method, cardElement) {
            if (refundNavigationPending) return;
            refundNavigationPending = true;
            cardElement.classList.add("is-activating");
            window.setTimeout(() => proceedToRefund(method), 160);
        }

        function updateStatusTime() {
            statusTime.textContent = new Intl.DateTimeFormat("en-US", {
                hour: "2-digit",
                minute: "2-digit",
                hour12: false
            }).format(new Date());
        }

        syncView();
        updateStatusTime();
        window.setInterval(updateStatusTime, 1000);
    </script>
</body>

</html>
