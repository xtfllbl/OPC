<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Processing</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --primary-gradient: linear-gradient(135deg, #007AFF 0%, #0056b3 100%);
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --text-main: #FFFFFF;
            --text-sub: #A0A0A0;
            --accent-warning: #FFD700;
            --accent-success: #2ed37a;
            --accent-success-deep: #1c8f55;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .device-container {
            width: 480px;
            height: 100vh;
            max-height: 800px;
            background: radial-gradient(140% 120% at 50% 0%, #1a1a1a 0%, #121212 45%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.55);
        }

        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
            height: 60px;
        }

        .unlock-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
            gap: 36px;
        }

        .status-title {
            font-size: 34px;
            font-weight: 800;
            margin-top: 2px;
        }

        .check-visual {
            position: relative;
            width: 240px;
            height: 260px;
            display: grid;
            place-items: center;
        }

        .check-visual::before {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(46, 211, 122, 0.45), rgba(46, 211, 122, 0));
            filter: blur(6px);
            animation: successPulse 2.8s ease-in-out infinite;
        }

        .check-circle {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #7ef0b3 0%, var(--accent-success) 48%, var(--accent-success-deep) 100%);
            box-shadow: 0 18px 40px rgba(26, 180, 103, 0.35), inset 0 0 14px rgba(255, 255, 255, 0.2);
            display: grid;
            place-items: center;
            position: relative;
            z-index: 1;
        }

        .check-icon {
            width: 96px;
            height: 72px;
        }

        .check-icon path {
            fill: none;
            stroke: #0f2f1f;
            stroke-width: 14;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 140;
            stroke-dashoffset: 140;
            animation: checkDraw 1.1s ease-out forwards;
        }

        .footer {
            padding: 20px 24px 26px;
            display: flex;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .return-btn {
            width: 100%;
            height: 60px;
            background: linear-gradient(135deg, #33e08a 0%, #1bb968 100%);
            border: none;
            border-radius: 14px;
            color: #0e1f15;
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 0.6px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 24px rgba(28, 185, 104, 0.3);
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s ease;
        }

        .return-btn:active {
            transform: scale(0.98);
        }

        .return-countdown {
            font-size: 16px;
            font-weight: 700;
            color: rgba(14, 31, 21, 0.7);
        }

        .return-btn--ready .return-countdown {
            opacity: 0.7;
        }

        @keyframes successPulse {
            0%, 100% { opacity: 0.25; transform: scale(0.98); }
            50% { opacity: 0.7; transform: scale(1.04); }
        }

        @keyframes checkDraw {
            from { stroke-dashoffset: 140; }
            to { stroke-dashoffset: 0; }
        }

        @media screen and (max-height: 500px) {
            .header { padding: 8px 15px; height: 50px; }
            .unlock-section { padding: 16px; gap: 24px; }
            .status-title { font-size: 26px; }
            .check-visual { width: 190px; height: 220px; }
            .check-circle { width: 130px; height: 130px; }
            .check-icon { width: 72px; height: 54px; }
            .footer { padding: 12px 20px 16px; }
            .return-btn { height: 48px; font-size: 18px; }
            .return-countdown { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="device-container">
        <div class="header">
            <span>WP5120Q3000001</span>
        </div>

        <div class="unlock-section">
            <div>
                <div class="status-title">Order being processed.</div>
            </div>

            <div class="check-visual" aria-hidden="true">
                <div class="check-circle">
                    <svg class="check-icon" viewBox="0 0 100 70" aria-hidden="true">
                        <path d="M6 38 L38 64 L94 6" />
                    </svg>
                </div>
            </div>
        </div>

        <div class="footer">
            <button class="return-btn" type="button">
                RETURN <span class="return-countdown">(10s)</span>
            </button>
        </div>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const returnBtn = document.querySelector('.return-btn');
            const countdownEl = document.querySelector('.return-countdown');
            if (!returnBtn || !countdownEl) return;

            let remaining = 10;
            let timer = null;

            const updateCountdown = () => {
                countdownEl.textContent = `(${remaining}s)`;
                if (remaining === 0) {
                    returnBtn.classList.add('return-btn--ready');
                    clearInterval(timer);
                    return;
                }
                remaining -= 1;
            };

            returnBtn.addEventListener('click', () => {
                window.history.back();
            });

            updateCountdown();
            timer = setInterval(updateCountdown, 1000);
        });
    </script>
</body>
</html>
