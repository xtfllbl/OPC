<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-QR Info</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --primary-gradient: linear-gradient(135deg, #007AFF 0%, #0056b3 100%);
            --bg-color: #121212;
            --text-main: #FFFFFF;
            --text-sub: #A0A0A0;
            --input-bg: rgba(8, 8, 8, 0.7);
            --input-border: rgba(255, 255, 255, 0.18);
            --input-border-focus: rgba(0, 122, 255, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .device-container {
            width: 480px;
            height: 100vh;
            max-height: 800px;
            background: radial-gradient(140% 120% at 50% 0%, #1a1a1a 0%, #121212 45%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.55);
        }

        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            height: 60px;
            z-index: 2;
        }

        .device-id {
            font-weight: 600;
            letter-spacing: 0.6px;
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 20px;
            position: relative;
            z-index: 1;
        }

        .form-layout {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 28px;
            max-width: 380px;
            margin: 0 auto;
        }

        .form-title {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
        }

        .field-list {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .field-row {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
        }

        .field-label {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: none;
            color: var(--text-main);
        }

        .field-input,
        .field-inputs {
            width: 100%;
        }

        .field-input {
            height: 68px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 18px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .field-input:focus-within {
            border-color: var(--input-border-focus);
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.12);
        }

        .field-inputs {
            display: flex;
            width: 100%;
        }

        .select-wrap {
            position: relative;
        }

        .select-wrap::after {
            content: "";
            position: absolute;
            top: 50%;
            right: 12px;
            width: 10px;
            height: 10px;
            border-right: 2px solid rgba(255, 255, 255, 0.5);
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            transform: translateY(-50%) rotate(45deg);
            pointer-events: none;
        }

        input,
        select {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 20px;
            outline: none;
            user-select: text;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        select {
            appearance: none;
        }

        .phone-input {
            height: 68px;
            display: grid;
            grid-template-columns: 130px 1fr;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 18px;
            padding: 0 12px 0 16px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .phone-input:focus-within {
            border-color: var(--input-border-focus);
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.12);
        }

        .phone-input .select-wrap {
            height: 100%;
            display: flex;
            align-items: center;
            padding-right: 16px;
            border-right: 1px solid rgba(255, 255, 255, 0.12);
        }

        .phone-input input {
            height: 100%;
            padding-left: 14px;
        }

        .footer {
            padding: 16px 24px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
        }

        .primary-btn {
            width: 100%;
            max-width: 380px;
            height: 56px;
            border: none;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #02192d;
            background: var(--primary-gradient);
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 24px rgba(0, 122, 255, 0.3);
        }

        .primary-btn:active {
            transform: scale(0.98);
        }

        @media screen and (max-height: 580px) {
            .header { padding: 10px 16px; height: 52px; }
            .content { padding: 12px 14px; }
            .form-title { font-size: 20px; }
            .form-layout { max-width: 320px; }
            .field-label { font-size: 16px; }
            .field-input { height: 54px; }
            .phone-input { height: 54px; grid-template-columns: 110px 1fr; }
            input, select { font-size: 16px; }
            .footer { padding: 12px 16px 16px; }
            .primary-btn { height: 48px; font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="device-container">
        <div class="header">
            <span class="device-id">WP5120Q3000001</span>
            <span id="clock">10:24</span>
        </div>

        <div class="content">
            <div class="form-layout">
                <div class="form-title">Enter your information</div>
                <div class="field-list">
                    <div class="field-row">
                        <div class="field-label">Name</div>
                        <div class="field-input">
                            <input type="text" placeholder="Full name">
                        </div>
                    </div>

                    <div class="field-row">
                        <div class="field-label">Email</div>
                        <div class="field-input">
                            <input type="email" placeholder="name@example.com">
                        </div>
                    </div>

                    <div class="field-row">
                        <div class="field-label">Phone Number</div>
                        <div class="field-inputs phone-input">
                            <div class="select-wrap">
                                <select>
                                    <option value="+60">+60 MY</option>
                                    <option value="+65">+65 SG</option>
                                    <option value="+86">+86 CN</option>
                                    <option value="+852">+852 HK</option>
                                    <option value="+81">+81 JP</option>
                                    <option value="+1">+1 US</option>
                                </select>
                            </div>
                            <input type="tel" inputmode="numeric" placeholder="8123 4567">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <button class="primary-btn">Confirm</button>
        </div>
    </div>

    <script>
        (function () {
            var clock = document.getElementById("clock");
            if (clock) {
                var now = new Date();
                var hours = String(now.getHours()).padStart(2, "0");
                var minutes = String(now.getMinutes()).padStart(2, "0");
                clock.textContent = hours + ":" + minutes;
            }
        })();
    </script>
</body>
</html>
