<div id="tip-review" class="viz-carousel viz-dotted-background" aria-label="Tip Adjust 布局方案" data-previous-label="上一方案" data-next-label="下一方案">
  <section data-variant="A · 单行导航" aria-label="A 单行导航"><div class="ta-product" data-design="a"></div></section>
  <section data-variant="B · 交易卡导航" aria-label="B 交易卡导航" hidden><div class="ta-product" data-design="b"></div></section>
  <section data-variant="C · 底部切换" aria-label="C 底部切换" hidden><div class="ta-product" data-design="c"></div></section>
</div>
<style>
#tip-review .ta-product{--ta-bg:light-dark(#f8f9fd,#171d29);--ta-panel:light-dark(#fff,#222b3b);--ta-ink:light-dark(#111a2d,#f2f5fc);--ta-muted:light-dark(#64718b,#afbbcf);--ta-line:light-dark(#dfe5ef,#39465c);--ta-blue:light-dark(#155bff,#8cb1ff);--ta-purple:light-dark(#803ff5,#c5a4ff);--ta-soft:light-dark(#edf3ff,#253c60);--ta-amber:light-dark(#916000,#ffd275);width:min(100%,375px);min-height:700px;margin:16px auto 0;background:var(--ta-bg);color:var(--ta-ink);border:1px solid var(--ta-line);border-radius:24px;overflow:hidden;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-sizing:border-box;position:relative}
#tip-review .ta-product *{box-sizing:border-box}
#tip-review .ta-status{padding:10px 18px;display:flex;justify-content:space-between;background:var(--ta-panel);font-size:12px;font-weight:600}
#tip-review .ta-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;background:var(--ta-panel);border-bottom:1px solid var(--ta-line);min-height:65px}
#tip-review .ta-product button{font:inherit;cursor:inherit;min-height:44px;border:1px solid var(--ta-line);border-radius:12px;background:var(--ta-panel);color:var(--ta-ink);padding:8px 12px}
#tip-review .ta-product button:disabled{opacity:.35}
#tip-review .ta-product button.ta-plain{background:transparent;border-color:transparent;padding:6px}
#tip-review .ta-product button.ta-primary{background:var(--ta-blue);color:light-dark(#fff,#101b32);border-color:var(--ta-blue);font-weight:650}
#tip-review .ta-product button.ta-nav{width:44px;padding:4px;font-size:23px}
#tip-review .ta-navgroup{display:flex;align-items:center;gap:9px}
#tip-review .ta-context{padding:16px 18px 8px;color:var(--ta-muted);font-size:12px}
#tip-review .ta-record{margin:8px 16px;padding:14px 0;border-bottom:1px solid var(--ta-line)}
#tip-review .ta-record.ta-card{padding:14px;border:1px solid var(--ta-line);border-radius:16px;background:var(--ta-panel)}
#tip-review .ta-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0;flex-wrap:wrap}
#tip-review .ta-sub{font-size:12px;color:var(--ta-muted)}
#tip-review .ta-badge{font-size:10px;letter-spacing:.2px;font-weight:700;color:var(--ta-amber);background:light-dark(#fff3d5,#473c23);padding:4px 6px;border-radius:5px}
#tip-review .ta-badge[data-state="ADJUSTED"]{color:light-dark(#218334,#93e8a3);background:light-dark(#e6f4e9,#24432e)}
#tip-review .ta-badge[data-state="SAVED"]{color:var(--ta-blue);background:var(--ta-soft)}
#tip-review .ta-amount{text-align:center;padding:20px 18px 14px}
#tip-review .ta-label{font-size:12px;letter-spacing:1.5px;color:var(--ta-muted);font-weight:650}
#tip-review .ta-money{color:var(--ta-blue);font-size:52px;font-weight:750;letter-spacing:-2px;margin:4px 0 12px;font-variant-numeric:tabular-nums}
#tip-review .ta-totals{max-width:280px;margin:auto;font-size:13px}
#tip-review .ta-new{color:var(--ta-purple);font-size:18px;font-weight:700}
#tip-review .ta-keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,64px);gap:8px;padding:12px 16px 16px}
#tip-review .ta-keypad button{font-size:24px;font-weight:650;border-radius:16px;padding:4px}
#tip-review .ta-keypad .ta-save{grid-column:4;grid-row:3 / 5;font-size:16px}
#tip-review .ta-keypad .ta-double{grid-column:2 / 4}
#tip-review .ta-keypad .ta-clear{color:light-dark(#df2929,#ffaaaa);background:light-dark(#fff4f4,#452a30)}
#tip-review .ta-bottom{display:flex;justify-content:space-between;align-items:center;padding:0 16px 14px;gap:8px}
#tip-review .ta-footer-note{text-align:center;color:var(--ta-muted);font-size:11px;min-height:26px}
#tip-review .ta-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:10px 9px;gap:3px;border-bottom:1px solid var(--ta-line)}
#tip-review .ta-filters button{font-size:11px;padding:5px 1px;white-space:nowrap;border-color:transparent;background:transparent;border-radius:8px}
#tip-review .ta-filters button[aria-pressed="true"]{color:var(--ta-blue);background:var(--ta-soft)}
#tip-review .ta-listrow{display:block;width:100%;text-align:left;border:0!important;border-bottom:1px solid var(--ta-line)!important;border-radius:0!important;padding:15px 16px!important}
#tip-review .ta-summary{margin:18px 16px;padding:16px;border-radius:14px;background:var(--ta-panel);border:1px solid var(--ta-line)}
#tip-review .ta-search{margin:10px 16px;width:calc(100% - 32px);padding:10px;border:1px solid var(--ta-line);background:var(--ta-panel);color:var(--ta-ink);border-radius:9px;font:inherit}
#tip-review .ta-product[data-design="c"] .ta-amount{padding-top:12px}
#tip-review .ta-product[data-design="c"] .ta-record{margin-top:0}
#tip-review .ta-product[data-design="b"] .ta-money{font-size:48px}
#tip-review .ta-product[data-design="b"] .ta-amount{padding-top:10px}
#tip-review .ta-empty{padding:28px 16px;color:var(--ta-muted);text-align:center}
@media(max-width:380px){#tip-review .ta-product{min-height:720px}#tip-review .ta-keypad{padding:10px;gap:6px}#tip-review .ta-top{gap:4px;padding:10px}#tip-review .ta-navgroup{gap:4px}}
</style>
<script>
(() => {
const root=document.getElementById('tip-review');
const money=n=>'$'+(n/100).toFixed(2);
root.querySelectorAll('.ta-product').forEach(product=>{
 const design=product.dataset.design;
 const records=[{id:'001105',time:'5:25 PM',card:'MASTERCARD •••• 0198',base:3422,tip:125,status:'UNADJUSTED'},{id:'001107',time:'5:23 PM',card:'DISCOVER •••• 4407',base:4742,tip:0,status:'UNADJUSTED'},{id:'001100',time:'5:30 PM',card:'VISA •••• 4242',base:1924,tip:0,status:'ADJUSTED'}];
 let index=0,view='editor',entry='500',filter='All',search=false,query='',notice='';
 const staged=new Map();
 const nav=()=>`<div class="ta-navgroup"><button class="ta-nav cursor-interaction" data-action="prev" aria-label="上一笔" ${index===0?'disabled':''}>‹</button><span class="ta-sub">${index+1} / ${records.length}</span><button class="ta-nav cursor-interaction" data-action="next" aria-label="下一笔" ${index===records.length-1?'disabled':''}>›</button></div>`;
 const state=r=>staged.has(r.id)?'SAVED':r.status;
 const card=(r,withNav)=>`<div class="ta-record ${withNav?'ta-card':''}"><div class="ta-row"><strong>#${r.id} · Sale</strong><span class="ta-badge" data-state="${state(r)}">${state(r)}</span></div><div class="ta-row ta-sub"><span>09/16/2026 · ${r.time}</span></div><div class="ta-row ta-sub"><span>${r.card}</span>${withNav?nav():''}</div></div>`;
 const key=(text,cls='')=>`<button class="cursor-interaction ${cls}" data-key="${text}">${text}</button>`;
 const keypad=()=>`<div class="ta-keypad">${key('7')}${key('8')}${key('9')}${key('⌫')}${key('4')}${key('5')}${key('6')}${key('C','ta-clear')}${key('1')}${key('2')}${key('3')}${key('SAVE','ta-primary ta-save')}${key('0')}${key('00','ta-double')}</div>`;
 const row=r=>`<button class="ta-listrow cursor-interaction" data-id="${r.id}"><div class="ta-row"><strong>${r.time}</strong><strong>${money(r.base+r.tip)}</strong></div><div class="ta-row ta-sub"><span>#${r.id} · ${r.card}</span></div><div class="ta-row ta-sub"><span>Tip ${money(r.tip)}${staged.has(r.id)?' → '+money(staged.get(r.id)):''}</span><span class="ta-badge" data-state="${state(r)}">${state(r)}</span></div></button>`;
 function render(){
 const r=records[index];
 let content='';
 if(view==='editor'){
 const header=design==='a'?`<button class="ta-plain cursor-interaction" data-action="list">‹ List</button>${nav()}`:`<button class="ta-plain cursor-interaction" data-action="list">‹ List</button><span class="ta-sub">Tip Adjust</span>`;
 const amount=`<div class="ta-amount"><div class="ta-label">TIP AMOUNT</div><div class="ta-money" data-money>${money(Number(entry))}</div><div class="ta-totals"><div class="ta-row"><span>Transaction Amount</span><strong>${money(r.base)}</strong></div><div class="ta-row ta-new"><span>New Total</span><span data-total>${money(r.base+Number(entry))}</span></div></div></div>`;
 content=`<div class="ta-top">${header}</div>${design==='a'?'<div class="ta-context">Tip Adjust</div>':''}${design==='c'?amount+card(r,false):card(r,design==='b')+amount}${keypad()}${design==='c'?'<div class="ta-bottom"><span class="ta-sub">Transaction</span>'+nav()+'</div>':''}<div class="ta-footer-note" aria-live="polite">${notice||'Save to queue · Review before processing'}</div>`;
 }else if(view==='list'){
 const match=records.filter(r=>(filter==='All'||(filter==='Saved'?staged.has(r.id):filter==='Adjusted'?state(r)==='ADJUSTED':state(r)==='UNADJUSTED'))&&(!query||r.id.includes(query)||r.card.toLowerCase().includes(query.toLowerCase())));
 content=`<div class="ta-top"><button class="ta-plain cursor-interaction" data-action="editor">‹</button><strong>Tip Adjust</strong><button class="ta-plain cursor-interaction" data-action="search" aria-label="搜索"><i data-lucide="search" aria-hidden="true"></i></button><button class="ta-primary cursor-interaction" data-action="summary" ${staged.size?'':'disabled'}>Review (${staged.size})</button></div>${search?'<input class="ta-search" aria-label="Receipt or card" placeholder="Receipt / Card last four" value="">':''}<div class="ta-filters">${['All','Unadjusted','Saved','Adjusted'].map(f=>`<button class="cursor-interaction" data-filter="${f}" aria-pressed="${f===filter}">${f}</button>`).join('')}</div><div class="ta-context">Batch #2071 · ${match.length} transactions</div><div data-rows>${match.map(row).join('')||'<div class="ta-empty">No transactions</div>'}</div>`;
 }else if(view==='summary'){
 const selected=records.filter(r=>staged.has(r.id));
 content=`<div class="ta-top"><button class="ta-plain cursor-interaction" data-action="list">‹ List</button><strong>Tip Summary</strong></div><div class="ta-summary"><div class="ta-row"><span>Saved transactions</span><strong>${selected.length}</strong></div><div class="ta-row"><span>New tips</span><strong>${money(selected.reduce((n,r)=>n+staged.get(r.id),0))}</strong></div><div class="ta-sub">All saved items in Batch #2071</div></div>${selected.map(row).join('')}<div class="ta-summary"><button class="ta-primary cursor-interaction" data-action="process">Process ${selected.length} adjustments</button></div>`;
 }else{content=`<div class="ta-top"><strong>Tip Adjust</strong></div><div class="ta-summary"><div class="ta-row"><strong>Adjustments completed</strong></div><button class="ta-primary cursor-interaction" data-action="list">Done</button></div>`;}
 product.innerHTML=`<div class="ta-status"><span>16:46</span><span>4G　▰ 80%</span></div>${content}`;
 if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});
 }
 product.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 const action=b.dataset.action;
 if(b.dataset.key){const k=b.dataset.key;if(k==='SAVE'){staged.set(records[index].id,Number(entry));notice='Saved · Pending processing';render();return;}notice='';entry=k==='C'?'0':k==='⌫'?(entry.slice(0,-1)||'0'):(entry==='0'?'':entry)+k;entry=entry.slice(0,7);product.querySelector('[data-money]').textContent=money(Number(entry));product.querySelector('[data-total]').textContent=money(records[index].base+Number(entry));return;}
 if(b.dataset.filter){filter=b.dataset.filter;render();return;}
 if(b.dataset.id){index=records.findIndex(r=>r.id===b.dataset.id);entry=String(staged.get(records[index].id)??records[index].tip);view='editor';notice='';}
 if(action==='next'||action==='prev'){index+=action==='next'?1:-1;entry=String(staged.get(records[index].id)??records[index].tip);notice='';}
 if(['list','summary','editor'].includes(action))view=action;
 if(action==='search')search=!search;
 if(action==='process'){records.forEach(r=>{if(staged.has(r.id)){r.tip=staged.get(r.id);r.status='ADJUSTED';}});staged.clear();view='result';}
 render();
 });
 product.addEventListener('input',e=>{if(e.target.matches('.ta-search')){query=e.target.value;const match=records.filter(r=>(filter==='All'||(filter==='Saved'?staged.has(r.id):filter==='Adjusted'?state(r)==='ADJUSTED':state(r)==='UNADJUSTED'))&&(!query||r.id.includes(query)||r.card.toLowerCase().includes(query.toLowerCase())));product.querySelector('[data-rows]').innerHTML=match.map(row).join('')||'<div class="ta-empty">No transactions</div>';}});
 render();
});
})();
</script>
